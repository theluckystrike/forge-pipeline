        \        else:\n            value=json.dumps({'id':'chatcmpl-local-fixture','object':'chat.completion','created':0,'model':model,'choices':[{'index':0,'message':{'role':'assistant','content':'Hello'},'finish_reason':'stop'}],'usage':usage}).encode()\n\
        \            self.send_response(200);self.send_header('Content-Type','application/json');self.send_header('Content-Length',str(len(value)));self.end_headers();self.wfile.write(value)\n\
        \ntry:\n    assert output(['git','rev-parse','HEAD'])==commit\n    assert output(['git','status','--porcelain'])==''\n    assert all(sha((source/name).read_bytes())==digest\
