# LOCAL PROPOSAL ONLY. Real-server contracts plus independent whole-module race; failures remain failures.
name: Goclaw real-server contract diagnostic
'on':
  workflow_dispatch: null
permissions: {}
concurrency:
  group: goclaw-real-server-contract-diagnostic
  cancel-in-progress: false
jobs:
  contracts:
    if: github.repository == 'theluckystrike/forge-pipeline' && github.actor == 'theluckystrike' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      pg:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: goclaw_test
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      AWS_PROFILE: goclaw-contracts-no-credentials
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_CONFIG_FILE: /dev/null
      AWS_EC2_METADATA_DISABLED: 'true'
    defaults:
      run:
        working-directory: source
    steps:
    - name: Fetch public exact reviewed commit without credentials
      id: source
      working-directory: .
      shell: bash
      run: 'set -euo pipefail

        git init source

        git -C source remote add origin https://github.com/theluckystrike/goclaw.git

        git -C source fetch --no-tags --depth=1 origin b98309ac06449942b2833e7745c7449ee75ae85f

        git -C source checkout --detach FETCH_HEAD

        '
    - name: Verify committed source and all14 hashes
      id: admit
      shell: python
      run: 'import subprocess,hashlib,json

        from pathlib import Path

        assert subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip()==''b98309ac06449942b2833e7745c7449ee75ae85f''

        assert subprocess.check_output([''git'',''status'',''--porcelain''])==b''''

        expected={''docs/14-skills-runtime.md'': ''07a50e39853ffbee19ad10f49aaef8eb5f8f9c691080844b2ed53f86047d2c2f'', ''internal/http/skills.go'':
        ''e56ff4a3a8478793c11474490a2b8730295104cca6daf90efb7e0cf04a5502c2'', ''internal/http/skills_lifecycle.go'': ''82acd271ad6ec5e245c31b75033a4a4b2d213b3047e4ba7502ffef01011ee3c1'',
        ''internal/http/skills_lifecycle_deps.go'': ''c38d00d3e61ed161d14edbcc811509615eab5434274567110df1842a61f64db7'', ''internal/http/skills_lifecycle_test.go'':
        ''59eaf3b6ad0fbeb00addc361125a90237c4a2bfb6431317a761d51e148cbc2f2'', ''internal/http/skills_upload_test.go'': ''0e056effca738b02ede4babc3fba272b65cabaec52d36d8e59b719c5f6c8901a'',
        ''internal/skills/dep_checker.go'': ''f01c423d66d013c9726a1c250bd4b57c58bc0861349a85c392782f0ded9a3e88'', ''internal/skills/dep_checker_test.go'':
        ''343ecbace7230c5a57c6920ffdcda1158da3395928756dc43eeaf734ac456acc'', ''internal/skills/seeder.go'': ''31f37c788b948e3757a6361b6d33288f2fee6c290487be7d0b6cb4e8dbbcf379'',
        ''internal/skills/seeder_test.go'': ''c974aa0385ad63a7d1969a122d5bdc9cccaf0a686da5a1db6a2d8287a4177bed'', ''internal/store/pg/skills_admin.go'':
        ''8b1c26714d86660b5037bd2c52916760ad88879f5c79207708fc6ce986ddd593'', ''internal/store/sqlitestore/skills_content.go'': ''50da975e2ed6134ffde6e0b97201ae53905966354a8ff1561c15f694acd7009f'',
        ''internal/store/sqlitestore/skills_test.go'': ''63033832e04706b7642d812abf3d2f77cd3d298539a98f8ea28ec580efd20bdd'', ''tests/integration/v3_skills_store_test.go'':
        ''27aea553054bd11be543a8430a0aacf9e5043aa5e4de36f6556d7fa37f2010e8''}

        for name,digest in expected.items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name

        print(json.dumps({''source_commit'':''b98309ac06449942b2833e7745c7449ee75ae85f'',''verified_files'':len(expected),''state'':''EXACT_REVIEWED_COMMITTED_SOURCE''}))

        '
    - name: Pinned Go1.26.0, no cache or repository credential
      id: toolchain
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
      with:
        go-version: 1.26.0
        cache: false
        token: ''
    - name: Build real gateway outside the source tree
      id: build
      shell: bash
      run: 'set -euo pipefail

        mkdir -p "$RUNNER_TEMP/goclaw-contract-fixture"

        CGO_ENABLED=0 timeout 600 go build -o "$RUNNER_TEMP/goclaw-contract-fixture/goclaw" .

        sha256sum "$RUNNER_TEMP/goclaw-contract-fixture/goclaw"

        '
    - name: Run real gateway, deterministic local provider, and unchanged contract suite
      id: contracts
      shell: python
      env:
        PG_CONTAINER_ID: ${{ job.services.pg.id }}
      run: "# Remote-only proposal. Never execute this harness on the Mac.\nimport os,sys,json,subprocess,hashlib,time,threading,traceback,urllib.request,urllib.error,ipaddress\n\
        from pathlib import Path\nfrom http.server import ThreadingHTTPServer,BaseHTTPRequestHandler\nfrom collections import defaultdict\n\n\
        source=Path.cwd()\nfixture=Path(os.environ['RUNNER_TEMP'])/'goclaw-contract-fixture'\nfixture.mkdir(exist_ok=True)\ncommit='b98309ac06449942b2833e7745c7449ee75ae85f'\n\
        pg=os.environ['PG_CONTAINER_ID']\nnetwork='goclaw-contract-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']\ngateway_name=network+'-gateway'\n\
        user='contract-test-user';token='contract-local-token';mock_requests=[]\nrequired={'github.com/nextlevelbuilder/goclaw/tests/contracts/http_api':\
        \ ['TestContract_HTTP_AgentsList', 'TestContract_HTTP_ChatCompletions', 'TestContract_HTTP_ChatCompletions_Usage', 'TestContract_HTTP_ProvidersList'],\
        \ 'github.com/nextlevelbuilder/goclaw/tests/contracts/ws_methods': ['TestContract_WS_AgentsList', 'TestContract_WS_ChatSend', 'TestContract_WS_SessionsList',\
        \ 'TestContract_WS_ConfigGet', 'TestContract_WS_Connect', 'TestContract_WS_SkillsList']}\nexpected_files={'docs/14-skills-runtime.md':\
        \ '07a50e39853ffbee19ad10f49aaef8eb5f8f9c691080844b2ed53f86047d2c2f', 'internal/http/skills.go': 'e56ff4a3a8478793c11474490a2b8730295104cca6daf90efb7e0cf04a5502c2',\
        \ 'internal/http/skills_lifecycle.go': '82acd271ad6ec5e245c31b75033a4a4b2d213b3047e4ba7502ffef01011ee3c1', 'internal/http/skills_lifecycle_deps.go':\
        \ 'c38d00d3e61ed161d14edbcc811509615eab5434274567110df1842a61f64db7', 'internal/http/skills_lifecycle_test.go': '59eaf3b6ad0fbeb00addc361125a90237c4a2bfb6431317a761d51e148cbc2f2',\
        \ 'internal/http/skills_upload_test.go': '0e056effca738b02ede4babc3fba272b65cabaec52d36d8e59b719c5f6c8901a', 'internal/skills/dep_checker.go':\
        \ 'f01c423d66d013c9726a1c250bd4b57c58bc0861349a85c392782f0ded9a3e88', 'internal/skills/dep_checker_test.go': '343ecbace7230c5a57c6920ffdcda1158da3395928756dc43eeaf734ac456acc',\
        \ 'internal/skills/seeder.go': '31f37c788b948e3757a6361b6d33288f2fee6c290487be7d0b6cb4e8dbbcf379', 'internal/skills/seeder_test.go': 'c974aa0385ad63a7d1969a122d5bdc9cccaf0a686da5a1db6a2d8287a4177bed',\
        \ 'internal/store/pg/skills_admin.go': '8b1c26714d86660b5037bd2c52916760ad88879f5c79207708fc6ce986ddd593', 'internal/store/sqlitestore/skills_content.go':\
        \ '50da975e2ed6134ffde6e0b97201ae53905966354a8ff1561c15f694acd7009f', 'internal/store/sqlitestore/skills_test.go': '63033832e04706b7642d812abf3d2f77cd3d298539a98f8ea28ec580efd20bdd',\
        \ 'tests/integration/v3_skills_store_test.go': '27aea553054bd11be543a8430a0aacf9e5043aa5e4de36f6556d7fa37f2010e8'}\nsha=lambda b:hashlib.sha256(b).hexdigest()\n\
        receipt={'kind':'real-server-contract-diagnostic','source_commit':commit,'contracts_passed':False,'go_fix_gate':'KNOWN_FAILED; not retried\
