        \ output(['docker','exec',pg,'psql','-U','postgres','-d','goclaw_test','-At','-v','ON_ERROR_STOP=1','-c',query])\ndef request(base,path,body=None,identified=True):\n\
        \    headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'}\n    if identified:headers['X-GoClaw-User-Id']=user\n\
        \    req=urllib.request.Request(base+path,data=json.dumps(body).encode() if body is not None else None,headers=headers)\n    with opener.open(req,timeout=25)\
        \ as response:return json.load(response)\n\nclass Provider(BaseHTTPRequestHandler):\n    def log_message(self,fmt,*args):pass\n    def\
        \ do_POST(self):\n        size=int(self.headers.get('Content-Length','0'))\n        if self.path!='/v1/chat/completions' or size>2000000:\n\
        \            self.send_error(400);return\n        payload=json.loads(self.rfile.read(size));model=payload.get('model','contract-test')\n\
        \        mock_requests.append({'path':self.path,'model':model,'stream':bool(payload.get('stream'))})\n        usage={'prompt_tokens':1,'completion_tokens':1,'total_tokens':2}\n\
        \        if payload.get('stream'):\n            chunk={'id':'chatcmpl-local-fixture','object':'chat.completion.chunk','created':0,'model':model,'choices':[{'index':0,'delta':{'role':'assistant','content':'Hello'},'finish_reason':None}]}\n\
