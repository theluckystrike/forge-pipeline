        \    receipt['go_version']=version\n    receipt['stage']='service-verification'\n    pg_version=int(sql('SHOW server_version_num'));assert\
        \ 180000<=pg_version<190000\n    sql('CREATE EXTENSION IF NOT EXISTS vector')\n    receipt['pg_server_version_num']=pg_version;receipt['pgvector_version']=sql(\"\
        SELECT extversion FROM pg_extension WHERE extname='vector'\")\n    assert receipt['pgvector_version']\n    receipt['pg_image_id']=output(['docker','inspect','--format','{{.Image}}',pg])\n\
        \    run(['docker','pull','ubuntu:24.04'])\n    receipt['runtime_image_id']=output(['docker','image','inspect','--format','{{.Id}}','ubuntu:24.04'])\n\
        \    run(['docker','network','create','--internal',network]);created_network=True\n    net=json.loads(output(['docker','network','inspect',network]))[0];assert\
