    - name: Final explicit contract diagnostic receipt
      if: always()
      shell: python
      env:
        JOB_STATUS: ${{ job.status }}
        SOURCE: ${{ steps.source.outcome }}
        ADMIT: ${{ steps.admit.outcome }}
        TOOLCHAIN: ${{ steps.toolchain.outcome }}
        BUILD: ${{ steps.build.outcome }}
        CONTRACTS: ${{ steps.contracts.outcome }}
      run: 'import os,json

        stages={key:os.environ.get(key,'''') for key in (''SOURCE'',''ADMIT'',''TOOLCHAIN'',''BUILD'',''CONTRACTS'')}

        ok=os.environ[''JOB_STATUS'']==''success'' and all(value==''success'' for value in stages.values())

        receipt={''state'':''SERVER_BACKED_CONTRACTS_PASSED'' if ok else ''FAILED_OR_NOT_RUN'',''exit_code'':0 if ok else 1,''stage_outcomes'':stages,''source_commit'':''b98309ac06449942b2833e7745c7449ee75ae85f'',''go_fix_gate'':''KNOWN_FAILED;
        not retried or waived'',''merge_clearance'':False}

        print(json.dumps(receipt),flush=True)

        raise SystemExit(receipt[''exit_code''])

        '
  whole-module-race:
    if: github.repository == 'theluckystrike/forge-pipeline' && github.actor == 'theluckystrike' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      pg:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: goclaw_test
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      AWS_PROFILE: goclaw-contracts-no-credentials
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_CONFIG_FILE: /dev/null
      AWS_EC2_METADATA_DISABLED: 'true'
      TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/goclaw_test?sslmode=disable
    defaults:
      run:
        working-directory: source
    steps:
    - name: Fetch public exact reviewed commit without credentials
      id: source
      working-directory: .
      shell: bash
      run: 'set -euo pipefail

        git init source

        git -C source remote add origin https://github.com/theluckystrike/goclaw.git

        git -C source fetch --no-tags --depth=1 origin b98309ac06449942b2833e7745c7449ee75ae85f

        git -C source checkout --detach FETCH_HEAD

        '
    - name: Verify committed source and all14 hashes
      id: admit
      shell: python
