gn tables. Query pages, databases, blocks, and users with plain SQL and join them against your application data. All objects are read-only, and the wrapper works with Supabase Vault for secure API key management and is built on WebAssembly (Wasm) for lightweight, sandboxed execution.\\n\\n### Resources\\n\\n- [supabase/wrappers on GitHub](https://github.com/supabase/wrappers)\",\"websiteUrl\":\"https://www.notion.so\",\"docsUrl\":\"https://supabase.com/docs/guides/database/extensions/wrappers/notion\",\"installUrl\":\"https://supabase.com/dashboard/project/_/integrations/notion_wrapper/overview?utm_source=supabase\u0026utm_medium=partner_referral\u0026utm_campaign=integration_partner_program\u0026utm_content=add_integration_button\",\"logo\":\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/partners/notion/logo.svg\",\"images\":[],\"youtubeId\":null,\"type\":\"technology\",\"categories\":[{\"name\":\"Foreign Data Wrapper\",\"slug\":\"foreign-data-wrapper\"}],\"featured\":false,\"publishedInCatalog\":true,\"publishedInMarketplace\":true},{\"slug\":\"zapdigits\",\"title\":\"ZapDigits\",\"builtBy\":\"ZapDigits\",\"description\":\"Easily create dashboards for your Supabase database and user management, turning your raw data into clear, actionable insights.\",\"content\":\"$39\",\"websiteUrl\":\"https://zapdigits.com/\",\"docsUrl\":\"https://zapdigits.com/help/how-to-connect-your-supabase-account-to-zapdigits\",\"installUrl\":null,\"logo\":\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/partners/zapdigits/logo.png\",\"images\":[],\"youtubeId\":\"8HkGnVY8h4Q\",\"type\":\"technology\",\"categories\":[{\"name\":\"DevTools\",\"slug\":\"devtools\"}],\"featured\":false,\"publishedInCatalog\":true,\"publishedInMarketplace\":false},{\"slug\":\"windmill-labs\",\"title\":\"Windmill Labs\",\"builtBy\":\"Windmill Labs\",\"description\":\"Open-source platform to turn minimal scripts into internal UIs and workflows.\",\"content\":\"Open-source platform to turn minimal scripts into internal UIs and workflows.\\n\\nEasily create internal apps and invincible workflows with code only where it matters. Self-hostable worker infrastructure: scalable, reliable, fast.\\n\\nFully Open-source alternative to Airplane, Superblocks \u0026 Retool.\",\"websiteUrl\":\"https://supabase.com\",\"docsUrl\":\"https://www.windmill.dev/blog/2023/08/10/supabase-partnership\",\"installUrl\":\"https://app.windmill.dev/user/login?utm_source=supabase\u0026utm_medium=partner_referral\u0026utm_campaign=integration_partner_program\u0026utm_content=add_integration_button\",\"logo\":\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/partners/windmill-labs/logo.jpeg\",\"images\":[\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/windmill/windmill_og.png\"],\"youtubeId\":null,\"type\":\"technology\",\"categories\":[{\"name\":\"DevTools\",\"slug\":\"devtools\"}],\"featured\":true,\"publishedInCatalog\":true,\"publishedInMarketplace\":false},{\"slug\":\"directus\",\"title\":\"Directus\",\"builtBy\":\"Directus\",\"description\":\"Power any project with a modern, open source data platform.\",\"content\":\"$3a\",\"websiteUrl\":\"directus.io\",\"docsUrl\":\"https://directus.io/\",\"installUrl\":null,\"logo\":\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/partners/directus/logo.jpeg\",\"images\":[\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/directus/directus_og.png\"],\"youtubeId\":null,\"type\":\"technology\",\"categories\":[{\"name\":\"Data Platform\",\"slug\":\"data-platform\"}],\"featured\":false,\"publishedInCatalog\":true,\"publishedInMarketplace\":false},{\"slug\":\"bolt\",\"title\":\"Bolt\",\"builtBy\":\"Bolt\",\"description\":\"Bolt is an AI web development agent from StackBlitz that builds and deploys full-stack apps from a prompt, in the browser.\",\"content\":\"Bolt is an AI web development agent from StackBlitz that builds full-stack apps from a prompt, right in your browser. Describe what you want, watch it come together live, and publish — no setup on your machine.\\n\\nAs soon as an app needs to save data, let people log in, or do real work behind the scenes, it needs a proper backend. Connecting Supabase gives your Bolt app one you own and control, instead of the built-in option, so your app and its data can grow with you.\\n\\nOnce connected, your Bolt app can:\\n\\n- Save and look up data in a real database\\n- Let people sign up and log in\\n- Run the logic behind features like payments or emails\\n- Keep everything in a Supabase account that's yours to keep\\n\\nGetting started:\\n\\n1. In Bolt, open any project and go to All project settings \u003e Account \u003e Applications.\\n2. In the Supabase row, click Connect and log in with your Supabase account.\\n3. Authorize Bolt, then choose an existing project or create a new one — or pick Supabase as your database when you start a new project.\",\"websiteUrl\":\"https://bolt.new\",\"docsUrl\":\"https://support.bolt.new/integrations/supabase\",\"installUrl\":null,\"logo\":\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/partners/bolt/logo.png\",\"images\":[],\"youtubeId\":null,\"type\":\"technology\",\"categories\":[],\"featured\":false,\"publishedInCatalog\":true,\"publishedInMarketplace\":false},{\"slug\":\"clickhouse\",\"title\":\"ClickHouse\",\"builtBy\":\"ClickHouse\",\"description\":\"Setup Supabase for usage in ClickPipes.\",\"content\":\"$3b\",\"websiteUrl\":\"https://www.clickhouse.com\",\"docsUrl\":\"https://supabase.com/docs/guides/database/extensions/wrappers/clickhouse\",\"installUrl\":\"https://supabase.com/dashboard/project/_/integrations/clickhouse_wrapper/overview?utm_source=supabase\u0026utm_medium=partner_referral\u0026utm_campaign=integration_partner_program\u0026utm_content=add_integration_button\",\"logo\":\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/ nd TypeScript ORM.\",\"content\":\"Prisma is an open source next-generation ORM. It consists of the following parts:\\n\\n- Prisma Client: Auto-generated and type-safe query builder for Node.js and TypeScript.\\n- Prisma Migrate: Migration system.\\n- Prisma Studio: GUI to view and edit data in your database.\\n\\n## Documentation\\n\\nTo use Prisma with Supabase, follow our [Prisma quickstart guide](https://supabase.com/docs/guides/database/prisma).\",\"websiteUrl\":\"prisma.io\",\"docsUrl\":\"https://www.prisma.io/\",\"installUrl\":null,\"logo\":\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/partners/prisma/logo.png\",\"images\":[\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/prisma/prisma-homepage.png\"],\"youtubeId\":\"YjvQsNEOs60\",\"type\":\"technology\",\"categories\":[{\"name\":\"DevTools\",\"slug\":\"devtools\"}],\"featured\":false,\"publishedInCatalog\":true,\"publishedInMarketplace\":false},{\"slug\":\"drapcode\",\"title\":\"DrapCode\",\"builtBy\":\"DrapCode\",\"description\":\"Build Full-Fledged Web Applications - No Coding Required.\",\"content\":\"DrapCode is a multi-purpose [no code web app builder](https://drapcode.com/no-code-development) that allows you to design, build and launch your web applications using the drag and drop feature. It allows you to connect pages to the CMS and bring dynamic data to them without coding.\\n\\nYou can also connect external applications using [APIs and plugins](https://drapcode.com/integrations) for external services to interact with other applications in real-time.\\n\\nTo know about DrapCode in depth, check out our [features](https://drapcode.com/features) page.\",\"websiteUrl\":\"https://supabase.com\",\"docsUrl\":\"https://academy.drapcode.com/docs/supabase/integration-introduction/\",\"installUrl\":null,\"logo\":\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/partners/drapcode/logo.jpeg\",\"images\":[\"https://otqhrpbxhx "youtubeId\":\"nBN5tTrSMXo\",\"type\":\"technology\",\"categories\":[{\"name\":\"DevTools\",\"slug\":\"devtools\"}],\"featured\":false,\"publishedInCatalog\":true,\"publishedInMarketplace\":false},{\"slug\":\"kinde\",\"title\":\"Kinde\",\"builtBy\":\"Kinde\",\"description\":\"Auth for modern applications.\",\"content\":\"Auth for modern applications. Powerful user authentication that integrates in minutes.\\n\\nKinde handles user authentication, manages session tokens, and offers user management features, which can be integrated with the authorization mechanisms provided by Supabase, utilizing PostgreSQL’s Row Level Security (RLS) policies.\\n\\nWe will explore how to connect and leverage a Supabase database with the capabilities of Kinde, an authentication and authorization provider.\\n\\n- Kinde setup\\n- Supabase setup\\n- Integration\\n- Creating a sample To-Do application that leverages both systems\\n\\n[https://kinde.com/blog/engineering/kinde-with-supabase/](https://kinde.com/blog/engineering/kinde-with-supabase/)\",\"websiteUrl\":\"https://supabase.com\",\"docsUrl\":\"https://kinde.com/blog/engineering/kinde-with-supabase/\",\"installUrl\":null,\"logo\":\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/partners/kinde/logo.jpg\",\"images\":[\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/kinde/og.jpg\"],\"youtubeId\":null,\"type\":\"technology\",\"categories\":[{\"name\":\"Auth\",\"slug\":\"auth\"}],\"featured\":false,\"publishedInCatalog\":true,\"publishedInMarketplace\":false},{\"slug\":\"insightbase\",\"title\":\"InsightBase\",\"builtBy\":\"InsightBase\",\"description\":\"Chat with your Database Using AI.\",\"content\":\"Chat with your Database Using AI. Ask questions in natural language and get answers in seconds. No more SQL queries, no more data science. Just ask.\\n\\n## Connect Supabase to InsightBase\\n\\n1. Go to [InsightBase](https://app.insightbase.ai/)\\n2. Select your organization\\n3. Click \\\"Data Sources\\\" in the left sidebar\\n4. Click the \\\"Create Data Source\\\" button on the top right corner\\n5. Select database type \\\"PostgreSQL\\\"\\n6. Fill in the host, port, database, user, and password fields. You can find them in your Supabase account by going to \\\"Project Settings\\\" in the sidebar, and then [\\\"Database\\\"](https://supabase.com/dashboard/project/-/settings/database)\",\"websiteUrl\":\"https://supabase.com\",\"docsUrl\":\"https://supabase.com/partners/integrations/insightbase\",\"installUrl\":null,\"logo\":\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/partners/insightbase/logo.jpeg\",\"images\":[\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/insightbase/insightbase_og.jpeg\"],\"youtubeId\":null,\"type\":\"technology\",\"categories\":[{\"name\":\"Data Platform\",\"slug\":\"data-platform\"}],\"featured\":false,\"publishedInCatalog\":true,\"publishedInMarketplace\":false},{\"slug\":\"zapier\",\"title\":\"Zapier\",\"builtBy\":\"Zapier\",\"description\":\"Zapier is a no-code workflow automation tool that seamlessly connects different applications and services\",\"content\":\"$48\",\"websiteUrl\":\"https://supabase.com\",\"docsUrl\":\"https://zapier.com/\",\"installUrl\":null,\"logo\":\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/partners/zapier/logo.svg\",\"images\":[],\"youtubeId\":null,\"type\":\"technology\",\"categories\":[{\"name\":\"API\",\"slug\":\"api\"}],\"featured\":false,\"publishedInCatalog\":true,\"publishedInMarketplace\":false},{\"slug\":\"fezto\",\"title\":\"Fezto\",\"builtBy\":\"Fezto\",\"description\":\"Launch an app instantly via OpenAPI spec.\",\"content\":\"[Frontend Zero to One is](https://www.fezto.xyz) is a service which creates an app for your Supabase Postgres database on-the-fly without any drag and drop, using the OpenAPI spec provided by PostgREST.\\n\\n## Documentation\\n\\n\u003cdiv className=\\\"video-container\\\"\u003e\\n  \u003ciframe\\n    src=\\\"https://www.youtube-nocookie.com/embed/GOC6a0_AlgI\\\"\\n    frameBorder=\\\"0\\\"\\n    allow=\\\"accelerometer; encrypted-media; gyroscope; picture-in-picture\\\"\\n    allowfullscreen\\n  \u003e\u003c/iframe\u003e\\n\u003c/div\u003e\\n\\n## Setup\\n\\nIn the [Supabase control panel](https://supabase.com/dashboard/), open your project and click the Settings cog icon, and then \\\"API\\\".\\nYou will need:\\n\\n1. From the Project URL copy the project ID from https://your-project-id.supabase.co\\n2. From the \\\"Project API keys\\\" section copy the \\\"anon\\\" \\\"public\\\" API Key into the\\n\\nPaste both into the [FEZTO Supabase setup page](https://www.fezto.xyz/#/supabase) and click Launch.\\nYou can now share and bookmark the browser URL which includes the projectID and anon key with others to launch the same app.\\n\",\"websiteUrl\":\"fezto.xyz\",\"docsUrl\":\"http://www.fezto.xyz/\",\"installUrl\":null,\"logo\":\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/partners/fezto/logo.png\",\"images\":[\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/frontend-zero-to-one/fezto_og.png\"],\"youtubeId\":null,\"type\":\"technology\",\"categories\":[{\"name\":\"Low-Code\",\"slug\":\"low-code\"}],\"featured\":false,\"publishedInCatalog\":true,\"publishedInMarketplace\":false},{\"slug\":\"mux\",\"title\":\"Mux\",\"builtBy\":\"Mux\",\"description\":\"Build better video into anything from websites to platforms to AI workflows.\",\"content\":\"[Mux](https://mux.com) is the best video infrastructure API for developers. Mux handles transcoding, storage and adaptive bitrate streaming of your videos to viewers.\\n\\nUse [@mux/supabase](https://www.npmjs.com/package/@mux/supabase) to sync your Mux video data with your Supabase Postgres database.\\n\\nRunning the `npx @mux/supabase init` command will:\\n\\n- Create new `mux` schema in your Supabase database\\n- Set ve systems.\\n\\nBy integrating DBLab SE, you streamline CI/CD pipelines, reduce the risk of production errors, and empower your team to move faster with safe, reproducible environments—all while keeping infrastructure costs under control.\\n\\nKey Benefits:\\n\\n- Instant cloning – Create full PostgreSQL environments in seconds.\\n- Safe testing – Experiment and debug without touching production.\\n- Cost-efficient – Space-efficient snapshots keep storage usage low.\\n- CI/CD ready – Automate realistic test databases in your pipelines.\\n- Analytics sandbox – Run complex queries without slowing live systems.\",\"websiteUrl\":\"estuary.dev\",\"docsUrl\":\"https://postgres.ai/docs/tutorials/database-lab-tutorial\",\"installUrl\":null,\"logo\":\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/partners/postgresai/logo.svg\",\"images\":[],\"youtubeId\":null,\"type\":\"technology\",\"categories\":[{\"name\":\"DevTools\",\"slug\":\"devtools\"}],\"featured\":false,\"publishedInCatalog\":true,\"publishedInMarketplace\":false},{\"slug\":\"trevor-io\",\"title\":\"Trevor.io\",\"builtBy\":\"Trevor.io\",\"description\":\"Trevor.io empowers your whole team to get answers from your Supabase database data, in just a few clicks.\",\"content\":\"Trevor.io gives your team a safe (read-only) data platform for getting answers from your Supabase database data.\\n\\nNavigate your Postgres data, build dashboards and feed live results to tools like Google Sheets, Slack and Zapier.\\n\\nInvite team members using their Google or work email address.\\n\\nHide tables and columns that you don’t want team members to see.\",\"websiteUrl\":\"trevor.io\",\"docsUrl\":\"https://guide.trevor.io/?utm_source=supabase-partner-gallery\",\"installUrl\":null,\"logo\":\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/partners/trevor-io/logo.jpeg\",\"images\":[\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/trevor-io/trevorio
