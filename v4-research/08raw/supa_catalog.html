6\",\"static/chunks/3016-a7eeb517bcd3f8e1.js?dpl=dpl_HVum5sR8w9UvXAF4wpJNHTz44iNM\",\"2317\",\"static/chunks/2317-1d8cd01ee0c1c701.js?dpl=dpl_HVum5sR8w9UvXAF4wpJNHTz44iNM\",\"2097\",\"static/chunks/2097-48d6df6b9600df34.js?dpl=dpl_HVum5sR8w9UvXAF4wpJNHTz44iNM\",\"707\",\"static/chunks/707-7196da0ec6a4dc1f.js?dpl=dpl_HVum5sR8w9UvXAF4wpJNHTz44iNM\",\"3814\",\"static/chunks/3814-ad6cc00695885450.js?dpl=dpl_HVum5sR8w9UvXAF4wpJNHTz44iNM\",\"2288\",\"static/chunks/2288-17774c07e1723af2.js?dpl=dpl_HVum5sR8w9UvXAF4wpJNHTz44iNM\",\"6453\",\"static/chunks/6453-66362a5a98e63b2d.js?dpl=dpl_HVum5sR8w9UvXAF4wpJNHTz44iNM\",\"7886\",\"static/chunks/7886-bbb6b7510c43963c.js?dpl=dpl_HVum5sR8w9UvXAF4wpJNHTz44iNM\",\"2409\",\"static/chunks/2409-029f5f0ef78b542d.js?dpl=dpl_HVum5sR8w9UvXAF4wpJNHTz44iNM\",\"5722\",\"static/chunks/5722-b0c9ad6fdeb99c9a.js?dpl=dpl_HVum5sR8w9UvXAF4wpJNHTz44iNM\",\"7106\",\"static/chunks/7106-034ce9d0d6e4d81f.js?dpl=dpl_HVum5sR8w9UvXAF4wpJNHTz44iNM\",\"6132\",\"static/chunks/6132-40b0900913efa850.js?dpl=dpl_HVum5sR8w9UvXAF4wpJNHTz44iNM\",\"2926\",\"static/chunks/2926-385b82a5721f6cfa.js?dpl=dpl_HVum5sR8w9UvXAF4wpJNHTz44iNM\",\"7211\",\"static/chunks/7211-4f2d10cd53d2b51a.js?dpl=dpl_HVum5sR8w9UvXAF4wpJNHTz44iNM\",\"2444\",\"static/chunks/2444-91a2419aaec8fedd.js?dpl=dpl_HVum5sR8w9UvXAF4wpJNHTz44iNM\",\"5835\",\"static/chunks/5835-136755e1e3e1a7da.js?dpl=dpl_HVum5sR8w9UvXAF4wpJNHTz44iNM\",\"2481\",\"static/chunks/2481-1bedc5d50e1a3fc9.js?dpl=dpl_HVum5sR8w9UvXAF4wpJNHTz44iNM\",\"2218\",\"static/chunks/2218-b6a90cd50e4a62b0.js?dpl=dpl_HVum5sR8w9UvXAF4wpJNHTz44iNM\",\"4149\",\"static/chunks/4149-b17fe9b6604e63bf.js?dpl=dpl_HVum5sR8w9UvXAF4wpJNHTz44iNM\",\"5084\",\"static/chunks/5084-4df3c00dab62da88.js?dpl=dpl_HVum5sR8w9UvXAF4wpJNHTz44iNM\",\"8132\",\"static/chunks/app/partners/catalog/page-14b1c3b9b203f1e1.js?dpl=dpl_HVum5sR8w9UvXAF4wpJNHTz44iNM\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"13:T750,"])</script><script>self.__next_f.push([1,"Springtail adds real time, elastic read replicas to your Supabase Postgres database without code changes or data migration. You can scale replicas on demand to handle traffic spikes and reduce costs.\n\nThis gives you the performance benefits of traditional read replicas without the operational burden. Add replicas in seconds to handle peak load, and remove them when demand drops to avoid paying for unused capacity.\n\n## How it works\n\nSpringtail uses PostgreSQL logical replication to stay in sync with your Supabase database. Once connected, it maintains a real time copy of your data and handles load balancing, replica lifecycle, and scaling behind a single endpoint.\n\nYour application connects to Springtail through a standard Postgres-compatible proxy. The proxy automatically routes read queries to Springtail replicas and sends write queries to your Supabase primary. This allows you to improve performance and scale reads without modifying your application code.\n\nUnlike traditional read replicas, Springtail uses a shared storage layer across all replicas. This architecture allows new replicas to start up in seconds without needing to copy the full dataset. You can increase read throughput quickly by adding replica nodes as needed, making your application faster and more responsive under load without over-provisioning.\n\n## Use cases\n\n- Improve query performance for read heavy applications\n- Handle traffic spikes without over-provisioning\n- Reduce costs by scaling replicas only when needed\n\n## Key benefits\n\n- Works with your existing Supabase Postgres database\n- Fast startup of new replicas, no need to copy your entire database\n- No changes to your schema or application logic\n- Zero maintenance replicas that scale on demand\n\n## Learn more\n\n- 📖 [Read the docs](https://docs.springtail.io)\n- 🖥️ [Book a demo](https://www.springtail.io/request)"])</script><script>self.__next_f.push([1,"14:T236b,"])</script><script>self.__next_f.push([1,"[Zuplo](https://zuplo.com/) is a fully-managed API gateway that offers the easiest way to securely and safely share your API. In this guide we look at how you can combine Zuplo and Supabase to create a public API with rate-limiting, a self-serve developer portal, and API-key authentication and much more.\n\n## Documentation\n\nThere is an [accompanying video for this article](https://www.youtube.com/watch?v=GJSkbxMnWxE).\n\n![zuplo layout](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/zuplo/arch.png)\n\nIn this example we're going to work with a simple table that allows people to read and write entries to a Supabase table that contains some reviews of skis. Because this is an API for developers, we have to assume that they may be calling it from another backend service and can't login as a user using the standard Supabase method. In this scenario, API keys are often a better choice - see [Wait, you're not using API keys?](https://zuplo.com/blog/2022/05/03/you-should-be-using-api-keys/).\n\nWe'll allow people, with a valid API key, to read data from the ski results table and to create new records. Hopefully it's obvious that there are many ways that you can extend this example to add more behavior like roles based access, with custom policies, custom handlers and more.\n\n## Setting up Supabase\n\nIf you haven't already, create a new project in Supabase and create a table called ski-reviews with the following columns:\n\n- id (int8)\n- created_at (timestamptz)\n- make (text)\n- model (text)\n- year (int8)\n- rating (int2)\n- author (text)\n\nManually enter a couple of rows of data, so that we have something to read from the DB.\n\n## The `Get all` reviews route in Zuplo\n\nLogin to Zuplo at [portal.zuplo.com](https://portal.zuplo.com) and create a new project in Zuplo - I went with `supabase-ski-reviews`.\n\nSelect the **File** tab and choose **Routes**. Add your first route with the following settings:\n\n- method: `GET`\n- path: `/reviews`\n- summary: `Get all reviews`\n- version: `v1`\n- CORS: `Anything goes`\n\nAnd in the request handler section, paste the `READ ALL ROWS` URL of your Supabase backend (you can get to this in the **API docs** section of Supabase)\n\n- URL Rewrite: `https://YOUR_SUPABASE_URL.supabase.co/rest/v1/ski-reviews?select=*`\n- Forward Search: `unchecked`\n\nIn order to call the Supabase backend I need to add some authentication headers to the outgoing request.\n\nExpand the **Policies** section of your route. Click **Add policy** on the **Request** pipeline.\n\nWe don't want to forward any headers that the client sends us to Supabase, so find the **Clear Headers Policy** and add that to your inbound pipeline. Note, that we will allow the `content-type` header to flow through, so this should be your policy config.\n\n```json\n{\n  \"export\": \"ClearHeadersInboundPolicy\",\n  \"module\": \"$import(@zuplo/runtime)\",\n  \"options\": {\n    \"exclude\": [\"content-type\"]\n  }\n}\n```\n\nNext, we need to add the credentials to the outgoing request. We'll need to get the JWT token from supabase - you'll find it in **Settings** \u003e **API** as shown below:\n\n![secret_role jwt](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/zuplo/secret-role.png)\n\nOnce you've got your service_role JWT, click **Add Policy** again on the **Request** pipeline and choose the **Add/Set Headers Policy** and configure it as follows:\n\n```json\n{\n  \"export\": \"SetHeadersInboundPolicy\",\n  \"module\": \"$import(@zuplo/runtime)\",\n  \"options\": {\n    \"headers\": [\n      {\n        \"name\": \"apikey\",\n        \"value\": \"$env(SUPABASE_API_KEY)\",\n        \"overwrite\": true\n      },\n      {\n        \"name\": \"authorization\",\n        \"value\": \"$env(SUPABASE_AUTHZ_HEADER)\",\n        \"overwrite\": true\n      }\n    ]\n  }\n}\n```\n\nSave your changes.\n\nNext, create two secret [environment variables](https://zuplo.com/docs/deployments/environment-variables) as follows:\n\n- SUPABASE_API_KEY: `\"YOUR_SUPABASE_SECRET_ROLE_JWT\"`\n- SUPABASE_AUTHZ_HEADER: `\"Bearer YOUR_SUPABASE_SECRET_ROLE_JWT\"`\n\nObviously, in both instances replace `YOUR_SUPABASE_SECRET_ROLE_JWT` with your service_role JWT from Supabase.\n\nYou are now ready to invoke your API gateway and see data flow through from your Supabase backend!\n\nClick on the **open in browser** button shown below and you should see the JSON, flowing from Supabase in your browser 👏.\n\n![open in browser](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/zuplo/open-in-browser.png)\n\n## Adding authentication\n\nAt this point, that route is wide open to the world so we need to secure it. We'll do this using API keys. You can follow this guide [Add API key Authentication](https://zuplo.com/docs/quickstarts/add-api-key-auth). Be sure to drag the API Key authentication policy to the very top of your **Request** pipeline. Come back here when you're done.\n\nWelcome back! You've now learned how to secure your API with API-Keys.\n\n## Adding a Create route\n\nNext we'll add a route that allows somebody to create a review. Add another route with the following settings\n\n- method: `POST`\n- path: `/reviews`\n- summary: `Create a new review`\n- version: `v1`\n- CORS: `Anything goes`\n\nAnd the request handler as follows:\n\n- URL Rewrite: `https://YOUR_SUPABASE_URL.supabase.co/rest/v1/ski-reviews`\n- Forward Search: `unchecked`\n\nExpand the policies section and add the same policies (note you can reuse policies by picking from the existing policies at the top of the library)\n\n![existing policies](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/zuplo/existing-policies.png)\n\n- api-key-auth-inbound\n- clear-headers-inbound\n- set-headers-inbound\n\nNow your **create** route is secured and will automatically set the right headers before calling Supabase. That was easy.\n\nYou can test this out by using the **API Test Console** to invoke your new endpoint. Go to the **API Test Console** and create a new test called `create-review.json`.\n\n- Method: `POST`\n- Path: `/v1/reviews`\n- Headers:\n  - `content-type`: `application/json`\n  - `authorization`: `Bearer YOUR_ZUPLO_API_KEY`\n- Body:\n\n```json\n{\n  \"make\": \"Rossignol\",\n  \"model\": \"Soul HD7\",\n  \"rating\": 5,\n  \"year\": 2019\n}\n```\n\n![Test console](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/zuplo/test-console.png)\n\nIf you invoke your API by clicking `Test` you should see that you get a **201 Created** - congratulations!\n\n## Add validation to your post\n\nTo make your API more usable and more secure it is good practice to validate incoming requests. In this case we will add a JSON Schema document and use it to validate the incoming body to our POST.\n\nCreate a new schema document called `new-review.json`.\n\n![new schema](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/zuplo/new-schema.png)\n\nThis example fits the ski-reviews table we described above\n\n```json\n{\n  \"$id\": \"http://example.com/example.json\",\n  \"type\": \"object\",\n  \"default\": {},\n  \"title\": \"Root Schema\",\n  \"required\": [\"make\", \"model\", \"rating\", \"year\"],\n  \"additionalProperties\": false,\n  \"properties\": {\n    \"make\": {\n      \"type\": \"string\",\n      \"default\": \"\",\n      \"title\": \"The make Schema\",\n      \"examples\": [\"DPS\"]\n    },\n    \"model\": {\n      \"type\": \"string\",\n      \"default\": \"\",\n      \"title\": \"The model Schema\",\n      \"examples\": [\"Pagoda\"]\n    },\n    \"rating\": {\n      \"type\": \"integer\",\n      \"default\": 0,\n      \"title\": \"The rating Schema\",\n      \"examples\": [5]\n    },\n    \"year\": {\n      \"type\": \"integer\",\n      \"default\": 0,\n      \"title\": \"The year Schema\",\n      \"examples\": [2018]\n    }\n  },\n  \"examples\": [\n    {\n      \"make\": \"DPS\",\n      \"model\": \"Pagoda\",\n      \"rating\": 5,\n      \"year\": 2018,\n      \"author\": \"Josh\"\n    }\n  ]\n}\n```\n\nNow add a new policy to **request** pipeline for your `Create new review` route. Choose the **JSON Body Validation** policy and configure it to use your newly created JSON schema document:\n\n```json\n{\n  \"export\": \"ValidateJsonSchemaInbound\",\n  \"module\": \"$import(@zuplo/runtime)\",\n  \"options\": {\n    \"validator\": \"$import(./schemas/new-review.json)\"\n  }\n}\n```\n\nThis policy can be dragged to the first position in your pipeline.\n\nNow to test this is working, go back to your API test console and change the body of your `create-review.json` test to be invalid (add a new property for example). You should find that you get a `400 Bad Request` response.\n\n![400 Bad Request](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/zuplo/400-bad.png)\n\nFinally, lean back and marvel at your beautiful Developer Portal that took almost zero effort to get this far, wow! Hopefully you already found the link for this when adding API key support :)\n\n![Developer Portal](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/zuplo/dev-portal.png)\n\nZuplo can also be used to handle Supabase JWT tokens for any API, learn more at [API Authentication with Supabase JWT Tokens](https://zuplo.com/blog/2022/11/15/api-authentication-with-supabase-jwt)\n"])</script><script>self.__next_f.push([1,"15:T664,"])</script><script>self.__next_f.push([1,"Gemini Enterprise is Google Cloud's platform for putting AI to work across the tools a company already runs — GitHub, Linear, Notion, Slack, Salesforce, and more. Supabase is available there as a prebuilt connector. Connect your Supabase organization once, and your team can query and act on Supabase projects in natural language without leaving the platform.\n\nAsk something like \"list my tables from Supabase for my project\" and Gemini Enterprise calls the connector and returns a live answer. Your Supabase data is never stored or indexed on the Gemini Enterprise side; every response is fetched from your organization at the moment you ask, so what you see reflects the current state of your projects. When a prompt spans more than one connected tool, the results arrive as a single answer — ask about a feature and get the relevant Supabase tables alongside the Jira tickets tracking the work.\n\nBecause it all happens in natural language, the connector opens Supabase up to people who don't spend their days in the Dashboard. IT and ops teams can check database metrics or look up a table's structure without needing direct access, and developers get answers about their backend without switching contexts. The connector is available across every Gemini Enterprise edition: on Business it appears in the connector menu and goes live as soon as you sign in to your Supabase organization, while Standard, Plus, and Frontline admins connect it from the admin console with a client ID and secret. Connections are made at the Supabase organization level, and every tool the connector exposes is annotated as read-only or destructive."])</script><script>self.__next_f.push([1,"16:T4ef,"])</script><script>self.__next_f.push([1,"Bemi is an open-source platform that provides automatic audit trails for PostgreSQL.\n\n## Step #1 - Find your Supabase database credentials\n\nYou can find these under `Settings` \u003e `Database` \u003e `Connection Parameters`. Untoggle \"Use connection pooling\". The string below will contain the database information required.\n\n![Supabase Connection UI](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/bemi/screenshot.jpeg)\n\nFor example, given a connection string like `postgresql://root:[YOUR-PASSWORD]@ db.fwlzplllytibpaignejo.supabase.co:5432/postgres`, the credentials would be:\n- Database Host: `db.fwlzplllytibpaignejo.supabase.co`\n- Database Port: `5432`\n- Username: `root`\n- Password: `[YOUR-PASSWORD]`\n- Database: `postgres`\n\n## Step #2 - Create Bemi connection\n\nCreate a [new database connection](https://dashboard.bemi.io/databases/source/new) by logging in with Github and securely entering the credentials for your Supabase database. During the connection setup or any time after, you can configure what tables you want to track through the Bemi UI.\n\nPlease wait a few minutes while the infrastructure is being provisioned. Once this succeeds, you’ve successfully configured a Bemi Postgres source for your Supabase database."])</script><script>self.__next_f.push([1,"17:T440,"])</script><script>self.__next_f.push([1,"[CipherStash](https://cipherstash.com/) is a Data Level Access Control (DLAC) platform for applications built on Postgres. It provides searchable field-level encryption with identity-bound keys and cryptographic audit trails, built into your existing stack.\n\nCipherStash lets you encrypt sensitive fields in your Supabase database without losing query capabilities.\n\n* Supports queries over encrypted data, including `WHERE`, `LIKE`, `ORDER BY`, `JOIN`, and `GROUP BY`\n* Works with Supabase.js, Prisma Next, Drizzle, or plain SQL (via pg)\n* Has built-in key management, automatic rotation, and identity integration with Supabase Auth\n* Adds typically less than 10ms overhead (see [benchmarks](https://github.com/cipherstash/benches))\n\n## Instructions\n1. Initialize your project\n2. Choose which columns you want to encrypt\n3. Zero-code change via drop-in wrappers for supabase-js, Prisma Next, and Drizzle\n\n## Get started\nStart with a free developer tier. Sign up [here](https://cipherstash.com/?referrer=supabase), run `npx stash init --supabase`, or ask Claude to walk you through setup."])</script><script>self.__next_f.push([1,"18:Teab,"])</script><script>self.__next_f.push([1,"Stacksync gives you bi-directional, real-time syncs between Supabase and your business apps. It turns your Supabase instance into a read-write interface for your CRM data, so you can manipulate it directly with SQL queries instead of API calls. \n\nStacksync handles API rate limits, security token rotation, and data type discrepancies so you don’t have to. While other solutions might let syncs fail silently, Stacksync keeps you in the loop, ensuring your data pipelines run smoothly. \n\nUpdate data in Supabase and watch it sync instantly to your CRM, and vice versa. It’s the easiest way to set up ETL/reverse ETL pipelines. \n\nBusinesses use Stacksync to:\n\n- Backbone CRM integration (e.g creating users in a CRM on signup, syncing subscriptions)  \n- Enrich CRM contact data with product usage  \n- Automate support and sales ops workflows  \n- Build internal tools on real-time CRM data (e.g. partner portals or invoicing systems)  \n- Save money on API credits\n\nSupported integrations include Salesforce, Hubspot, Attio, Zoho CRM, BigQuery, Zendesk and more. Connect your Supabase to any system with no-code.\n\n## Features you’ll love\n\n- **Two-way, real-time syncing:** Propagate `insert`, `update`, and `delete` between Supabase and CRMs with sub-100ms latency.   \n- **Schema mapping**: Easily map Supabase tables, columns, and fields to CRM objects.   \n- **Event-based triggers**: Define business logic and trigger a HTTP request or database query when an event matches your rules. [Read more here](https://docs.stacksync.com/guides/event-triggers?utm_source=supabase\u0026utm_medium=partner\u0026utm_campaign=marketplacelisting).  \n- **Automate any workflow**: Create workflows and data pipelines in a visual designer.  \n- **Observability and debugging**: Monitor syncs and receive alerts when there’s an issue.  \n- **Sync issue resolution**: View all sync issues and resolve them with one click to *retry* or *revert* the data update.\n\n## How to start syncing Supabase to your CRM\n\n### Step 1: Sign up for Stacksync\n\nSign up for a Stacksync account on [our website](https://www.stacksync.com/?utm_source=supabase\u0026utm_medium=partner\u0026utm_campaign=marketplacelisting). A free trial is available for new users. \n\n### Step 2: Connect Supabase\n\nOnce you’ve logged into Stacksync, click on “Create new sync”. Scroll down and select Supabase from the list of connectors. Stacksync will prompt you for direct connection details.\n\n1. In your Supabase project, go to Database settings (Project Settings \\\u003e Database).  \n2. Copy the connection string URI.  \n3. Paste the connection string into Stacksync. Remember to update the password\\!   \n4. Optionally, add an SSL root certificate or SSH tunneling.   \n5. Click “Authorize app”. \n\n### Step 3: Connect another app\n\nChoose the second app you want to connect and authorize it. \n\n### Step 4: Map tables and fields\n\nFollow the configuration guide to continue setting up your sync. You can choose which tables, columns, and fields to sync. If a table doesn’t currently exist in Supabase, Stacksync will generate one for you.\n\n### Step 5: Activate sync\n\nTurn on the toggle to activate your sync, and you’re ready to go\\!\n\n## Additional resources\n\n- [Stacksync website](https://www.stacksync.com/?utm_source=supabase\u0026utm_medium=partner\u0026utm_campaign=marketplacelisting)  \n- [Stacksync app](https://app.stacksync.com?utm_source=supabase\u0026utm_medium=partner\u0026utm_campaign=marketplacelisting)  \n- [Stacksync docs](https://docs.stacksync.com/connectors/supabase?utm_source=supabase\u0026utm_medium=partner\u0026utm_campaign=marketplacelisting)  \n- [Salesforce \\+ Supabase tutorial](https://docs.stacksync.com/guides/two-way-sync-salesforce-and-postgres?utm_source=supabase\u0026utm_medium=partner\u0026utm_campaign=marketplacelisting)"])</script><script>self.__next_f.push([1,"19:T61a,"])</script><script>self.__next_f.push([1,"AutoSend is an email delivery service for transactional and marketing emails. Use AutoSend with Supabase Auth for delivering your time-sensitive and critical emails in your user's inbox.\n\n## Benefits\n\n- **Send from your own domain** for better brand recognition and deliverability\n- **Remove rate limits** that block your users during signups\n- **Track every email** with delivery, open, and bounce insights\n- **Protect your sender reputation** with automatic suppression of bounces and spam complaints\n\n## Prerequisites\n\n1. [AutoSend account](https://autosend.com/signup)\n2. [Add and verify your sending domain](https://docs.autosend.com/domain)\n3. Copy your SMTP credentials from **Settings \u003e SMTP** in your AutoSend dashboard\n\n## Configure Supabase\n\n1. Go to your Supabase project dashboard\n2. Navigate to **Authentication**\n3. Under **Notifications**, you will see **Email** section.\n4. Scroll to **SMTP Settings** and toggle **Enable Custom SMTP**\n5. Enter your AutoSend SMTP credentials:\n\n   | Setting      | Value                       |\n   | ------------ | --------------------------- |\n   | Sender email | noreply@mail.yourdomain.com |\n   | Sender name  | Your App Name               |\n   | Host         | `smtp.autosend.com`         |\n   | Port         | `587`                       |\n   | Username     | `autosend`                  |\n   | Password     | Your AutoSend API key       |\n\n6. Click **Save**\n\nThat's it! Your Supabase auth emails will now be sent through AutoSend.\n\nFor a detailed guide, check https://docs.autosend.com/guides/smtp/supabase"])</script><script>self.__next_f.push([1,"1a:T10ab,"])</script><script>self.__next_f.push([1,"ILLA is a low-code platform for developers that enables the rapid development and deployment of internal tools.\n\nIt allows for creating pages by dragging and dropping UI components, connecting to any database or API, and writing JavaScript.\n\n## Documentation\n\nThis tutorial outlines the process of creating an Admin Panel using ILLA Builder and Supabase in a few simple steps. ILLA is a low-code platform for developers that enables the rapid development and deployment of internal tools. It allows for creating pages by dragging and dropping UI components, connecting to any database or API, and writing JavaScript. To learn more about ILLA and give it a try, visit their website at [https://www.illacloud.com/](https://www.illacloud.com/). Let's begin!\n\n### Step 1: Set up your Back end on Supabase\n\nOn the [Supabase dashboard](https://supabase.com/dashboard/projects), click `New project` and set the name to adminPanel.\n\n![Create Supabase Project for ILLA Admin Panel](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/illa/new-project.png)\n\nCreate a new table by clicking on the `Create a new table` .\n\nSupabase offers a variety of options for populating tables with data, including writing queries, creating schemas through a user interface, and uploading CSV files.\n\n![Create Supabase Table for ILLA Admin Panel](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/illa/new-table.png)\n\nFill out the info in the table. The database is now set up.\n\n### Step 2: Build UI on ILLA Cloud\n\nOn [ILLA Cloud](https://cloud.illacloud.com/), click Create New to create a new application.\n\n![Create new project on ILLA Builder](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/illa/supabase-illa-create-project.png)\n\nDrag components from the `Insert` panel to the canvas.\n\nSelect the components on the canvas and configure the property on the `Inspect` panel.\n\nAs seen in the below screenshot, we have built a simple admin panel.\n\n![Build UI with ILLA Builder](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/illa/supabase-illa-UI.png)\n\n### Step 3: Connect to Supabase and config CRUD\n\nNote down the database connection parameters information under [Database Settings](https://supabase.com/dashboard/project/hdcfnsxpwwgboqomdrhp/settings/database) in Supabase.\n\n![Note information in supabase](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/illa/connection-string.png)\n\nIn the Action List, click `+ New` and select Supabase DB.\n\n![Connect ILLA to Supabase](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/illa/supabase-illa-connect.png)\n\nFill out the form to connect to your Supabase instance. Test connection and save resource.\n\n![Config Supabase in ILLA](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/illa/supabase-illa-connect-2.png)\n\nClick `Create Action` to create an action with the Supabase resource and config your CRUD.\n\n![Select Supabase resource in ILLA](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/illa/supabase-illa-select.png)\n\nUse `{{` to get the front-end input data. The following is an example of the User Management page in the Admin Panel.\n\nSearch for a user by the name inputted in input1\n\n```\nSELECT *\nFROM user\nWHERE name = \"{{input1.value}}\"\n;\n```\n\nUpdate user data. Update user information when id matches\n\n```\nUPDATE user\nSET name = \"{{input3.value}}\"\n, email = \"{{input4.value}}\"\nWHERE id=\"{{input2.value}}\"\n;\n```\n\nInsert user data\n\n```\nINSERT INTO user VALUES(\"{{input5.value}}\",\"{{input6.value}}\",\"{{input7.value}}\");\n```\n\nDelete a user by id\n\n```\nDELETE FROM user WHERE id = \"{{input2.value}}\";\n```\n\n### Step 4: Show data on components\n\nConfigure the properties of components with `{{` . For example:\n\n![Show Supabase data on ILLA components](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/illa/supabase-illa-show-data.png)\n\n## Resources\n\n- [ILLA Cloud official website](https://www.illacloud.com/)\n- [ILLA Cloud GitHub](https://github.com/illacloud/illa-builder)\n- [ILLA Cloud documentation](https://www.illacloud.com/docs/about-illa)\n"])</script><script>self.__next_f.push([1,"1b:T47e,"])</script><script>self.__next_f.push([1,"[Apache Iceberg](https://iceberg.apache.org/) is a high-performance open table format for large-scale analytic datasets. It adds ACID transactions, schema evolution, hidden partitioning, time travel, and version rollback to data stored in object storage, making it the industry-standard format for data lake and lakehouse architectures.\n\nThe Iceberg Wrapper brings your Iceberg tables into Postgres as queryable foreign tables. Read and write Iceberg data with plain SQL, join it against your application data, and query across AWS S3 Tables or any Iceberg REST Catalog backed by S3-compatible storage. Works with Supabase Vault for secure credential management.\n\n### Supported Data Types\n\n| Postgres Type | Iceberg Type |\n| --- | --- |\n| boolean | boolean |\n| real | float |\n| integer | int |\n| double precision | double |\n| bigint | long |\n| numeric | decimal |\n| text | string |\n| date | date |\n| time | time |\n| timestamp | timestamp, timestamp_ns |\n| timestamptz | timestamptz, timestamptz_ns |\n| jsonb | struct, list, map |\n| bytea | binary |\n| uuid | uuid |\n\n### Resources\n\n- [supabase/wrappers on GitHub](https://github.com/supabase/wrappers)"])</script><script>self.__next_f.push([1,"1c:T556,"])</script><script>self.__next_f.push([1,"# Astrato Analytics\n\n**Ship customer-facing analytics in days, not months – and turn data into revenue.**\n\nAstrato connects directly to your Supabase Postgres database and turns it into pixel-perfect, white-labeled dashboards that feel like a premium product feature. When customers ask \"where's my usage data?\" or \"can I see my metrics?\", you're ready with production-grade analytics in hours, not months of development work.\n\nBuild dashboards with drag-and-drop. Customize every detail to match your brand – colors, fonts, layouts, navigation. Enterprise security policies work automatically – customers only see their own data. No ETL pipelines, no data copies, no forced migration to enterprise data warehouses. Astrato queries Supabase live with optimized SQL, so your dashboards are always up to date.\n\nPerfect for teams that want to offer a premium data experience and create new revenue streams. Package analytics as upsell tiers, charge for advanced reporting, or differentiate with superior visualizations. Non-technical users get guided self-service with AI-powered insights. Technical users get powerful features like semantic layers, writeback, and automated workflows – all with SQL generated behind the scenes.\n\nAstrato gives you world-class embedded analytics with enterprise-grade features but without the enterprise price tag or complexity."])</script><script>self.__next_f.push([1,"1d:T43b,"])</script><script>self.__next_f.push([1,"Grafana Cloud is an AI-powered, full-stack observability platform that helps you improve the reliability of your applications, resolve incidents quickly, and optimize your telemetry to reduce noise and costs. With the Grafana Cloud integration for Supabase, you can bring production-grade observability to your projects, gaining deep visibility into performance, system health, and database metrics.\n\nOnce connected, a fully-configured Grafana Cloud instance is provisioned with authentication, metric scraping, and a pre-built dashboard already set up in your workspace on arrival. Grafana Assistant is built in for dashboard creation, alerting, and incident troubleshooting.\n\nThe integration reads from the Supabase Metrics API using Prometheus exposition format, scraping roughly 200 metrics at one-minute granularity across:\n\n- CPU and memory pressure\n- Disk IO and throughput\n- Network traffic\n- Connection counts and pooler behavior\n- Replication lag\n- Scheduled and requested checkpoints\n- Database size, query stats, and index health\n\nAvailable on every plan, including free."])</script><script>self.__next_f.push([1,"1e:T55f8,"])</script><script>self.__next_f.push([1,"Passage is a passwordless authentication service that enables you to add passkey sign-in experiences to your apps and websites with just two lines of code. As a full stack solution, Passage comes with robust backend infrastructure and pre-built UI elements, letting you implement secure and frictionless logins in minutes.\n\n[Check out this guide](https://docs.passage.id/helpful-guides/supabase-integration-guide) to learn how to add Passage to your Supabase powered site and plug into RLS.\n\n## Documentation\n\nThis guide steps through building a Next.js application with Passage and Supabase. We will use Passage to authenticate users and manage tokens, while using Supabase for storing data and enforcing authorization logic using Row Level Security policies.\n\nThe full code example for this guide can be found [here](https://github.com/passageidentity/supabase-passage-example).\n\n[Passage](https://passage.id) is a passwordless authentication platform that makes it simple for developers to add passkey authentication to their apps and websites, providing better security and simpler sign in for your users. They provide simple frontend components that handle all of the complexity of passwordless login for developers in just two lines of codes. Passage also provides session management, user management, and in-depth customization capabilities.\n\nNext.js is a web application framework built on top of React. We will be using it for this example, as it allows us to write server-side logic within our application. Passage’s [frontend elements](https://docs.passage.id/frontend/passage-element) and [Node.js SDK](https://docs.passage.id/backend/overview/node) are designed to work for Next.js.\n\nFor this guide, you will need a Passage account which can be created [here](https://console.passage.id/register), and a Supabase account which can be created [here](https://supabase.com/dashboard/).\n\n## 1. Create a Passage application\n\nIn the [Passage Console](https://console.passage.id), create a new application with the following configuration:\n\n- Application name: Todo Application\n- Authentication origin: http://localhost:3000\n- Redirect URL: /dashboard\n\n![Passage Console dashboard](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/passage-by-1password/01.png)\n\n![Fill out the required fields to create a new application](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/passage-by-1password/02.png)\n\n## 2. Create and configure a Supabase project\n\n#### Create a new project\n\nIn the [Supabase dashboard](https://supabase.com/dashboard/), click `New Project`.\nEnter a name for your project and create a secure database password.\n\n#### Create a table schema\n\nWe are building Todo list application, similar to the [Supabase demo application](https://github.com/supabase/supabase/tree/master/examples/todo-list/nextjs-todo-list) so we will need a table for the todo list items.\n\nCreate a new table in the Table Editor view.\n\nSet the Name field to `todo`.\n\nSelect Enable Row Level Security (RLS).\n\nCreate the following new columns.\n\n- `title` as `text`\n- `user_id` as `text` with a default value of `auth.user_id()`\n- `is_complete` as `bool` with a default value of `false`\n\nClick `Save` to create the table.\n\n![Table schema.](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/passage-by-1password/03.png)\n\n#### Add initial data to the table\n\nFrom the Table editor, select the `todo` table and click `Insert row`. Fill out the required fields with an example todo item, leaving the `user_id` as NULL and click `Save`.\n\n![Example todo item.](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/passage-by-1password/04.png)\n\nAfter adding a few todo items, the table editor view will look like this:\n\n![Table with multiple todo items.](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/passage-by-1password/05.png)\n\n## 3. Build a Next.js app\n\n#### Create Next.js app\n\nCreate a new Next.js project on the command line. You can choose your settings through the setup wizard - for this guide we will use JavaScript instead of TypeScript. This example uses the create script in Next v13.2.\n\n```sh\nnpx create-next-app \u003cname-of-project\u003e\ncd \u003cname-of-project\u003e/\n```\n\nYou should be able to use the default settings for the project, but here are the settings used for the example app.\n\n![Settings for Next.js application.](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/passage-by-1password/06.png)\n\n#### Configure your ENV\n\nCreate a `.env` file and enter the following values.\n\n```sh\nNEXT_PUBLIC_PASSAGE_APP_ID=get-from-passage-settings\nPASSAGE_API_KEY=get-from-passage-settings\nNEXT_PUBLIC_SUPABASE_URL=get-from-supabase-dashboard\nNEXT_PUBLIC_SUPABASE_ANON_KEY=get-from-supabase-dashboard\nSUPABASE_JWT_SECRET=get-from-supabase-dashboard\n```\n\nThe Supabase values can be found under `Project-\u003eSettings-\u003eAPI Settings`.\n\n![Supabase environment variables.](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/passage-by-1password/07.png)\n\nThe Passage values can be found under `General-\u003eSettings` and `General-\u003eAPI Keys`.\n\n![Passage environment variables.](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/passage-by-1password/08.png)\n\n![Passage environment variables.](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/passage-by-1password/09.png)\n\n\u003e The `PASSAGE_API_KEY` and `SUPABASE_JWT_SECRET` are secret values and should never be shared publicly. They will only be used in the server-side code of the Next.js application.\n\nRestart your Next.js development server to read in the environment variables.\n\n```bash\nnpm run dev\n```\n\n## 4. Add Passage login to your app\n\n#### Add Passage Element\n\nInstall the `@passageidentity/passage-elements` package.\n\n```bash\nnpm install @passageidentity/passage-elements\n```\n\nCreate a new folder called components with a new login file `components/login.js` and add the following content.\n\n```js\n// components/login.js\nimport { useEffect } from 'react'\n\nconst PassageLogin = () =\u003e {\n  useEffect(() =\u003e {\n    require('@passageidentity/passage-elements/passage-auth')\n  }, [])\n\n  return (\n    \u003c\u003e\n      \u003cpassage-auth app-id={process.env.NEXT_PUBLIC_PASSAGE_APP_ID}\u003e\u003c/passage-auth\u003e\n    \u003c/\u003e\n  )\n}\n\nexport default PassageLogin\n```\n\nThen update `pages/index.js` to include the login component.\n\n```js\n// pages/index.js\nimport styles from '@/styles/Home.module.css'\nimport PassageLogin from '@/components/login'\n\nexport default function Home(props) {\n  return (\n    \u003cdiv className={styles.main}\u003e\n      \u003cPassageLogin /\u003e\n    \u003c/div\u003e\n  )\n}\n```\n\nWhen we have a successful registration the Passage element will request a redirect to `/dashboard` per the redirect URL we set during app creation.\n\nCreate a new file `pages/dashboard.js` for this new route with the following content:\n\n```js\n// pages/dashboard.js\nimport styles from '@/styles/Home.module.css'\n\nexport default function Dashboard({ isAuthorized, userID, todos }) {\n  return (\n    \u003cdiv className={styles.main}\u003e\n      \u003cdiv className={styles.container}\u003e\n        \u003cp\u003eYou've logged in!\u003c/p\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  )\n}\n```\n\nNow when you visit `http://localhost:3000` in a browser you will have a fully functioning and passwordless login page!\n\n![Simple app with Passage login page.](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/passage-by-1password/10.png)\n\nGo ahead and go through the registration process. You will be able to register an account with either a passkey or a magic link. Once you've logged in, you will notice that you just get redirected to `/dashboard` page.\nThe login was successful, but we need to build in the functionality to know when a user is authenticated and show them the appropriate view.\n\n#### Use Passage to verify the JWT\n\nNow we will need to use a Passage SDK to verify the JWT from Passage.\n\nInstall the Passage Node.js library.\n\n```bash\nnpm install @passageidentity/passage-node\n```\n\nCreate a utils folder and a file called `utils/passage.js` with the following content.\n\n```js\n// utils/passage.js\nimport Passage from '@passageidentity/passage-node'\n\nconst passage = new Passage({\n  appID: process.env.NEXT_PUBLIC_PASSAGE_APP_ID,\n  apiKey: process.env.PASSAGE_API_KEY,\n})\n\nexport const getAuthenticatedUserFromSession = async (req, res) =\u003e {\n  try {\n    const userID = await passage.authenticateRequest(req)\n    if (userID) {\n      return { isAuthorized: true, userID: userID }\n    }\n  } catch (error) {\n    // authentication failed\n    return { isAuthorized: false, userID: '' }\n  }\n}\n```\n\nThis will be used in the `getServerSideProps()` function to check authentication status for a user. Add this function to `index.js` then update the `Home` function to use the props.\n\n```js\n// pages/index.js\nimport styles from '@/styles/Home.module.css'\nimport PassageLogin from '@/components/login'\nimport { getAuthenticatedUserFromSession } from '@/utils/passage'\nimport { useEffect } from 'react'\nimport Router from 'next/router'\n\nexport default function Home({ isAuthorized }) {\n  useEffect(() =\u003e {\n    if (isAuthorized) {\n      Router.push('/dashboard')\n    }\n  })\n\n  return (\n    \u003cdiv className={styles.main}\u003e\n      \u003cPassageLogin /\u003e\n    \u003c/div\u003e\n  )\n}\n\nexport const getServerSideProps = async (context) =\u003e {\n  const loginProps = await getAuthenticatedUserFromSession(context.req, context.res)\n  return {\n    props: {\n      isAuthorized: loginProps.isAuthorized ?? false,\n      userID: loginProps.userID ?? '',\n    },\n  }\n}\n```\n\nWe will also use this logic on the dashboard page to check if a user is authenticated. If not we should redirect them to the login page. We will also add a quick sign out button using Passage while we are at it.\n\n```js\n// pages/dashboard.js\nimport styles from '@/styles/Home.module.css'\nimport { useEffect } from 'react'\nimport Router from 'next/router'\nimport { getAuthenticatedUserFromSession } from '@/utils/passage'\nimport { PassageUser } from '@passageidentity/passage-elements/passage-user'\n\nexport default function Dashboard({ isAuthorized, userID }) {\n  useEffect(() =\u003e {\n    if (!isAuthorized) {\n      Router.push('/')\n    }\n  })\n\n  const signOut = async () =\u003e {\n    new PassageUser().signOut()\n    Router.push('/')\n  }\n\n  return (\n    \u003cdiv className={styles.main}\u003e\n      \u003ch1\u003eWelcome {userID}! \u003c/h1\u003e\n      \u003cbr\u003e\u003c/br\u003e\n      \u003cbutton onClick={signOut}\u003eSign Out\u003c/button\u003e\n    \u003c/div\u003e\n  )\n}\n\nexport const getServerSideProps = async (context) =\u003e {\n  const loginProps = await getAuthenticatedUserFromSession(context.req, context.res)\n\n  return {\n    props: {\n      isAuthorized: loginProps.isAuthorized ?? false,\n      userID: loginProps.userID ?? '',\n    },\n  }\n}\n```\n\nThe app can now tell the difference between an authenticated and unauthenticated user. When you log into the application, you will be redirected to the dashboard and see this message.\n\n![Authenticated users can see their user ID.](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/passage-by-1password/11.png)\n\n## 5. Integrate Supabase into Next.js app\n\nPassage and Supabase do not currently allow for custom signing secrets. Therefore, we will need to extract the necessary claims from the Passage JWT and sign a new JWT to send to Supabase.\n\nBecause of the sensitive nature of this functionality, we will handle the authentication and JWT exchange in Next.js’s server-side rendering function `getServerSideProps()`. Imports used in this function will not be bundled client-side. Additionally, the JWT provided by Passage is stored in a cookie which is automatically passed to `getServerSideProps()`.\n\n#### Sign Passage token for Supabase\n\nInstall the Supabase client SDK and the popular Node package `jsonwebtoken`, which allows us to easily work with JWTs.\n\n```bash\nnpm install @supabase/supabase-js jsonwebtoken\n```\n\nCreate a new file called `utils/supabase.js` and add the following content. This function accepts a Passage user ID and then creates and signs a Supabase JWT for that user. This allows Supabase to verify the token and authenticate the user when making Supabase calls.\n\n```js\n// utils/supabase.js\nimport { createClient } from '@supabase/supabase-js'\nimport jwt from 'jsonwebtoken'\n\nconst getSupabase = (userId) =\u003e {\n  const options = {}\n\n  if (userId) {\n    const payload = {\n      userId,\n      exp: Math.floor(Date.now() / 1000) + 60 * 60,\n    }\n    const token = jwt.sign(payload, process.env.SUPABASE_JWT_SECRET)\n\n    options.global = {\n      headers: {\n        Authorization: `Bearer ${token}`,\n      },\n    }\n  }\n\n  const supabase = createClient(\n    process.env.NEXT_PUBLIC_SUPABASE_URL,\n    process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY,\n    options\n  )\n  return supabase\n}\n\nexport { getSupabase }\n```\n\n#### Enable Row Level Security (RLS) in Supabase\n\nTo enable users to view and create their own todo items we need to write a RLS policy. Our policy will check the currently logged in user is to determine whether or not they should have access. Let's create a PostgreSQL function to extract the current user from our new JWT.\n\nNavigate back to the Supabase dashboard, select `SQL Editor` from the sidebar menu, and click `New query`. This will create a new query called `new sql snippet`, which will allow us to run any SQL against our Postgres database.\n\nWrite the following and click `Run`.\n\n```sql\ncreate or replace function auth.user_id() returns text as $$\n select nullif(current_setting('request.jwt.claims', true)::json-\u003e\u003e'userId', '')::text;\n$$ language sql stable;\n```\n\nYou should see the output `Success, no rows returned`. This created a function called `auth.user_id()` which will return the `userId` field of our JWT payload.\n\n\u003e To learn more about PostgresSQL functions, check out this [deep dive video](https://www.youtube.com/watch?v=MJZCCpCYEqk).\n\nNow we can create a policy that checks whether the current user is the owner of a todo item. From the `Authentication` sidebar menu in Supabase, click `Policies` then create a new policy.\n\n![RLS policies for a table.](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/passage-by-1password/12.png)\n\nChoose `For full customization create a policy from scratch` and add the following.\n\n![Policy to restrict access to todo items.](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/passage-by-1password/13.png)\n\nThis policy is calling the function we just created to get the currently logged in user's ID `auth.user_id() `and checking whether this matches the `user_id` column for the current todo. If it does, then it will allow the user to select it, otherwise it will deny access.\n\nClick `Review` and then `Save policy`.\n\n\u003e Note: To learn more about RLS and policies, check out this [deep dive video](https://www.youtube.com/watch?v=Ow_Uzedfohk).\n\n#### Fetch data from Supabase\n\nNow we can fetch data from Supabase specific to that user. We will update `pages/dashboard.js` to do the following:\n\n1. authenticate the user using Passage\n2. create and sign a JWT for the user with the Supabase secret\n3. query Supabase to fetch a user’s todo list items\n\n```js\n// pages/dashboard.js\nimport styles from '@/styles/Home.module.css'\nimport { useEffect } from 'react'\nimport Router from 'next/router'\nimport { getAuthenticatedUserFromSession } from '@/utils/passage'\nimport { getSupabase } from '../utils/supabase'\n\nexport default function Dashboard({ isAuthorized, userID, todos }) {\n  useEffect(() =\u003e {\n    if (!isAuthorized) {\n      Router.push('/')\n    }\n  })\n\n  return (\n    \u003cdiv className={styles.main}\u003e\n      \u003cdiv className={styles.container}\u003e\n        \u003ch1\u003eWelcome {userID}! \u003c/h1\u003e\n        \u003cbr\u003e\u003c/br\u003e\n        \u003cbutton onClick={signOut}\u003eSign Out\u003c/button\u003e\n        \u003cbr\u003e\u003c/br\u003e\n        \u003cdiv className={styles.list}\u003e\n          {todos?.length \u003e 0 ? (\n            todos.map((todo) =\u003e \u003cli key={todo.id}\u003e{todo.title}\u003c/li\u003e)\n          ) : (\n            \u003cp\u003eYou have completed all todos!\u003c/p\u003e\n          )}\n        \u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  )\n}\n\nexport const getServerSideProps = async (context) =\u003e {\n  const loginProps = await getAuthenticatedUserFromSession(context.req, context.res)\n\n  if (loginProps.isAuthorized) {\n    const supabase = getSupabase(loginProps.userID)\n    const { data } = await supabase.from('todo').select()\n\n    return {\n      props: {\n        isAuthorized: loginProps.isAuthorized ?? false,\n        userID: loginProps.userID ?? '',\n        todos: data ?? [],\n      },\n    }\n  } else {\n    return {\n      props: {\n        isAuthorized: loginProps.isAuthorized ?? false,\n        userID: loginProps.userID ?? '',\n      },\n    }\n  }\n}\n```\n\nWhen we reload our application, we are still getting the empty state for todos.\n\nThis is because we enabled Row Level Security, which blocks all requests by default and lets you granularly control access to the data in your database.\n\n#### Update the UserID data\n\nThe last thing we need to do is update the `user_id` columns for our existing todos. Head back to the Supabase dashboard, and select `Table editor` from the sidebar. You will see that the `user_id` field is NULL for all of our todo items.\n\n![User ID is NULL for all todo items.](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/passage-by-1password/14.png)\n\nTo get the user ID for our Passage user, go back to the Passage Console and check the `Users` tab.\n\n![Get User ID from Passage.](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/passage-by-1password/15.png)\n\nCopy this user ID and update two of the three rows in the Supabase database to match this user ID. When you are done, the database table will look like this.\n\n![Updated User ID in Supabase.](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/passage-by-1password/16.png)\n\nNow when we refresh the application, we will see the todo items for our user!\n\n![Authenticated users can see their todo items.](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/passage-by-1password/17.png)\n\n## Bonus: Add todo items\n\nTo build out a bit more functionality in our application, we can now let users add items to their to do list. Create a file `pages/api/addTodo.js` with the following content.\n\n```js\n// pages/api/addTodo.js\nimport { getSupabase } from '../../utils/supabase'\n\nexport default async function handler(req, res) {\n  const { userID, todo } = req.body\n  const supabase = getSupabase(userID)\n  const { data, error } = await supabase.from('todo').insert({ title: todo }).select().single()\n  if (error) return res.status(400).json(error)\n  res.status(200).json(data)\n}\n```\n\nThen update `pages/dashboard.js` to include a form for submitting new to do items. The complete file will look like this.\n\n```js\n//pages/dashboard.js\nimport styles from '@/styles/Home.module.css'\nimport { useEffect, useState } from 'react'\nimport Router from 'next/router'\nimport { getAuthenticatedUserFromSession } from '@/utils/passage'\nimport { getSupabase } from '../utils/supabase'\nimport { PassageUser } from '@passageidentity/passage-elements/passage-user'\n\nexport default function Dashboard({ isAuthorized, userID, initialTodos }) {\n  const [todos, setTodos] = useState(initialTodos)\n  useEffect(() =\u003e {\n    if (!isAuthorized) {\n      Router.push('/')\n    }\n  })\n\n  const handleSubmit = async (e) =\u003e {\n    e.preventDefault()\n    const data = new FormData(e.target)\n    const todo = data.get('todo')\n    const res = await fetch('/api/addTodo', {\n      method: 'POST',\n      headers: {\n        'Content-Type': 'application/json',\n      },\n      body: JSON.stringify({ todo, userID }),\n    }).then((res) =\u003e res.json())\n    setTodos([...todos, res])\n  }\n\n  const signOut = async () =\u003e {\n    new PassageUser().signOut()\n    Router.push('/')\n  }\n\n  return (\n    \u003cdiv className={styles.main}\u003e\n      \u003cdiv className={styles.container}\u003e\n        \u003ch1\u003eWelcome {userID}! \u003c/h1\u003e\n        \u003cbr\u003e\u003c/br\u003e\n        \u003cbutton onClick={signOut}\u003eSign Out\u003c/button\u003e\n        \u003cbr\u003e\u003c/br\u003e\n        \u003cdiv className={styles.list}\u003e\n          {todos?.length \u003e 0 ? (\n            todos.map((todo) =\u003e \u003cli key={todo.id}\u003e{todo.title}\u003c/li\u003e)\n          ) : (\n            \u003cp\u003eYou have completed all todos!\u003c/p\u003e\n          )}\n        \u003c/div\u003e\n        \u003cform onSubmit={handleSubmit}\u003e\n          \u003clabel\u003e\n            Todo: \u003cinput type=\"text\" name=\"todo\" /\u003e\n          \u003c/label\u003e\n          \u003cbutton\u003eSubmit\u003c/button\u003e\n        \u003c/form\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  )\n}\n\nexport const getServerSideProps = async (context) =\u003e {\n  const loginProps = await getAuthenticatedUserFromSession(context.req, context.res)\n\n  if (loginProps.isAuthorized) {\n    const supabase = getSupabase(loginProps.userID)\n    const { data } = await supabase.from('todo').select().is('is_complete', false)\n\n    return {\n      props: {\n        isAuthorized: loginProps.isAuthorized ?? false,\n        userID: loginProps.userID ?? '',\n        initialTodos: data ?? [],\n      },\n    }\n  } else {\n    return {\n      props: {\n        isAuthorized: loginProps.isAuthorized ?? false,\n        userID: loginProps.userID ?? '',\n      },\n    }\n  }\n}\n```\n\nFinally, we need to add a new RLS policy in Supabase to allow users to insert their own todo items.\n\n![RLS policy for inserting todo items.](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/passage-by-1password/18.png)\n\nThat's it! Now the website has form for submitting new items for the to do list.\n\n![Authenticated users can create todo items](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/passage-by-1password/19.png)\n\n## Resources\n\n- [Passage website](https://passage.id)\n- [Complete developer documentation](https://docs.passage.id)\n- [Passage Github](https://github.com/passageidentity), including SDKs and example apps for Next.js\n- [Developer community](https://discord.com/invite/445QpyEDXh) on Discord\n"])</script><script>self.__next_f.push([1,"1f:T984,"])</script><script>self.__next_f.push([1,"Simplify LLM API Calls across Anthropic, OpenAI, HuggingFace, Replicate, etc. \n\n## Use Supabase to log requests and see total spend across all LLM Providers (OpenAI, Azure, Anthropic, Cohere, Replicate, PaLM)\nliteLLM provides `success_callbacks` and `failure_callbacks`, making it easy for you to send data to a particular provider depending on the status of your responses. \n\nIn this case, we want to log requests to Supabase in both scenarios - when it succeeds and fails. \n\n### Create a supabase table \n\nGo to your Supabase project \u003e go to the [Supabase SQL Editor](https://supabase.com/dashboard/projects) and create a new table with this configuration.\n\nNote: You can change the table name. Just don't change the column names. \n\n```sql\ncreate table\n  public.request_logs (\n    id bigint generated by default as identity,\n    created_at timestamp with time zone null default now(),\n    model text null default ''::text,\n    messages json null default '{}'::json,\n    response json null default '{}'::json,\n    end_user text null default ''::text,\n    error json null default '{}'::json,\n    response_time real null default '0'::real,\n    total_cost real null,\n    additional_details json null default '{}'::json,\n    constraint request_logs_pkey primary key (id)\n  ) tablespace pg_default;\n```\n\n### Use Callbacks \nUse just 2 lines of code, to instantly see costs and log your responses **across all providers** with Supabase: \n\n```\nlitellm.success_callback=[\"supabase\"]\nlitellm.failure_callback=[\"supabase\"]\n```\n\nComplete code\n```python\nfrom litellm import completion\n\n## set env variables\nos.environ[\"SUPABASE_URL\"] = \"your-supabase-url\" \nos.environ[\"SUPABASE_key\"] = \"your-supabase-key\" \nos.environ[\"OPENAI_API_KEY\"] = \"\"\n\n# set callbacks\nlitellm.success_callback=[\"supabase\"]\nlitellm.failure_callback=[\"supabase\"]\n\n#openai call\nresponse = completion(model=\"gpt-3.5-turbo\", messages=[{\"role\": \"user\", \"content\": \"Hi 👋 - i'm openai\"}]) \n\n#bad call\nresponse = completion(model=\"chatgpt-test\", messages=[{\"role\": \"user\", \"content\": \"Hi 👋 - i'm a bad call to test error logging\"}]) \n```\n\n### Additional Controls \n\n**Different Table name**\n\nIf you modified your table name, here's how to pass the new name.\n\n```python \nlitellm.modify_integration(\"supabase\",{\"table_name\": \"litellm_logs\"})\n```\n\n**Identify end-user**\n\nHere's how to map your llm call to an end-user \n\n```python\nlitellm.identify({\"end_user\": \"krrish@berri.ai\"})\n```"])</script><script>self.__next_f.push([1,"20:T81a,"])</script><script>self.__next_f.push([1,"Readyset is a SQL caching engine that helps developers build performant, real-time applications without making code changes or switching databases.\n\n## Ready to use Readyset?\n\nWe're excited to onboard you onto Readyset. Before we can get started, we'll need to make sure your database is configured correctly. Please verify the following list of requirements on Supabase:\n\n### Request access to `prep_readyset` function via support ticket\n\nThere are few required queries that need to be run in order to prepare your cluster for Readyset use. A predefined function that will perform all those actions can be requested from the Supabase Support team. Open a support ticket requesting access to `prep_readyset` function and provide your Reference ID. You can get your Reference ID by navigating to Settings \u003e General:\n\n![screenshot-5](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/readyset/screenshot-0.png)\n\nOnce created, you can run `select prep_readyset();` from the SQL editor in the Dashboard.\n\n### Enable IPv4\n\nNavigate to Settings \u003e Add Ons and click on Change IPv4 Address\n\n![screenshot-1](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/readyset/screenshot-1.png)\n\nSelect IPv4 Address and click in Confirm.\n\n![screenshot-2](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/readyset/screenshot-2.png)\n\n### Disable Connection Pooling\n\nNavigate to Settings \u003e Database and unselect Use connection pooling:\n\n![screenshot-3](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/readyset/screenshot-3.png)\n\nGrab your connection ID to be used in Readyset Cloud.\n\n### Run Readyset with Required Flags\n\nOnce everything is set, the only remaining step is running `readyset` with two additional options.\nYou can either pass the `--disable-setup-ddl-replication` and `--disable-create-publication` flags directly to the CLI,\nor you can set `DISABLE_SETUP_DDL_REPLICATION` and `DISABLE_CREATE_PUBLICATION` options if you are using configuration file."])</script><script>self.__next_f.push([1,"21:Tc0f,"])</script><script>self.__next_f.push([1,"# Byteline Sync\n\n## Introduction to the product\n\nMatch data real-time between Supabase and your apps like Google Sheets, Airtable, Notion, Webflow, HubSpot, and more.\n\n## Use Cases for Supabase Users\n\n**Keep your Supabase tables in sync with business tools.** Automatically sync rows from Supabase to Google Sheets, Airtable, Notion, or HubSpot so non-technical teammates always have access to the latest data without querying the database directly.\n\n**Power a custom frontend with live Supabase data.** Sync Supabase tables to Webflow CMS or other content platforms to build branded customer-facing pages, directories, or dashboards that stay up to date automatically.\n\n**Centralize data from external apps into Supabase.** Pull data from tools like Stripe, Greenhouse, Google Sheets, or ClickUp into your Supabase tables to create a single source of truth for your application's backend.\n\n**Automate cross-platform record management.** When a record is created, updated, or deleted in Supabase, Byteline reflects that change in your connected apps instantly — and vice versa — without writing custom API integrations or cron jobs.\n\n**Migrate and backfill existing data.** Import historical records from other platforms into Supabase, or export your existing Supabase data into connected apps, with a one-time historical sync before enabling ongoing real-time updates.\n\n## How to Set Up the Integration\n\n### Step 1: Create a new sync\n\nLog in to your Byteline account at [console.byteline.io](https://console.byteline.io) and navigate to the My Syncs page. Click **Create Sync** to begin.\n\n### Step 2: Select Supabase\n\nChoose Supabase as your first app. Then select the second app you want to sync with (e.g., Google Sheets, Airtable, HubSpot, Webflow, etc.).\n\n### Step 3: Connect Supabase\n\nClick **Connect Supabase** to securely link your Supabase account. Byteline will establish a connection to your Supabase database. Byteline adds a few lightweight, read-only helper functions and a change trigger to your database to enable syncing — these do not modify your existing data.\n\n### Step 4: Map your tables\n\nSelect the tables you want to sync between Supabase and your connected app. Map the fields from Supabase to the corresponding fields in the destination app using drag-and-drop field mapping.\n\n### Step 5: Choose your data scope\n\nSelect whether to sync existing records, future changes, or both. You can also configure the sync direction (one-way or two-way) at the individual field level.\n\n### Step 6: Start the sync\n\nPreview your configuration to make sure everything looks correct, then click **Start Sync**. Byteline will perform an initial sync of your existing data and then keep everything updated automatically in the background.\n\nYou can monitor sync progress, view logs, or make changes anytime from the Syncs dashboard.\n\n## Documentation\n\nFor detailed configuration instructions, visit the [Byteline Supabase Data Sync documentation](https://docs.byteline.io).\nFor general data sync features and tips, see [Data Sync - Getting Started](https://docs.byteline.io)."])</script><script>self.__next_f.push([1,"22:T12ae,"])</script><script>self.__next_f.push([1,"## **ParadeDB × Supabase: Simple, Elastic-Quality Search for Supabase Apps**\n\nParadeDB is a Postgres-native search and analytics engine. When paired with Supabase, it runs as a logical replica of your primary database—keeping data in sync with zero ETL while isolating heavy search workloads from your transactional write path.\n\n- **Supabase Postgres** is your system of record for writes, auth, RLS, and OLTP traffic\n- **ParadeDB** acts as a read-optimized search layer for full-text search, semantic (vector) search, filtering, and faceting\n\n![Use logical replication to attach ParadeDB to Supabase as a search replica](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/paradedb/paradedb-inline.png)\n\n## **Common use cases**\n\n1. **Full-text search without impacting OLTP**\n    \n    Ranking, filtering, and aggregation queries run on ParadeDB instead of your primary database, reducing latency spikes and protecting transactional workloads.\n    \n2. **Search features beyond built-in Postgres FTS**\n    \n    Build BM25 indexes across multiple columns for industry-standard ranking, filter and aggregate efficiently, and use advanced features like field boosting, proximity search, regex filters, and non-Latin language tokenization. Combine lexical and vector search using reciprocal rank fusion (RRF) for hybrid search.\n    \n3. **Zero-ETL search architecture**\n    \n    ParadeDB stays in sync with Supabase using Postgres logical replication, eliminating dual-writes and external indexing pipelines.\n    \n\n## **How the integration works**\n\n1. Deploy ParadeDB in an environment reachable from Supabase.\n2. In Supabase, create a publication and logical replication slot, then add the tables you want to replicate.\n3. In ParadeDB, create a subscription using Supabase’s direct connection string.\n4. Create BM25 indexes on the replicated tables and start querying.\n\n## **Step-by-step**\n\n### **1) Deploy ParadeDB**\n\nFor a quick start you can deploy ParadeDB using Docker.\n\n```bash\ndocker run \\\n  --name paradedb \\\n  -e POSTGRES_USER=myuser \\\n  -e POSTGRES_PASSWORD=mypassword \\\n  -e POSTGRES_DB=mydatabase \\\n  -v paradedb_data:/var/lib/postgresql/ \\\n  -p 5432:5432 \\\n  -d \\\n  paradedb/paradedb:latest\n```\n\nMake sure your ParadeDB instance is reachable from Supabase.\n\n### **2) On Supabase: create a publication**\n\nIn the Supabase SQL editor (or a direct connection), create a publication:\n\n```sql\nCREATE PUBLICATION paradedb_pub;\n```\n\nAdd the table you want replicated:\n\n```sql\nALTER PUBLICATION paradedb_pub ADD TABLE public.your_table;\n```\n\nWhile a Postgres publication can include multiple tables, we don’t recommend this for high-volume production workloads. PostgreSQL 18 and below use a single apply worker per publication, which can become a bottleneck. This is expected to improve in PostgreSQL 19.\n\n### **3) On Supabase: create a logical replication slot**\n\n```sql\nSELECT pg_create_logical_replication_slot('paradedb_slot', 'pgoutput');\n```\n\n### **4) On ParadeDB: create the subscription to Supabase**\n\n```sql\nCREATE SUBSCRIPTION paradedb_sub\nCONNECTION 'host=YOUR_SUPABASE_HOST user=postgres password=YOUR_PASS dbname=postgres'\nPUBLICATION paradedb_pub\nWITH (copy_data = true, create_slot = false, slot_name = paradedb_slot);\n```\n\nMake sure that:\n\n- You use the **\"Direct connection\" string** from Supabase\n- Your destination supports IPv6 or enable Supabase’s IPv4 add-on if needed.\n\n### **5) Create a BM25 index on the replicated table**\n\nOnce data is present in ParadeDB, activate the `pg_search` extension, then create your first BM25 index. \n\n```sql\nCREATE EXTENSION IF NOT EXISTS pg_search;\n\nCREATE INDEX your_search_idx ON public.your_table\nUSING bm25 (id, title, body, category, created_at)\nWITH (key_field = 'id');\n```\n\nMake sure that the first column in your index is your primary key, and include fields you plan to **search, filter, GROUP BY, ORDER BY, or aggregate** as part of search (even if they aren’t all text).\n\n### **6) Query ParadeDB from your app**\n\nYou run your full-text search queries in ParadeDB rather than from Supabase. ParadeDB comes with several search operators, the most commonly used are:\n\n- `|||`  gives you match disjunction (OR)\n- `\u0026\u0026\u0026`  gives you match conjunction (AND)\n\nFor example, to find all rows in which `body` contains `running` *and* `shoes` , ordering the results by BM25 score:\n\n```sql\nSELECT id, title, category, pdb.score(id) AS score\nFROM public.your_table\nWHERE body \u0026\u0026\u0026 'running shoes'\nORDER BY score DESC\nLIMIT 20;\n```\n\nWith ParadeDB and Supabase, you get Elastic-grade search without impacting your Supabase service, or leaving the Postgres ecosystem.\n\nFor more information have a peek at our [full-text search docs](https://docs.paradedb.com/documentation/full-text/overview)."])</script><script>self.__next_f.push([1,"23:T4da,"])</script><script>self.__next_f.push([1,"[Microsoft SQL Server](https://www.microsoft.com/en-us/sql-server/) is a proprietary relational database management system developed by Microsoft. It's used by enterprises worldwide for transactional workloads, analytics, and mission-critical applications, with SQL Server 2025 adding built-in AI capabilities, vector search, and native JSON support.\n\nThe SQL Server Wrapper brings your SQL Server tables and views into Postgres as queryable foreign tables. Query data with plain SQL, use subqueries in table definitions, and take advantage of pushdown for `where`, `order by`, `limit`, and aggregate clauses — so queries run on SQL Server, not locally. Read-only, and works with Supabase Vault for secure connection string management.\n\n### Supported Data Types\n\n| Postgres Type | SQL Server Type |\n| --- | --- |\n| boolean | bit |\n| char | tinyint |\n| smallint | smallint |\n| real | float(24) |\n| integer | int |\n| double precision | float(53) |\n| bigint | bigint |\n| numeric | numeric / decimal |\n| text | varchar / char / text |\n| date | date |\n| timestamp | datetime / datetime2 / smalldatetime |\n| timestamptz | datetime / datetime2 / smalldatetime |\n\n### Resources\n\n- [supabase/wrappers on GitHub](https://github.com/supabase/wrappers)"])</script><script>self.__next_f.push([1,"24:T1dd8,"])</script><script>self.__next_f.push([1,"# Inworld Language Tutor\n\nA conversational language learning app powered by Inworld AI. Practice speaking with an AI tutor, get realtime feedback on your responses, and build vocabulary with auto-generated flashcards. This template can be used to add realtime conversational AI functionality to any application.\n\n![App](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/inworld-ai/Inworld_Supabase_image1-569383e2-0d19-4ff2-8d5c-8cc16b422c23.png)\n\n## Prerequisites\n\n- Node.js (v20 or higher)\n- npm\n- An Inworld AI account and API key\n- An AssemblyAI account and API key (for speech-to-text)\n\n## Get Started\n\n### Step 1: Clone the Repository\n\n```bash\ngit clone https://github.com/inworld-ai/language-learning-node\ncd language-learning-node\n```\n\n### Step 2: Install Dependencies\n\n```bash\nnpm install\n```\n\nThis installs dependencies for the root, backend, and frontend automatically.\n\n### Step 3: Configure Environment Variables\n\nCreate a `backend/.env` file:\n\n```bash\nINWORLD_API_KEY=your_inworld_base64_key\nASSEMBLY_AI_API_KEY=your_assemblyai_key\n```\n\n| Service        | Get Key From                                        | Purpose                           |\n| -------------- | --------------------------------------------------- | --------------------------------- |\n| **Inworld**    | [platform.inworld.ai](https://platform.inworld.ai/) | AI conversations (Base64 API key) |\n| **AssemblyAI** | [assemblyai.com](https://www.assemblyai.com/)       | Speech-to-text                    |\n\n### Step 4: Run the Application\n\n**For development** (with auto-reload on file changes):\n\n```bash\nnpm run dev\n```\n\nThis starts both the backend (port 3000) and frontend dev server (port 5173) concurrently.\n\nOpen [http://localhost:5173](http://localhost:5173)\n\n**For production**:\n\n```bash\nnpm run build\nnpm start\n```\n\nOpen [http://localhost:3000](http://localhost:3000)\n\n### Step 5 (Optional): Set Up Supabase for Auth \u0026 Memory\n\nWithout Supabase, the app works in anonymous mode using localStorage.\n\n**a) Create a Supabase project** at [supabase.com](https://supabase.com)\n\n**b) Push the database schema:**\n\n```bash\nnpx supabase login\nnpx supabase link --project-ref YOUR_PROJECT_REF\nnpx supabase db push\n```\n\nThis creates all tables, indexes, RLS policies, and the `match_memories` function for semantic search.\n\nFind your project ref in the Supabase dashboard URL: `supabase.com/dashboard/project/YOUR_PROJECT_REF`\n\n**c) Add Supabase variables to `backend/.env`:**\n\n```bash\nSUPABASE_URL=https://YOUR_PROJECT.supabase.co\nSUPABASE_SECRET_KEY=your_secret_key\n```\n\n**d) Create `frontend/.env.local`:**\n\n```bash\nVITE_SUPABASE_URL=https://YOUR_PROJECT.supabase.co\nVITE_SUPABASE_PUBLISHABLE_KEY=your_anon_key\n```\n\nFind these in: Supabase Dashboard \u003e Settings \u003e API\n\n## Repo Structure\n\n```\nlanguage-learning-node/\n├── backend/\n│   ├── src/\n│   │   ├── __tests__/        # Backend unit tests\n│   │   ├── config/           # Language, LLM \u0026 server configuration\n│   │   ├── graphs/           # Inworld Runtime conversation graphs\n│   │   │   ├── configs/      # Graph JSON configurations\n│   │   │   └── nodes/        # Custom graph nodes\n│   │   ├── helpers/          # Audio utils, connection management\n│   │   ├── prompts/          # Nunjucks prompt templates\n│   │   ├── services/         # Server components (WS handler, API routes)\n│   │   ├── types/            # TypeScript types\n│   │   ├── utils/            # Logger\n│   │   └── server.ts         # Entry point\n│   └── vitest.config.ts      # Backend test config\n├── frontend/\n│   ├── src/\n│   │   ├── __tests__/        # Frontend unit tests\n│   │   ├── components/       # React components\n│   │   ├── config/           # Language configuration\n│   │   ├── context/          # App state \u0026 auth\n│   │   ├── hooks/            # Custom React hooks\n│   │   ├── services/         # WebSocket client, audio, storage\n│   │   ├── styles/           # CSS\n│   │   └── types/            # TypeScript types\n│   └── vitest.config.ts      # Frontend test config\n├── supabase/\n│   └── migrations/           # Database schema\n├── render.yaml               # Render deployment config\n└── package.json              # Monorepo scripts\n```\n\n## Architecture\n\nThe app uses a real-time audio streaming architecture:\n\n1. **Frontend** captures microphone audio and streams it via WebSocket\n2. **Backend** processes audio through an Inworld Runtime graph:\n   - AssemblyAI handles speech-to-text with voice activity detection\n   - LLM generates contextual responses in the target language\n   - TTS converts responses back to audio\n3. **Flashcards** are auto-generated from conversation vocabulary\n4. **Response feedback** provides grammar and usage corrections\n\n## Memory System\n\nWhen Supabase is configured, the app stores and retrieves user memories using semantic search:\n\n- **Automatic memory creation**: Every few conversation turns, the system extracts memorable facts\n- **Semantic retrieval**: Relevant memories are retrieved using vector similarity search (pgvector)\n- **Personalized responses**: The AI uses retrieved memories to personalize conversations\n\nMemory types:\n\n- `learning_progress`: Vocabulary struggles, grammar patterns, learning achievements\n- `personal_context`: Interests, goals, preferences shared by the user\n\nWithout Supabase, the app works in anonymous mode using localStorage (no memory persistence).\n\n## Environment Variables Reference\n\n| Variable                    | Required | Description                                                        |\n| --------------------------- | -------- | ------------------------------------------------------------------ |\n| `INWORLD_API_KEY`           | Yes      | Inworld AI Base64 API key                                          |\n| `ASSEMBLY_AI_API_KEY`       | Yes      | AssemblyAI API key                                                 |\n| `PORT`                      | No       | Server port (default: 3000)                                        |\n| `LOG_LEVEL`                 | No       | `trace`, `debug`, `info`, `warn`, `error`, `fatal` (default: info) |\n| `NODE_ENV`                  | No       | Set to `production` for production log format                      |\n| `ASSEMBLY_AI_EAGERNESS`     | No       | Turn detection: `low`, `medium`, `high` (default: high)            |\n| `SUPABASE_URL`              | No       | Supabase project URL (enables memory feature)                      |\n| `SUPABASE_SECRET_KEY`       | No       | Supabase secret key (for backend memory storage)                   |\n\n## Testing\n\n```bash\n# Run all tests (backend + frontend)\nnpm test --prefix backend\n\n# Backend tests only\nnpm run test:backend --prefix backend\n\n# Frontend tests only\nnpm test --prefix frontend\n\n# Watch mode (backend)\nnpm run test:watch --prefix backend\n```\n\nTests cover critical paths: audio conversion, language configuration, storage persistence, and flashcard deduplication.\n\n## Troubleshooting\n\n**Bug Reports**: [GitHub Issues](https://github.com/inworld-ai/language-learning-node/issues)\n\n**General Questions**: For general inquiries and support, please email us at support@inworld.ai\n\n## Contributing\n\nWe welcome contributions! Please see [CONTRIBUTING.md](CONTRIBUTING.md) for guidelines on how to contribute to this project.\n\n## License\n\nThis project is licensed under the MIT License - see the [LICENSE](LICENSE) file for details.\n"])</script><script>self.__next_f.push([1,"25:T1608,"])</script><script>self.__next_f.push([1,"Spice.ai is an open-source data and AI platform offering zero-ETL SQL federation, acceleration, and hybrid search for data-intensive applications and AI agents.\n\nSpice extends Supabase’s scalable Postgres foundation by federating data lakes, warehouses, and APIs, accelerating queries, and enabling hybrid search across structured and unstructured data. Together, Spice and Supabase deliver a complete open-source stack for building AI-native apps that are grounded in up-to-date enterprise context without complex pipelines.\n\nBy connecting Supabase to Spice, developers can:\n\n- Query Supabase alongside any other data sources (S3, MySQL, Postgres, Snowflake, Databricks, Oracle, Kafka, etc.) in a single SQL statement\n- Accelerate Supabase tables locally for sub-second queries - materialize frequently accessed datasets for more responsive dashboards, APIs, and applications.\n- Add hybrid search (vector and full text search) to Supabase tables without modifying schemas\n- Call AI models (OpenAI, Anthropic, local models) directly from SQL using Supabase data\n- Provision secure AI sandboxes that expose only the minimal, policy-filtered Supabase data required for each agent or model\n- Use MCP to access all connected data sources and tools in a single endpoint.\n\n---\n\n## Why use Spice with Supabase?\n\n### Accelerate your Supabase queries\nRun complex or high-volume SQL queries in milliseconds across multiple backend data sources by caching and indexing working sets in the Spice runtime. This is ideal for analytics, dashboards, internal tools, and performance-sensitive APIs.\n\n### Federate Supabase with all your data\nJoin Supabase tables with data stored in object storage, warehouses, or other operational databases. \n### Add hybrid search to Supabase\nAutomatically vectorize and full-text index data sources and query them using SQL. No additional search service or embedding infrastructure required.\n### Integrate AI with Supabase and third party data\nCall OpenAI, Anthropic, or local LLMs from SQL, OpenAI-compatible APIs, and MCP and ground them in Supabase tables.\n### Secure AI sandboxing for Supabase data\nProtect your Supabase and production data by provisioning temporary, scoped AI sandboxes in Spice and ensure AI agents or models receive only the minimum data required, governed by detailed policies with full observabi
