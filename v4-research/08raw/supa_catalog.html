lity. \n### Eliminate ETL and pipelines\nSpice queries Supabase where in place and accelerates data alongside your compute, preserving Supabase as the source of truth while reducing operational complexity.\n## Features\n\n### Unified SQL\nQuery Supabase alongside any other system using a single SQL interface.\n\n### Local acceleration\nMaterialize Supabase tables in the Spice runtime for significantly faster queries and faster application response times.\n\n### Hybrid SQL search\nAdd embeddings and full-text indexes to any Supabase table and query them together using SQL.\n\n### Deployment optionality \nRun Supabase and Spice.ai Open Source locally, at the edge, or on the fully managed Spice.ai Cloud Platform. Lightweight, portable, and designed for scale.\n\n## Use cases for Supabase developers\n\n- Data-intensive applications that query across Supabase, S3, and analytics systems\n- Hybrid vector and full-text search across structured and unstructured data\n- AI-powered applications that need fast access to Supabase tables\n- Real-time APIs backed by Supabase data\n- Internal tools with sub-second query performance\n- Operational analytics with zero ETL\n\n## How to connect Spice to Supabase \n\nFollow these steps to get started with Supabase using the PostgreSQL Data Connector.\n\n\n## Pre-requisites\n- Supabase project.\n- Spice is installed (see the [Getting Started](https://docs.spiceai.org/getting-started) documentation).\n## Steps\n**Step 1.** From a Supabase project select `Project Settings` from the sidebar navigation.\n\n**Step 2.** Navigate to `Database` under `Configuration`.\n\n**Step 3.** Find the `Connection parameters` section.\n![Connection parameters](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/spice-ai/spice-ai-supabase-settings.avif)\n\n**Step 4.** Edit the `spicepod.yaml` file in this directory and replace `[remote_table_path]` with the path to the Supabase table to be accelerated, `[local_table_name]` with your desired name for the locally accelerated table, and the params section with the connection parameters from the Supabase project.\nSee the [datasets reference](https://docs.spiceai.org/reference/spicepod/datasets) for more dataset configuration options and [PostgreSQL Data Connector](https://docs.spiceai.org/data-connectors/postgres) for more options on configuring a PostgreSQL Data Connector.\nEnsure the `PG_PASS` environment variable is set to the password for your Supabase instance. Environment variables can be specified on the command line when running the Spice runtime, or in a `.env` file in the same directory as `spicepod.yaml`.\n\n\n```bash\necho \"PG_PASS=\u003cpassword\u003e\" \u003e .env\n```\nTo securely store the Supabase password, see [Secret Stores](https://docs.spiceai.org/components/secret-stores)\n\n**Step 5.** Run the Spice runtime with `spice run` from this directory.\nFollow the Spice [getting started guide](https://docs.spiceai.org/getting-started) to get started with the Spice runtime.\n\n**Step 6.** Run `spice sql` in a new terminal to start an interactive SQL query session against the Spice runtime.\nFor more information on using `spice sql`, see the [CLI reference](https://docs.spiceai.org/cli/reference/sql).\n\n**Step 7.** Execute the query `select * from [local_table_name];` to see the Supabase table accelerated locally."])</script><script>self.__next_f.push([1,"26:T518,"])</script><script>self.__next_f.push([1,"Draxlr is a simple and fast way to build dashboards, reports, and analytics on top of your Supabase database. It connects directly to your Supabase Postgres project so you can explore data, create SQL or no-code queries, and turn results into clear charts and dashboards in minutes.\n\nDraxlr also ships an MCP server, so you can connect AI assistants like Claude, ChatGPT, or Cursor to your Supabase data and ask questions in plain English in Claude, or AI assistants. The agent reads your schema, runs read only queries, and can s st message = await zavu.messages.send({\n      to: '+1234567890',\n      text: 'Your code is 123456',\n      channel: 'auto' // can be 'sms', 'whatsapp', 'voice', 'rcs', 'telegram' or 'email'\n    });\n\n    return new Response(JSON.stringify(message));\n  });"])</script><script>self.__next_f.push([1,"28:T702,"])</script><script>self.__next_f.push([1,"Nordcraft is the world’s first Web Development Engine. \n\nThe Nordraft Web Development Engine is visual tooling applied to a lean framework built on web standards. Think Unreal Engine, but for crafting impressive high-end web applications that delight your users. Plus, Nordcraft is open source. Choose to host your apps on Nordcraft’s platform, or self-host the lightweight 24kb runtime for complete control.\n\nNordcraft gives you a complete set of developer tools including:\n\n- An official Supabase integration\n- Connect to any backend API, with enhanced provision for APIs using an OpenAPI spec\n- Branching and version control\n- Component-based architecture familiar to React, Vue, and Svelte developers\n- Visual editing of UI components and design systems familiar to designers working in Figma\n- Server-side rendering as standard\n- Fast reactive core based on signals\n- Package publishing for code reusability across projects\n- Custom code abilities via the built-in code editor\n- A state-of-the-art animation editor\n- An issue tracker to flag accessibility, SEO, and other issues\n- Open source documentation\n\nThe Nordcraft Engine lets designers and developers collaborate faster to create immersive and interactive web experiences, eliminating design to dev handovers. Work with live data in the Nordcraft editor and see your changes in real time, and send a live preview link of your work in progress to anyone.\n\nAnd to showcase the power of the Web Development Engine, we built Nordcraft in Nordcraft.\n\n## Resources\n- Check out the [Nordcraft documentation](https://docs.nordcraft.com/)\n- Watch [tutorial videos on ic with JavaScript objects.\n\nIf you don’t have an Appsmith account, create one [here](https://app.appsmith.com/user/signup).\n\nLet’s get started!\n\n## Step 1: Set up your Backend on Supabase\n\n- On the [Supabase dashboard](https://supabase.com/dashboard), click `New project` and set the name to **Support Dashboard**\n\n![create-project-for-appsmith](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/appsmith/new-project.png)\n\n- Create a new table by clicking on the Create Table option on the side navigation.\n- Supabase provides many ways to add data to the tables, from writing queries to creating schemas using UI to simply uploading CSV files. For our support dashboard, we will be creating the **tickets** table by uploading the [CSV file](https://raw.githubusercontent.com/vihar/datasets/master/tickets.csv) on Supabase.\n\n![create-table-for-appsmith](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/appsmith/create-table.png)\n\nThe database is now set up.\n\n## Step 2: Connect the database to Appsmith\n\n- Note down the database connection information under Project Settings in Supabase.\n\n![connection-parameters-for-appsmith](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/appsmith/connection-parameters.png)\n\n- On Appsmith, create a new application under the dashboard under your preferred organization.\n- Click on the `+` icon next to Datasources on the left navigation bar under Page1\n- Next, click on Create New tab and choose PostgreSQL datasource, you’ll see the following screenshot:\n\n![create-datasource-appsmith-04](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/appsmith/create-datasource-appsmith-04.png)\n\n- Fill out the form to connect to your Supabase instance. Click **Test** to test connection and then **Save** to save the datasource\n\n![connect-supabase-datasource-05](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/appsmith/connect-supabase-datasource-05.png)\n\n## Step 3: Build UI on Appsmith\n\n- Click on the + icon next to widgets and drag and drop a Tab widget. We can configure using the property pane by clicking on the cog icon on the top-right corner.\n- As seen in the below screenshot, we have added four tabs to support the dashboard.\n\n![property-pane-appsmith-06](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/appsmith/property-pane-appsmith-06.png)\n\n- Add widgets to the **Home** tab to create the dashboard as shown in the screenshot below. For eg: **Critical Open Issues** is a **Text** widget and below it is an **Input** widget which we will bind later to display the number of open tickets.\n\n- Set up the **New** button to open a modal which will have a form to raise a new ticket.\n\n![bind-query-appsmith-07](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/appsmith/bind-query-appsmith-07.png)\n\n- In the modal widget, add a few widgets to accept input when creating a new ticket. Please refer to the screenshot below.\n\n![modal-appsmith-08](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/appsmith/modal-appsmith-08.png)\n\n## Step 4: Writing Queries in Appsmith and binding data to widgets\n\n- Click on the + icon next to Datasources on the navigation bar and click New Query next to the Supabase connection here to create a new query.\n\n![create-query-appsmith-09](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/appsmith/create-query-appsmith-09.png)\n\n- Rename the query to create_new_ticket under the query pane; here we can write SQL that can collect the data from the widgets using mustache templates.\n\n```jsx\nINSERT INTO PUBLIC.\"tickets\"(\"id\",\"createdAt\",\"user\",\"updatedAt\",\"description\",\n\"status\",\"priority\",\"category\",\"assignedTo\")\nVALUES('{{appsmith.store.ticket.id}}','{{moment().format('yyyy-mm-ddHH:MM:ss')}}','{{c_user.text}}',\n'{{moment().format('yyyy-mm-ddHH:MM:ss')}}','{{c_description.text}}','{{c_status.selectedOptionValue}}',\n'{{c_property.selectedOptionValue}}',\n'{{c_category.selectedOptionValue}}','{{c_assignee.selectedOptionValue}}');\n```\n\n- Click the **Confirm** button on the modal and under **Events**, set the **onClick** property to execute the create_new_ticket query.\n- Create a second query named **get_tickets** that will list all the tickets.\n\n  ***\n\n```jsx\nSELECT * FROM public.\"tickets\";\n```\n\n- Drag and drop a table widget under the **Assigned To Me** tab. Open the property pane and add the following snippet under **Table Data** to bind the query results.\n\n```jsx\n{\n  {\n    get_tickets.data.filter(\n      (t) =\u003e t.assignedTo === 'confidence@appsmith.com' \u0026\u0026 t.status !== 'closed'\n    )\n  }\n}\n```\n\n- Drag and drop a table widget under the **Resolved** tab. Open the property pane and add the following snippet under **Table Data** to bind the query results.\n\n```jsx\n{\n  {\n    get_tickets.data.filter((t) =\u003e t.status === 'open')\n  }\n}\n```\n\n- Drag and drop a table widget under the **Closed** tab. Open the property pane and add the following snippet under **Table Data** to bind the query results.\n\n```jsx\n{\n  {\n    get_tickets.data.filter((t) =\u003e t.status === 'closed')\n  }\n}\n```\n\n## Step 5: Creating Charts in Appsmith\n\n- On the **Home** tab, click on the first Chart widget. Add Title **Open Issues By Category**. Change the **Chart Type** property to **Column Chart**.\n- Update the x-axis and y-axis Labels under **Axis** on the property pane.\n- Add the following code snippet under the **Series Data** property to bind the data to be displayed on the x and y axes.\n\n```jsx\n[\n  {\n    \"x\": \"Hardware\",\n    \"y\": {{get_tickets.data.filter(t =\u003e t.status==='open' \u0026\u0026 t.category==='hardware').length}}\n  },\n  {\n    \"x\": \"Software\",\n    \"y\": {{get_tickets.data.filter(t =\u003e t.status==='open' \u0026\u0026 t.category==='software').length}}\n  },\n  {\n    \"x\": \"Other\",\n    \"y\": {{get_tickets.data.filter(t =\u003e t.status==='open' \u0026\u0026 t.category==='other').length}}\n  }\n]\n```\n\n- The second chart will be a pie chart. Add the title, axes labels as mentioned above,\n- Add the following code snippet under the **Series Data** property of the pie chart.\n\n```jsx\n[\n  {\n    \"x\": \"High\",\n    \"y\": {{get_tickets.data.filter(t =\u003e t.status==='open' \u0026\u0026 t.priority==='high').length}}\n  },\n  {\n    \"x\": \"Medium\",\n    \"y\": {{get_tickets.data.filter(t =\u003e t.status==='open' \u0026\u0026 t.priority==='medium').length}}\n  },\n  {\n    \"x\": \"Low\",\n    \"y\": {{get_tickets.data.filter(t =\u003e t.status==='open' \u0026\u0026 t.priority==='low').length}}\n  }\n]\n```\n\n## Resources\n\n- [Appsmith](https://www.appsmith.com/) official website.\n- [Appsmith GitHub](https://github.com/appsmithorg).\n- [Appsmith](https://docs.appsmith.com/) documentation.\n"])</script><script>self.__next_f.push([1,"2b:T1ceb,"])</script><script>self.__next_f.push([1,"Loops is an email platform for software companies letting you send your product, marketing, and transactional email from one simple interface.\n\nThis integration allows you to send Supabase Authentication emails over Loops' SMTP service.\n\nThere are two big benefits to using Loops for sending your Supabase emails:\n\n- **More control over design**: You can use [Loops' design editor](https://loops.so/docs/creating-emails/editor) to create (and then easily edit) beautiful transactional emails instead of having to code them with HTML.\n- **Better visibility of sent email**: You get full visibility on which emails are being sent, when, and to whom in your Loops account (something not offered in Supabase).\n\n### 1. Set up Loops SMTP in Supabase\n\nGo to your Authentication settings in Supabase (**Project Settings -\u003e Authentication**) to tell Supabase to send emails using Loops' SMTP service.\n\nScroll down and toggle the **Enable Custom SMTP** option on.\n\nIn the Sender details section, you will need to enter some values into the \"Sender email\" and \"Sender name\" fields. However, _these values will always be overwritten by the values set in your Loops templates_ from the next step.\n\nIn the **SMTP Provider Settings** section enter the following data:\n\n| Field       | Value                                                                                       |\n| ----------- | ------------------------------------------------------------------------------------------- |\n| Host        | `smtp.loops.so`                                                                             |\n| Port number | `587`                                                                                       |\n| Username    | `loops`                                                                                     |\n| Password    | An API key copied from your [API settings](https://app.loops.so/settings?page=api) in Loops |\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/loops/supabase-smtp-settings.png)\n\nNote that for the interval and rate limit settings, you will be bound by Loops' [API rate limit](https://loops.so/docs/api-reference/intro#rate-limiting) of 10 requests per second.\n\nOne final step is to check that the \"Confirm email\" toggle is turned on in the Email section in **Authentication -\u003e Providers**.\n\n### 2. Create Transactional emails in Loops\n\nNext, create new transactional emails for the emails listed in Supabase (**Authentication -\u003e Email Templates**). You need to create both **Confirm signup** and **Magic Link** emails to be able to properly set up the integration.\n\n- Confirm signup (required)\n- Invite user\n- Magic Link (required)\n- Change Email Address\n- Reset Password\n\nNote that if a Supabase user has not previously confirmed their email, they will be sent a **Confirm signup** email when you request a **Magic Link** email.\n\nTo create new transactional emails, go to the [Transactional page](https://app.loops.so/transactional) in Loops and click **New**. Alternatively, you can select one of our many ready-made templates from the [Templates page](https://app.loops.so/templates).\n\n![Supabase template in the editor](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/loops/supabase-template.png)\n\nYou can then use [the Loops editor](https://loops.so/docs/creating-emails/editor) to create nicely-designed templates or make them as simple as you like.\n\nYou can even [save styles](https://loops.so/docs/creating-emails/styles#saved-styles) so you can easily apply consistent branding to all of your emails.\n\n![Saved styles](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/loops/supabase-editor.png)\n\nFor each Loops template you create, you need to [add data variables](https://loops.so/docs/creating-emails/personalizing-emails#add-dynamic-content-to-emails), which allow data from Supabase to be inserted into each email.\n\nFor example, you could add a `confirmationUrl` data variable that you can map to the `{{ .ConfirmationURL }}` value from Supabase.\n\nYou can also build URLs by including values like `{{ .SiteUrl }}` or add in a confirmation code using `{{ .Token }}`.\n\n![Supabase values](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/loops/supabase-values.png)\n\nOnce you're done creating the email and adding data variables, click **Next**. On the next page, click the **Show payload** button to view the API payload for your template. You will need this for the next step.\n\n![Email payload](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/loops/supabase-payload.png)\n\nMake sure to also publish your email! It won't send unless it's published.\n\n[Read our detailed guide](https://loops.so/docs/transactional/guide) for sending transactional emails.\n\n### 3. Configure email templates in Supabase\n\nThe final step is to make sure your emails in Supabase are configured to send the correct data to Loops.\n\nLoops SMTP integrations work a bit differently than most. Instead of sending a text or HTML email body, you set them up to send API-like data.\n\nIn Supabase, go to **Authentication -\u003e Email Templates**, then edit each template to contain the payload as shown in the previous step (you can click the clipboard icon in Loops to copy the full payload).\n\nOnce pasted into the Message body, you need to add the Supabase message variables into the payload.\n\nImportant: Make sure you set up at least the **Confirm signup** and **Magic Link** templates in Supabase, otherwise emails will not be sent.\n\nAlso, any variables added in the **Confirm signup** template need to also be available in **Magic link** email, because Supabase will send a **Confirm signup** email instead of a **Magic Link** email if a user hasn't confirmed their email address.\n\nHere is an example **Confirm signup** email template. This payload was copied from the template's Publish page in Loops, then the `{{ .Email }}` and `{{ .ConfirmationURL }}` Supabase variables were added.\n\n```json\n{\n  \"transactionalId\": \"clvmzp39u035tl50pw7wrl0ri\",\n  \"email\": \"{{ .Email }}\",\n  \"dataVariables\": {\n    \"confirmationUrl\": \"{{ .ConfirmationURL }}\"\n  }\n}\n```\n\nHere's how it looks in the Supabase editor:\n\n![Supabase editor](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/loops/supabase-email.png)\n\nWith the integration now all set up, your Supabase authentication emails will be sent via Loops, giving you more visibility on your email sends and the great addition of being able to build beautiful and easy-to-update emails in the Loops editor.\n\nTo view all sends of your transactional emails, click through to the email from the [Transactional](https://app.loops.so/transactional) page in Loops, where you'll find the Metrics page containing a table showing all sends and some statistics.\n\n## Important notes\n\n- You need to add a template in Loops and set up the email in Supabase for at least the **Confirm signup** and **Magic Link** templates.\n- The subject in Supabase templates is always overwritten by the subject added to the corresponding template in Loops.\n- The sender name and sender email configured in your Supabase SMTP settings are always overwritten by the sender details added to your templates in Loops.\n- Any Supabase email not set up with the correct API-like payload will fail to send.\n"])</script><script>self.__next_f.push([1,"2c:T48b,"])</script><script>self.__next_f.push([1,"[Airtable](https://www.airtable.com/) is an AI-native app platform that combines the flexibility of a spreadsheet with the structure of a relational database. Teams use it to build collaborative apps, manage workflows, and organize operational data across marketing, product, and project management.\n\nThe Airtable Wrapper brings your bases and tables into Postgres as queryable foreign tables. Query records with plain SQL, target specific views, and join Airtable data against your application data. It is read-only and works with Supabase Vault for secure API key management.\n\n### Supported Data Types\n\n| Airtable Field Type | Postgres Type |\n| --- | --- |\n| Single line text, Long text, Email, URL, Phone | text |\n| Number | numeric, integer, bigint, real, double precision |\n| Currency, Percent | numeric |\n| Autonumber | bigint |\n| Single select | text |\n| Multiple select | jsonb |\n| Checkbox | boolean |\n| Date | date |\n| Created time, Last modified time | timestamp |\n| Created by, Last modified by, User | jsonb |\n| Multiple record links, Attachments, Lookup | jsonb |\n\n### Resources\n\n- [supabase/wrappers on GitHub](https://github.com/supabase/wrappers)"])</script><script>self.__next_f.push([1,"2d:T964,"])</script><script>self.__next_f.push([1,"# Scriptonia Integration for Supabase\n\n## Introduction\n\nScriptonia is an AI-powered platform that generates complete, production-ready project blueprints for web applications, mobile apps, and websites. With our Supabase integration, developers can instantly create full-stack applications with authentication, real-time features, and storage already configured.\n\n## Use Cases for Supabase Users\n\n- **Rapid Prototyping:** Generate complete project structures with Supabase authentication and database schemas in minutes\n- **Full-Stack Development:** Get pre-configured Supabase clients, authentication flows, and API integrations out of the box\n- **Real-time Applications:** Start with real-time subscriptions, presence, and broadcast channels already implemented\n- **File Management:** Projects include Supabase Storage integration for user uploads and media management\n- **Production-Ready Code:** Receive complete, documented codebases with Supabase best practices built-in\n\n## How to Set Up the Integration\n\n1. **Visit Scriptonia:** Go to [www.scriptonia.xyz](https://www.scriptonia.xyz)\n2. **Start a Project:** Enter your project idea and requirements\n3. **Enable Supabase Integration:** Toggle the Supabase integration option during platform selection\n4. **Complete Payment:** Process payment using Solana or card\n5. **Receive Your Project:** Download a complete project with:\n   - `supabase.md` setup guide in the `db/` folder\n   - Pre-configured Supabase client initialization\n   - Authentication components and flows\n   - Real-time subscription examples\n   - Storage upload utilities\n   - Database schema recommendations\n   - Environment variable templates\n\nThe generated `supabase.md` file includes:\n- Step-by-step Supabase project setup instructions\n- API key configuration\n- Database schema recommendations based on your project\n- Authentication implementation examples\n- Real-time setup guides\n- Storage bucket configuration\n- Security best practices\n- Deployment instructions\n\n## Benefits\n\n- **Time Savings:** Skip hours of boilerplate setup and configuration\n- **Best Practices:** Follow Supabase-recommended patterns from day one\n- **Complete Documentation:** Every generated project includes comprehensive setup guides\n- **Multi-Platform Support:** Works with Web Applications, Android, and iOS projects\n- **AI-Powered:** Context-aware code generation tailored to your specific use case\n"])</script><script>self.__next_f.push([1,"2e:T53c,"])</script><script>self.__next_f.push([1,"Lovable turns a plain-language prompt into working software — the UI, the database, the auth, all generated together instead of built one piece at a time. Non-technical builders ship a real app without touching code. Developers who want more control can go straight into Supabase's dashboard whenever they need it.\n\nAn idea is only as real as what's holding it up. Describing a feature is the easy part — giving it somewhere to actually live is the harder one. That's what Supabase brings to Lovable: a production Postgres database, authentication, file storage, real-time updates, and edge functions, all wired to whatever you just asked for. Say what you want to build, and Lovable designs the schema, the login flow, or the storage bucket behind it.\n\nOnce connected, you can add sign-up and login with email/password or providers like Google and GitHub, store and query structured data in a Postgres database Lovable builds from your prompt, upload and serve files through Supabase Storage, ship live features — chat, activity feeds, dashboards — that update the instant the data changes, and run custom backend logic through Edge Functions for anything from sending an email to processing a payment. Connect your own Supabase project and you keep full ownership: your account, your billing, your dashboard, whenever you want in."])</script><script>self.__next_f.push([1,"2f:Ta05,"])</script><script>self.__next_f.push([1,"Ory is an open source ecosystem and a cloud offering authentication, authorization, access control, and delegation (OAuth2 \u0026 OpenID Connect) services and APIs.\n\n## Ory Network\n\nThe [Ory Network](https://www.ory.sh/cloud) is the fastest, most secure, and\nworry-free way to use Ory's Services. It provides the infrastructure for modern end-to-end security:\n\n- Identity \u0026 credential management scaling to billions of users and devices\n- Registration, login, and account management flows for passkeys, biometric authentication,\n  social sign-in, SSO, and multi-factor authentication\n- Pre-built login, registration, and account management pages and components\n- OAuth2 and OpenID Connect provider for single sign-on, API access, and\n  machine-to-machine authorization\n- Low-latency permission checks based on Google's Zanzibar model and with\n  built-in support for the Ory Permission Language\n\nIt's fully managed, highly available, developer \u0026 compliance-friendly!\n\n- GDPR-friendly secure storage with data locality\n- Cloud-native APIs, compatible with Ory's open-source servers\n- Comprehensive admin tools with the web-based Ory Console and the Ory Command\n  Line Interface (CLI)\n- Extensive documentation, straightforward examples, and easy-to-follow guides\n- Fair, usage-based [pricing](https://www.ory.sh/pricing)\n\nSign up for a [**free developer account**](https://console.ory.sh/registration?utm_source=github\u0026utm_medium=banner\u0026utm_campaign=org-readme) today!\n\n## Ory Open-Source Servers\n\n- [Ory Kratos](https://github.com/ory/kratos) is a fully customizable, API-only\n platform for login, two-factor authentication, social sign-in, passwordless\n flows, registration, account recovery, email / phone verification, secure credentials, identity\n and user management.\n- [Ory Hydra](https://github.com/ory/hydra) is an API-only, \"headless,\" OAuth 2.0 and OpenID\n Connect provider that can interface with any identity and user management\n system, such as Ory Kratos, Firebase, your PHP app, LDAP, SAML, and others.\n- [Ory Oathkeeper](https://github.com/ory/oathkeeper) is a zero trust networking\n proxy and sidecar for popular ingress services and API gateways. It checks if\n incoming network request are authenticated and allowed to perform the\n requested action.\n- [Ory Keto](https://github.com/ory/keto) is the world's first and leading open-source implementation of\n [Google's Zanzibar](https://research.google/pubs/pub48190/) research paper, an\n infinitely scalable and blazing fast authorization and permissioning service - RBAC on globally distributed steroids."])</script><script>self.__next_f.push([1,"30:T6c8,"])</script><script>self.__next_f.push([1,"Aikido Attack Surface systematically evaluates publicly accessible Supabase configurations to detect conditions that could result in unauthorized data exposure. In Supabase, limited client access via the public anon key is expected; however, the security of this model relies on correctly implemented Row Level Security (RLS). Absent or improperly scoped RLS policies may render tables broadly readable or writable, exposing personally identifiable information (PII) or enabling cross-tenant access. Because the anon key is embedded in client-side code, any visitor can exploit such weaknesses, potentially leading to a material data breach depending on the sensitivity of the affected data.\n\n## Methodology\n\n- **Key discovery:** Crawl deployed frontend JavaScript assets to extract the Supabase client anon key.\n- **Project identification:** Determine the Supabase project endpoint (e.g., https://\\\u003cproject\\\u003e.supabase.co) from the JWT token or code references.\n- **Credential validation:** Establish a connection to the project to verify that the extracted anon key is valid.\n- **Surface enumeration:** Enumerate tables within the public schema that are addressable through the client context.\n- **Permission testing:** Attempt read and write operations on each table using only the anon key to identify gaps caused by missing or misconfigured RLS.\n- **Sensitivity assessment:** For any table that is readable, analyze returned records for PII and other sensitive fields to determine exposure severity and remediation priority.\n\nThrough this process, Aikido precisely identifies exposed tables, confirms write capabilities where present, and characterizes the sensitivity of leaked data, enabling timely and targeted corrective action."])</script><script>self.__next_f.push([1,"31:T10cc,"])</script><script>self.__next_f.push([1,"For web companies that need to manage their application's data to support internal operations, Forest Admin provides a SaaS admin panel that is automatically generated on top of their database. Thanks to its user-friendly GUI, both developers and non-dev users can manage data, create custom dashboards, and perform a wide range of administrative tasks for their applications. On top of that, Forest Admin provides a powerful system for managing user permissions and access control, allowing users to create custom roles and assign different levels of access to different users.\n\nSimply provide your Supabase URI, and in just 30 seconds you’ll have a powerful admin panel that goes beyond basic CRUD operations, offering enhanced data handling capabilities through powerful smart actions.\n\n## Documentation\n\nThis guide outlines how to instantly generate an Admin Panel on top of your Supabase backend.\n\n[Forest Admin](https://www.forestadmin.com/) offers an off-the-shelf Admin Panel system that can reduce the amount of time and effort needed to create, maintain, and manage internal tools.\nIt automatically builds a backend API and provides a user-friendly interface to Create, Read, Update and Delete, Search, Segment your data, trigger custom actions, control permissions, and set up workflows on top of your app's data.\n\n![forest-admin-collections](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/forest-admin/forest-admin-collections.png)\n\nIf you don’t have a Forest Admin account, you can create one in a few minutes [here](https://app.forestadmin.com/signup).\n\nLet’s get started!\n\n## Step 1: Configure your Supabase Backend\n\nIf you already have a Supabase project set up, simply go to the Project Settings / Database tab to access the Database Settings and retrieve the connection string (URI tab). This is the only information you will need to connect your Supabase account to Forest Admin.\n\n![Connection parameters for forestadmin](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/forest-admin/connection-string.png)\n\nIf you don't have anything set up on Supabase yet, you can [create a Project](https://supabase.com/dashboard/new/_) in just a few seconds. Once done, just go to the Database tab and create your first table.\n\n![New table for forestadmin](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/forest-admin/new-table.png)\n\n## Step 2: Connect the database to Forest Admin\n\nFirst, you have to create a new project on Forest Admin:\n![forestadmin-create-project](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/forest-admin/forestadmin-create-project.png)\n\nThen, you can use Forest Admin's Instant Setup for the Cloud mode to quickly get started. Alternatively, you can host the generated backend admin API on your own (Advanced setup), giving you full control of the backend code. In this guide, we will use the Cloud mode and the Instant Setup.\n![forestadmin-hosting](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/forest-admin/forestadmin-hosting.png)\n\nFinally, you can enter the database credentials you obtained in Step 1 and set them in Forest Admin by using the Connection URI mode. Don't forget to replace the password in the connection string with the database password you set in Supabase. Note that if you forget it, you can always go to your Supabase Database settings and reset your database password.\n![forestadmin-db-credentials](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/forest-admin/forestadmin-db-credentials.png)\n\n## You're all done!\n\nThere it is, the configuration of Forest Admin is now complete and your admin panel is now ready-to-use with all the features of an admin panel provided out of the box. You can now browse or manipulate all your data in a structured way, use search with support for complex filters, build dashboards, invite your team mates and start collaborating around your business operations and much more.\n\n## Resources\n\n- [Forest Admin](https://www.forestadmin.com/) official website.\n- [Forest Admin GitHub](https://github.com/ForestAdmin).\n- [Forest Admin](https://docs.forestadmin.com/documentation-portal/) documentation.\n"])</script><script>self.__next_f.push([1,"32:T517,"])</script><script>self.__next_f.push([1,"Connect Resend as the email provider for your Supabase Auth emails (password resets, email confirmations, magic links, invitations, and email change notifications).\n\n\nConnect Resend to your Supabase account to automatically configure custom SMTP for Supabase Auth emails. Installing this integration creates a Resend API key for your project and fills in Supabase's SMTP settings for you, so you don't have to copy credentials by hand.\n\n## What you get\n\n- **Guided setup:** guided connection to configure SMTP for your project\n- **Sending at scale:** production-ready send limits for Auth emails\n- **Observability:** Delivery, bounce, and complaint tracking in the Resend dashboard\n\nYou can also use the same Resend account to send transactional and marketing emails through the Resend API.\n\n## Documentation\n\nTo get the most out of the integration, view the following help guides for working with Resend and Supabase: \n\n- [Getting Started With Resend And Supabase](https://resend.com/docs/knowledge-base/getting-started-with-resend-and-supabase)\n- [Send With Supabase Edge Functions](https://resend.com/docs/send-with-supabase-edge-functions)\n- [How Do I Maximize Deliverability For Supabase Auth Emails](https://resend.com/docs/knowledge-base/how-do-i-maximize-deliverability-for-supabase-auth-emails)"])</script><script>self.__next_f.push([1,"33:T2153,"])</script><script>self.__next_f.push([1,"With the help of DhiWise, now you can easily integrate data from Supabase to DhiWise in 5 simple steps. Thereafter, you can create your application easily and effectively on DhiWise by mapping out all the essential data to their respective view components.\n\n## Documentation\n\nThis guide explains how to connect Supabase backend to DhiWise Flutter application quickly.\n\n[DhiWise](https://www.dhiwise.com/) is a Developer tool to convert Figma designs into React and Flutter applications. It lets you quickly integrate Databases and APIs into your React and Flutter Apps.\n\nIf you don't have a DhiWise account, create one [here](https://app.dhiwise.com).\n\nDhiWise supports easy Supabase Integration in just five steps.\n\nLet's get started!\n\n## Step 1: SignIn to Supabase\n\nGo to [Supabase](https://supabase.com/), Click `Sign In`, and create a new account by authenticating with **GitHub**. If you already have an account, you will be logged in.\n\n## Step 2: Create a new project in Supabase\n\nClick on `New project` from the Dashboard and select an organization. If you don't have an organization, create one using `+ New organization.`\n\n- Give your Supabase project a `name.`\n- Enter a secure `Database Password.`\n- Choose the `region` where your app's backend is hosted.\n- Click `Create new project.`\n\n![New Project](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/dhiwise/newProj.png)\n\n## Step 3: Find the API key and URL\n\nOnce your project is created, you can access the API Key and URL string, Or if you already have an account go to your `organization-\u003e app-\u003e settings-\u003e API`.\n\n![auth keys](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/dhiwise/authKeys.png)\n\n## Step 4: Integrations\n\nThere are two ways you can integrate Supabase into your DhiWise Flutter applications.\n\n### Authentication\n\nYou can integrate `Supabase Email/Password SignUp` or `Supabase Email/Password SignIn` on your components.\n\n- Open the screen of your flutter application\n- Go to the component on which you want to add authentication\n- on the `onClick` method - select `authentication`\n- From the list, If you want SignUp - select `SignUp with Email/Password`; otherwise, select `SignIn with Email/Password` from Supabase Auth section\n\n![Auth](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/dhiwise/auth.gif)\n\nAnd that's it. Supabase authentication will be added to the selected component.\n\nAfter downloading the application source code,\n\n1. Add Supabase URL and Supabase public key inside **_lib/core/utils/initial_bindings_** file.\n2. For additional details, refer ***https://supabase.com/docs/guides/with-flutter***\n\n### Working with Data\n\nWhen you first integrate Supabase in your DhiWise Flutter application, You will be asked to add [Supabase auth key and URL](##step-3-find-the-api-key-and-url). When you add them, all the tables available in your Supabase project will be synced in DhiWise. You can integrate Select and Create queries on your Flutter screen for a particular table in DhiWise.\n\n### Select records\n\n![Create](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/dhiwise/select.png)\n\n#### **Step 1:**\n\nSelect the screen from the screen list where you want to integrate Supabase.\n\n#### **Step 2:**\n\nNext, go to the view where you want to add Integration, and from the suggestion box for the `onClick` property, choose `Supabase integration,` which will take you to the Integration screen. Where you will be asked to `Enter function name.` Enter the name of your function and click `Submit.`\n\n#### **Step 3:**\n\nAfter submitting the function name, you will be asked to select a type of Supabase integration. To retrieve data from Supabase, choose `select.`\n\n#### **Step 4:**\n\nNext, select the table from which you want to fetch records from the listed Tables.\n\n#### **Step 5:**\n\nSelect the type of integration\n\n| Type         | Description                                       |\n| ------------ | ------------------------------------------------- |\n| **Single**   | Used to fetch a single record from the database.  |\n| **Multiple** | Used to fetch multiple records from the database. |\n\n\u003cAdmonition type=\"info\"\u003e\n\nFor Multiple types, you need to set `data limit,` `order by, and `order.`\n\n\u003c/Admonition\u003e\n\n#### **Step 6:**\n\nYou will be redirected to the API Integration screen, where you can set request and response.\n\nFor request binding, the below types are supported. Also, Select the operator for comparison before moving forward.\n\n| Type                    | Description                                                |\n| ----------------------- | ---------------------------------------------------------- |\n| **View**                | Select any component from your screen.                     |\n| **Constant**            | Select a constant you've created in your app.              |\n| **Get from preference** | Select the key you want to fetch from preference.          |\n| **Navigation argument** | Select data that's been passed from one screen to another. |\n\nFor response binding, the below types are supported.\n\n| Type                   | Description                           |\n| ---------------------- | ------------------------------------- |\n| **View**               | Select any component from the screen. |\n| **Save to preference** | Storing the data to preference.       |\n\n#### **Select 7:**\n\n`Handle action` - Select the action you wish to take once the Supabase call has either been accepted successfully or refused due to an error.\n\nAvailable action for On success and On error are,\n\n1. [Show Alert](https://docs.dhiwise.com/docs/flutter/show-alert)\n2. [Navigation](https://docs.dhiwise.com/docs/flutter/navigation)\n\n#### **Step 8:**\n\nFinally, you have added Supabase to your application to fetch records on your screen!\n\n\u003cAdmonition type=\"tip\" label=\"Example\"\u003e\n\nSuppose you want to fetch records from Supabase and populate the item list on your screen. You can integrate Supabase as discussed above and bind the response with your list view.\n\n\u003c/Admonition\u003e\n\n\u003ch3\u003e Create records \u003c/h3\u003e\n\n#### **Step 1:**\n\nChoose the screen you wish to integrate Supabase for from the list of screens.\n\n#### **Step 2:**\n\nNext, switch to the component you want to add Integration, and on the `onClick` property, choose `Supabase integration,` which will take you to its integration screen, where you will be asked to **Enter function name**, which will be used in generated code. Enter the name for it and click `Submit`\n\n#### **Step 3:**\n\nAfter submitting the function name, you will be asked to select a type of Supabase integration. For example, to create a record in Supabase, choose `Create.`\n\n#### **Step 4:**\n\nNext, select the table where you want to create a record from the listed Tables.\n\n#### **Step 5:**\n\nIf you want to create a Single record, Select **Select**. Otherwise, **Multiple**.\n\n#### **Step 6:**\n\nNow, you will be redirected to the API Integration screen, where you can set request and response.\n\nFor request binding, the below types are supported.\n\n| Type                    | Description                                                |\n| ----------------------- | ---------------------------------------------------------- |\n| **View**                | Select any component from the screen                       |\n| **Constant**            | Select a constant you've created in your app.              |\n| **Get from preference** | Select the key you want to fetch from preference.          |\n| **Navigation argument** | Select data that's been passed from one screen to another. |\n\nFor response binding, the below types are supported.\n\n| Type                   | Description                          |\n| ---------------------- | ------------------------------------ |\n| **View**               | Select any component from the screen |\n| **Save to preference** | Storing the data to preference.      |\n\n#### **Select 7:**\n\n`Handle action` - Select the action you wish to take once the Supabase call has either been accepted successfully or refused due to an error.\n\nAvailable action for On success and On error are,\n\n1. [Show Alert](https://docs.dhiwise.com/docs/flutter/show-alert)\n2. [Navigation](https://docs.dhiwise.com/docs/flutter/navigation)\n\n#### **Step 9:**\n\nFinally, you have added Supabase to your application to create records from your screen data!\n\n## Resources\n\n- [DhiWise Official Website](https://dhiwise.com)\n- [DhiWise Documentation](https://docs.dhiwise.com)\n"])</script><script>self.__next_f.push([1,"34:T410,"])</script><script>self.__next_f.push([1,"PowerSync is a Postgres-SQLite sync layer for local-first apps that are instantly reactive, stream data in real-time and work offline.\n\nPowerSync connects to Supabase in a non-invasive way (no schema changes or write permissions required) and streams data to local in-app SQLite database contained in the PowerSync SDK. PowerSync’s Sync Rules allow you to control which data is synced with which users. App reads and writes happen directly against the local database. When writes are made to the local database, the PowerSync SDK places those writes on an upload queue, from where they’re uploaded to the backend (as defined by the developer) as soon as connectivity is available. Custom conflict resolution logic can be applied in the backend API.\n\nPowerSync integrates natively with Supabase Auth, and can easily be added to (or removed from) existing projects.\n\nPowerSync can be self-hosted and is also available as a hosted service (PowerSync Cloud) with a Free plan.\n\nFollow the PowerSync Supabase Integration Guide to get started."])</script><script>self.__next_f.push([1,"35:T6f5,"])</script><script>self.__next_f.push([1,"n8n is a connector that helps [integrate Supabase with any other apps](https://n8n.io/integrations/supabase/?utm_source=partners\u0026utm_medium=marketplace-listing\u0026utm_campaign=supabase-may2023) via pre-built nodes or customizable HTTP requests. Supabase's users can build complex workflows with conditional logic and multiple steps. It's like Zapier on steroids but more flexible and versatile.\n\n### **How to integrate Supabase with any app?**\n\n#### **Step 1: Sign up for n8n**\n\nn8n is available as a [Cloud](https://n8n.io/pricing/) service, [npm](https://docs.n8n.io/hosting/installation/npm/) module, and [Docker](https://docs.n8n.io/hosting/installation/docker/) image. For this quickstart, n8n recommends using Cloud. A free trial is available for new users.\n\n#### **Step 2: Add the first step**\n\nAdd the starting point – a trigger on when your workflow should run: on an app event, on schedule, on a webhook call, when called by another workflow, or manually.\n\n#### **Step 3: Add nodes**\n\nAdd Supabase and other nodes to your workflow canvas. In some situations, Supabase node could already be your first step. Add your credentials for nodes if necessary. Configure them as appropriate. All you have to do is enter the API key. n8n handles the rest of the auth. No reading through docs required.\n\n#### **Step 4: Connect nodes**\n\nA connection establishes a link between Supabase and other nodes to route data through the workflow. A connection between two nodes passes data from one node's output to another node's input. Each node can have one or multiple connections. Use core nodes to manipulate data fields, run custom JavaScript code, transform files, or branch out your flow.\n\n#### **Step 5: Run workflow**\n\nHit the ***Execute Workflow*** button, and you are ready to go!"])</script><script>self.__next_f.push([1,"36:T5d3b,"])</script><script>self.__next_f.push([1,"Stytch provides an all-in-one platform for passwordless auth. Stytch makes it easy for you to embed passwordless solutions into your websites and apps for better security, better conversion rates, and a better end user experience. Their easy-to-use SDKs and direct API access allows for maximum control and customization. In this example we will use Email magic links to create and log in our users, and Session management. There is an additional, optional step to enable Google One Tap which is an especially high-converting Google OAuth sign-up and login flow.\n\n## Documentation\n\nIn this guide we will build a simple expense tracker web application using Stytch, Supabase, and Next.js.\n\n[Stytch](https://stytch.com?utm_source=supabase\u0026utm_medium=guide) provides an all-in-one platform for passwordless auth. Stytch makes it easy for you to embed passwordless solutions into your websites and apps for better security, better conversion rates, and a better end user experience. Their easy-to-use SDKs and direct API access allows for maximum control and customization. In this example we will use [Email magic links](https://stytch.com/products/email-magic-links?utm_source=supabase\u0026utm_medium=guide) to create and log in our users, and Session management. There is an additional, optional step to enable [Google One Tap](https://stytch.com/blog/improving-conversion-with-google-one-tap?utm_source=supabase\u0026utm_medium=guide) which is an especially high-converting Google OAuth sign-up and login flow.\n\nWe will leverage Supabase to store and authorize access to user data. Supabase makes it simple to set up Row Level Security (RLS) policies which ensure users can only read and write data that they are authorized to do so. If you do not already have a Supabase account, you will need to create one.\n\nThis guide will use [Next.js](https://nextjs.org/) which is a web application framework built on top of React. Stytch provides a [Node.js library](https://github.com/stytchauth/stytch-node) and a [React library](https://stytch.com/docs/sdks/javascript-sdk) which makes building Next.js apps super easy.\n\n\u003e Note: You can find a completed version of this project on [Github](https://github.com/stytchauth/stytch-nextjs-supabase).\n\n## Step 0: Create a Stytch Account\n\nIf you already have a Stytch account you may skip this step.\n\nGo to [Stytch](https://stytch.com?utm_source=supabase\u0026utm_medium=guide), and create an account. Note that Stytch provides two ways to create an account, either via Google OAuth, or through Email magic links.  This is the same user experience we will be building in this guide!\n\n![Stytch redirect URL settings](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/stytch/01.png)\n\n## Step 1: Set up Stytch redirect URLs\n\nFirst we need to add the redirect URLs that will be used during the Email magic link flow. This step helps ensure bad actors cannot spoof your magic links and hijack redirects.\n\nNavigate to your [redirect URL settings](https://stytch.com/dashboard/redirect-urls?utm_source=supabase\u0026utm_medium=guide) in the Stytch dashboard, and under **Test environment** create an entry where the **URL** is `http://localhost:3000/api/authenticate` and the **Type** is `All`.\n\n![Edit Stytch redirect URL settings](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/stytch/02.png)\n\nAfter pressing **Confirm**, the redirect URLs dashboard will update to show your new entry. We will use this URL later on.\n\n![Stytch redirect URL settings](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/stytch/03.png)\n\n## Step 2: Create a Supabase project\n\nFrom your [Supabase dashboard](https://supabase.com/dashboard/), click **New project**.\n\nEnter a `Name` for your Supabase project.\n\nEnter a secure `Database Password`.\n\nClick **Create new project**. It may take a couple minutes for your project to be provisioned.\n\n![New Supabase project settings](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/stytch/04.png)\n\n## Step 3: Creating data in Supabase\n\nOnce your Supabase project is provisioned, click Table editor, then New table. This tool is available from the sidebar menu in the [Supabase dashboard](https://supabase.com/dashboard/).\n\nEnter `expenses` as the **Name** field.\n\nSelect `Enable Row Level Security (RLS)`.\n\nAdd three new columns:\n\n- `user_id` as `text`\n\n- `title` as `text`\n\n- `value` as `float8`\n\nClick **Save** to create the new table.\n\n![Creating a new table](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/stytch/05.png)\n\nFrom the Table editor view, select the expenses table and click **Insert row**.\n\nFill out the title and value fields (leave user_id blank for now) and click **Save**.\n\n![Creating a new row](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/stytch/06.png)\n\nUse **Insert Row** to further populate the table with expenses.\n\n![Multiple rows](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/stytch/07.png)\n\n## Step 4: Building a Next.js app\n\nUsing a terminal, create a new Next.js project:\n\n```bash\nnpx create-next-app stytch-supabase-example\n```\n\nNext, within `stytch-supabase-example` create a `.env.local` file and enter the following values:\n\n```\nSTYTCH_PROJECT_ENV=test\nSTYTCH_PROJECT_ID=GET_FROM_STYTCH_DASHBOARD\nSTYTCH_PUBLIC_TOKEN=GET_FROM_STYTCH_DASHBOARD\nSTYTCH_SECRET=GET_FROM_STYTCH_DASHBOARD\nNEXT_PUBLIC_SUPABASE_URL=GET_FROM_SUPABASE_DASHBOARD\nNEXT_PUBLIC_SUPABASE_KEY=GET_FROM_SUPABASE_DASHBOARD\nSUPABASE_SIGNING_SECRET=GET_FROM_SUPABASE_DASHBOARD\n```\n\n\u003e Note: Stytch values can be found in the project [dashboard](https://stytch.com/dashboard/api-keys?utm_source=supabase\u0026utm_medium=guide) under **API Keys**.\n\n![Stytch API keys](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/stytch/08.png)\n\n\u003e Note: Supabase values can be found under **Settings** \u003e **API** for your project.\n\n![Supabase API keys](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/stytch/09.png)\n\nStart your Next.js development server to read in the new values from `.env.local`.\n\n```bash\nnpm run dev\n```\n\nYou should have a running Next.js application on `localhost:3000`.\n\n## Step 5: Build the Login Form\n\nNow we will replace the default Next.js home page with a login UI. We will use the Stytch React library.\n\n\u003e Note: Stytch provides direct API access for those that want to build login UI themselves\n\nInstall the `@stytch/stytch-react` library.\n\n```bash\nnpm install @stytch/stytch-react\n```\n\nIn the root directory, create a new folder named `components` and file in that folder named `/StytchLogin.js`. Within this file, paste the snippet below. This will configure, and style the Stytch React component to use Email magic links.\n\n```jsx\n// components/StytchLogin.js\nimport React from 'react'\nimport { Stytch } from '@stytch/stytch-react'\n\nconst stytchConfig = {\n  loginOrSignupView: {\n    products: ['emailMagicLinks'],\n    emailMagicLinksOptions: {\n      loginRedirectURL: 'http://localhost:3000/api/authenticate',\n      loginExpirationMinutes: 30,\n      signupRedirectURL: 'http://localhost:3000/api/authenticate',\n      signupExpirationMinutes: 30,\n      createUserAsPending: true,\n    },\n  },\n  style: {\n    fontFamily: '\"Helvetica New\", Helvetica, sans-serif',\n    width: '321px',\n    primaryColor: '#0577CA',\n  },\n}\n\nconst StytchLogin = ({ publicToken }) =\u003e {\n  return (\n    \u003cStytch\n      publicToken={publicToken}\n      loginOrSignupView={stytchConfig.loginOrSignupView}\n      style={stytchConfig.style}\n    /\u003e\n  )\n}\n\nexport default StytchLogin\n```\n\nAdditionally, create a profile component by creating a file called `Profile.js` in `/components`. We will use this component to render our expenses stored in Supabase later on.\n\n```jsx\n// components/Profile.js\nimport React from 'react'\nimport Link from 'next/link'\n\nexport default function Profile({ user }) {\n  return (\n    \u003cdiv\u003e\n      \u003ch1\u003eWelcome {user.userId}\u003c/h1\u003e\n      \u003ch2\u003eYour expenses\u003c/h2\u003e\n      {user.expenses?.length \u003e 0 ? (\n        user.expenses.map((expense) =\u003e (\n          \u003cp key={expense.id}\u003e\n            {expense.title}: ${expense.value}\n          \u003c/p\u003e\n        ))\n      ) : (\n        \u003cp\u003eYou have no expenses!\u003c/p\u003e\n      )}\n\n      \u003cLink href=\"/api/logout\" passHref\u003e\n        \u003cbutton\u003e\n          \u003ca\u003eLogout\u003c/a\u003e\n        \u003c/button\u003e\n      \u003c/Link\u003e\n    \u003c/div\u003e\n  )\n}\n```\n\nFinally, replace the contents of the file `/pages/index.js` to render our new `StytchLogin` and `Profile` components.\n\n```jsx\n// pages/index.js\nimport styles from '../styles/Home.module.css'\nimport Profile from '../components/Profile'\nimport StytchLogin from '../components/StytchLogin'\n\nconst Index = ({ user, publicToken }) =\u003e {\n  let content\n  if (user) {\n    content = \u003cProfile user={user} /\u003e\n  } else {\n    content = \u003cStytchLogin publicToken={publicToken} /\u003e\n  }\n\n  return \u003cdiv className={styles.main}\u003e{content}\u003c/div\u003e\n}\n\nexport async function getServerSideProps({ req, res }) {\n  const user = null // Will update later\n  return {\n    props: { user, publicToken: process.env.STYTCH_PUBLIC_TOKEN },\n  }\n}\n\nexport default Index\n```\n\nOn `localhost:3000` there is now a login form prompting for your email address.\n\n![Email login step one](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/stytch/10.png)\n\nEnter your email address and press **Continue with email**.\n\n![Email login step two](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/stytch/11.png)\n\nIn your inbox you will find a login request from your app.\n\n![Email login step three](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/stytch/12.png)\n\nHowever, if you click the link in the email you will get a 404. We need to build an API route to handle the email magic link authentication.\n\n## Step 6: Authenticate and start a session\n\nTo make authentication easier we will use the Stytch Node.js library. Run\n\n```bash\nnpm install stytch\n```\n\nAdditionally, we will need to store the authenticated session in a cookie. Run\n\n```bash\nnpm install cookies-next\n```\n\nCreate a new folder named `utils` and inside a file named`stytchLogic.js` with the following contents\n\n```jsx\n// utils/stytchLogic.js\nimport * as stytch from 'stytch'\nimport { getCookie, setCookies, removeCookies } from 'cookies-next'\n\nexport const SESSION_COOKIE = 'stytch_cookie'\n\nlet client\nconst loadStytch = () =\u003e {\n  if (!client) {\n    client = new stytch.Client({\n      project_id: process.env.STYTCH_PROJECT_ID,\n      secret: process.env.STYTCH_SECRET,\n      env: process.env.STYTCH_PROJECT_ENV === 'live' ? stytch.envs.live : stytch.envs.test,\n    })\n  }\n\n  return client\n}\n\nexport const getAuthenticatedUserFromSession = async (req, res) =\u003e {\n  const sessionToken = getCookie(SESSION_COOKIE, { req, res })\n  if (!sessionToken) {\n    return null\n  }\n\n  try {\n    const stytchClient = loadStytch()\n    const resp = await stytchClient.sessions.authenticate({\n      session_token: sessionToken,\n    })\n    return resp.session.user_id\n  } catch (error) {\n    console.log(error)\n    return null\n  }\n}\n\nexport const revokeAndClearSession = async (req, res) =\u003e {\n  const sessionToken = getCookie(SESSION_COOKIE, { req, res })\n\n  if (sessionToken) {\n    try {\n      const stytchClient = loadStytch()\n      await stytchClient.sessions.revoke({\n        session_token: sessionToken,\n      })\n    } catch (error) {\n      console.log(error)\n    }\n    removeCookies(SESSION_COOKIE, { req, res })\n  }\n\n  return res.redirect('/')\n}\n\nexport const authenticateTokenStartSession = async (req, res) =\u003e {\n  const { token, type } = req.query\n  let sessionToken\n  try {\n    const stytchClient = loadStytch()\n    const resp = await stytchClient.magicLinks.authenticate(token, {\n      session_duration_minutes: 30,\n    })\n    sessionToken = resp.session_token\n  } catch (error) {\n    console.log(error)\n    const errorString = JSON.stringify(error)\n    return res.status(400).json({ errorString })\n  }\n\n  setCookies(SESSION_COOKIE, sessionToken, {\n    req,\n    res,\n    maxAge: 60 * 60 * 24,\n    secure: true,\n  })\n\n  return res.redirect('/')\n}\n```\n\nThis logic is responsible for setting up the Stytch client we will use to call the API. It provides functions we will use to login, logout, and validate user sessions.\n\nIn order to complete the email login flow, create a new file `pages/api/authenticate.js` with the contents:\n\n```jsx\n// pages/api/authenticate.js\nimport { authenticateTokenStartSession } from '../../utils/stytchLogic'\n\nexport default async function handler(req, res) {\n  return authenticateTokenStartSession(req, res)\n}\n```\n\nWe will also create a logout API endpoint with similar contents. In `pages/api/logout.js` include the following:\n\n```jsx\n// pages/api/logout.js\nimport { revokeAndClearSession } from '../../utils/stytchLogic'\n\nexport default async function handler(req, res) {\n  return revokeAndClearSession(req, res)\n}\n```\n\nFinally, update `pages/index.js` by importing `getAuthenticatedUserFromSession`, and calling it to set the user variable in `getServerSideProps`.\n\n```jsx\n// pages/index.js\nimport styles from '../styles/Home.module.css'\n\nimport StytchLogin from '../components/StytchLogin'\nimport Profile from '../components/Profile'\nimport { getAuthenticatedUserFromSession } from '../utils/stytchLogic'\n\nconst Index = ({ user, publicToken }) =\u003e {\n  let content\n  if (user) {\n    content = \u003cProfile user={user} /\u003e\n  } else {\n    content = \u003cStytchLogin publicToken={publicToken} /\u003e\n  }\n\n  return \u003cdiv className={styles.main}\u003e{content}\u003c/div\u003e\n}\n\nexport async function getServerSideProps({ req, res }) {\n  const userId = await getAuthenticatedUserFromSession(req, res)\n  if (userId) {\n    return {\n      props: { user: { userId }, publicToken: process.env.STYTCH_PUBLIC_TOKEN },\n    }\n  }\n  return {\n    props: { publicToken: process.env.STYTCH_PUBLIC_TOKEN },\n  }\n}\n\nexport default Index\n```\n\nReturn to `localhost:3000`, and login again by sending yourself a new email. Upon clicking through in the email you should be presented with “Welcome $USER_ID”. If you refresh the page, you should remain in an authenticated state. If you press **Logout** then you should return to the login screen.\n\n![Profile page](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/stytch/13.png)\n\nNow that we have a working login flow with persistent authentication it is time to pull in our expense data from Supabase.\n\n## Step 7: Requesting user data from Supabase\n\nFirst, install the Supabase client:\n\n```bash\nnpm install @supabase/supabase-js\n```\n\nIn order to pass an authenticated `user_id` to Supabase we will package it within a JWT. Install jsonwebtoken:\n\n```bash\nnpm install jsonwebtoken\n```\n\nCreate a new file `utils/supabase.js` and add the following:\n\n```jsx\n// utils/supabase.js\nimport { createClient } from '@supabase/supabase-js'\nimport jwt from 'jsonwebtoken'\n\nconst getSupabase = (userId) =\u003e {\n  const supabase = createClient(\n    process.env.NEXT_PUBLIC_SUPABASE_URL,\n    process.env.NEXT_PUBLIC_SUPABASE_KEY\n  )\n\n  if (userId) {\n    const payload = {\n      userId,\n      exp: Math.floor(Date.now() / 1000) + 60 * 60,\n    }\n\n    supabase.auth.session = () =\u003e ({\n      access_token: jwt.sign(payload, process.env.SUPABASE_SIGNING_SECRET),\n    })\n  }\n\n  return supabase\n}\n\nexport { getSupabase }\n```\n\nOur payload for the JWT will contain our user's unique identifier from Stytch, their `user_id`. We are signing this JWT using Supabase's signing secret, so Supabase will be able to validate it is authentic and hasn't been tampered with in transit.\n\nLet's load our expenses from Supabase on the home page! Update `pages/index.js` a final time to make a request for expense data from Supabase.\n\n```jsx\nimport styles from '../styles/Home.module.css'\n\nimport StytchLogin from '../components/StytchLogin'\nimport Profile from '../components/Profile'\nimport { getAuthenticatedUserFromSession } from '../utils/stytchLogic'\nimport { getSupabase } from '../utils/supabase'\n\nconst Index = ({ user, publicToken }) =\u003e {\n  let content\n  if (user) {\n    content = \u003cProfile user={user} /\u003e\n  } else {\n    content = \u003cStytchLogin publicToken={publicToken} /\u003e\n  }\n\n  return \u003cdiv className={styles.main}\u003e{content}\u003c/div\u003e\n}\n\nexport async function getServerSideProps({ req, res }) {\n  const userId = await getAuthenticatedUserFromSession(req, res)\n\n  if (userId) {\n    const supabase = getSupabase(userId)\n    const { data: expenses } = await supabase.from('expenses').select('*')\n\n    return {\n      props: {\n        user: { userId, expenses },\n        publicToken: process.env.STYTCH_PUBLIC_TOKEN,\n      },\n    }\n  } else {\n    return {\n      props: { publicToken: process.env.STYTCH_PUBLIC_TOKEN },\n    }\n  }\n}\n\nexport default Index\n```\n\nWhen we reload our application, we are still getting the empty state for expenses.\n\nThis is because we enabled Row Level Security, which blocks all requests by default and lets you granularly control access to the data in your database. To enable our user to select their expenses we need to write a RLS policy.\n\n## Step 8: Write a policy to allow select\n\nOur policy will need to know who our currently logged in user is to determine whether or not they should have access. Let's create a PostgreSQL function to extract the current user from our new JWT.\n\nNavigate back to the Supabase dashboard, select SQL from the sidebar menu, and click **New query**. This will create a new query,, which will allow us to run any SQL against our Postgres database.\n\nWrite the following and click **Run**.\n\n```sql\ncreate or replace function auth.user_id() returns text as $$\n select nullif(current_setting('request.jwt.claims', true)::json-\u003e\u003e'userId', '')::text;\n$$ language sql stable;\n```\n\nYou should see the output `Success, no rows returned`. This created a function called `auth.user_id()`, which will inspect the `userId` field of our JWT payload.\n\n\u003e Note: To learn more about PostgreSQL functions, check out this [deep dive video](https://www.youtube.com/watch?v=MJZCCpCYEqk).\n\nLet's create a policy that checks whether this user is the owner of an expense.\n\nSelect **Authentication** from the Supabase sidebar menu, click **Policies**, then **New Policy**.\n\n![Supabase authentication page](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/stytch/14.png)\n\nFrom the modal, select **For full customization create a policy from scratch** and add the following.\n\n![Supabase create policy page](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/stytch/15.png)\n\nThis policy is calling the function we just created to get the currently logged in user's `user_id` `auth.user_id()` and checking whether this matches the `user_id` column for the current expense. If it does, then it will allow the user to select it, otherwise it will continue to deny.\n\nClick Review and then Save policy. After you've saved, click Enable RLS on the table to enable the policy we just created.\n\n\u003e Note: To learn more about RLS and policies, check out this [video](https://www.youtube.com/watch?v=Ow_Uzedfohk).\n\nThe last thing we need to do is update the `user_id` columns for our existing expenses.\n\nHead back to the Supabase dashboard, and select Table editor from the sidebar. You will notice each entry has `user_id` set to `NULL`. We need to update this value to the proper `user_id`.\n\n![Supabase null users in table](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/stytch/16.png)\n\nTo get the `user_id` for our Stytch user, you can pull it from the welcome page in our example app (eg `user-test-61497d40-f957-45cd-a6c8-5408d22e93bc`).\n\n![Get user_id](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/stytch/17.png)\n\nUpdate each row in Supabase to this `user_id`.\n\n![Populate user_id](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/stytch/18.png)\n\nReturn to `localhost:3000`, and you will see your expenses listed.\n\n![Listed expenses](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/stytch/19.png)\n\nWe now have a basic expense tracker application powered by Stytch, Supabase, and Next.js. From here you could add additional features like adding, editing, and organizing your expenses further.\n\n\u003e Note: You can find a completed version of this project on [Github](https://github.com/stytchauth/stytch-nextjs-supabase).\n\n## Optional: Add Google One Tap\n\nIn this optional step, we will extend our application to allow users to login with Google One Tap in addition to Email magic links.\n\nYou will need to follow the first four steps of [this guide](https://stytch.com/docs/oauth?utm_source=supabase\u0026utm_medium=guide#guides_google-sdk) to create a Google project, set up Google OAuth consent, and configure credentials and redirect URLs.\n\nFirst, we will make some adjustments to the `StytchLogin` component. We will update the configuration, so that it uses both Google OAuth, and Email magic links.\n\n```jsx\n// components/StytchLogin.js\nimport React from 'react'\nimport { Stytch } from '@stytch/stytch-react'\n\nconst stytchConfig = {\n  loginOrSignupView: {\n    products: ['oauth', 'emailMagicLinks'],\n    oauthOptions: {\n      providers: [\n        {\n          type: 'google',\n          one_tap: true,\n          position: 'embedded',\n        },\n      ],\n      loginRedirectURL: 'http://localhost:3000/api/authenticate?type=oauth',\n      signupRedirectURL: 'http://localhost:3000/api/authenticate?type=oauth',\n    },\n    emailMagicLinksOptions: {\n      loginRedirectURL: 'http://localhost:3000/api/authenticate',\n      loginExpirationMinutes: 30,\n      signupRedirectURL: 'http://localhost:3000/api/authenticate',\n      signupExpirationMinutes: 30,\n      createUserAsPending: true,\n    },\n  },\n  style: {\n    fontFamily: '\"Helvetica New\", Helvetica, sans-serif',\n    width: '321px',\n    primaryColor: '#0577CA',\n  },\n}\n\nconst StytchLogin = ({ publicToken }) =\u003e {\n  return (\n    \u003cStytch\n      publicToken={publicToken}\n      loginOrSignupView={stytchConfig.loginOrSignupView}\n      style={stytchConfig.style}\n    /\u003e\n  )\n}\n\nexport default StytchLogin\n```\n\nWe also need to make an adjustment to the function `authenticateTokenStartSession` in `stytchLogic.js`. Stytch has separate authentication endpoints for Email magic links and OAuth, so we need to route our token correctly.\n\n```jsx\n// utils/stytchLogic.js\n\n// leave the rest of the file contents as is\nexport const authenticateTokenStartSession = async (req, res) =\u003e {\n  const { token, type } = req.query\n  let sessionToken\n  try {\n    const stytchClient = loadStytch()\n    if (type == 'oauth') {\n      const resp = await stytchClient.oauth.authenticate(token, {\n        session_duration_minutes: 30,\n        session_management_type: 'stytch',\n      })\n      sessionToken = resp.session.stytch_session.session_token\n    } else {\n      const resp = await stytchClient.magicLinks.authenticate(token, {\n        session_duration_minutes: 30,\n      })\n      sessionToken = resp.session_token\n    }\n  } catch (error) {\n    console.log(error)\n    const errorString = JSON.stringify(error)\n    return res.status(400).json({ errorString })\n  }\n\n  setCookies(SESSION_COOKIE, sessionToken, {\n    req,\n    res,\n    maxAge: 60 * 60 * 24,\n    secure: true,\n  })\n\n  return res.redirect('/')\n}\n```\n\nWith these two changes you will now have a working Google One Tap authentication method along with email magic links.\n\n![Google One Tap](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/stytch/20.png)\n\n## Resources\n\n- [Stytch blog](https://stytch.com/blog?utm_source=supabase\u0026utm_medium=guide)\n- [Stytch documentation](https://stytch.com/docs?utm_source=supabase\u0026utm_medium=guide)\n"])</script><script>self.__next_f.push([1,"37:T14cd,"])</script><script>self.__next_f.push([1,"Sequin sends your Supabase rows and changes anywhere you want. It’s designed to never miss an `insert`, `update`, or `delete` and provide exactly-once process for all changes.\n\nYou can receive changes via HTTP push (webhooks) or pull (think SQS). You can easily send changes to your application, another service (i.e. trigger.dev, resend, ingest), or trigger a Supabase edge function.\n\nAt some point, almost every Supabase app needs to trigger side effects. Think of sending a new user a welcome email or fanning out Jobs when an order arrives. Sequin aims to give you the tools to make that happen.\n\n## Killer features\n\n* **Never miss a message:** Sequin persists messages until they are acknowledged (i.e. exactly once processing guarantees).\n* **SQL-based routing:** Filter and route messages using SQL `where` conditions\n* **Replays:** Rewind to any row on your table. Republish messages that match a SQL query.\n* **Backfills:** Queue up records from this moment forward or the entire table.\n* **Observability and debugging:** Sequin has a web console that adds the Supabase queue tooling you’ve been looking for.\n* **Skip the PL/pgsql:** Define business logic in the language of your choice and in your application.\n* **Transforms:** Transform message payloads with Lua functions.\n\n## Documentation\n\nThis guide steps you through connecting Sequin to your Supabase database to send database changes anywhere.\n\n### 1. Connect to Sequin with a direct connection\n\nSequin uses the Write Ahead Log (WAL) to capture changes from your Supabase database. Supabase's connection pooling does not support the WAL, so you need to connect to your Supabase database using a direct connection.\n\nHere is how to set up a direct connection in Supabase:\n\n1. Login to Supabase and navigate to the database settings page (**Settings \u003e Configurations \u003e Database**).\n2. Disable the **Use connection pooling** option to show your direct connection credentials:\n3. In Sequin, enter the direct connection details in the **Database connection** page, including the **Host**, **Port**, **Database**, **User**, and **Password** for your Supabase database. Turn **SSL** on.\n\n✓ Sequin will automatically detect that you're using a Supabase database and check that your connection is configured correctly.\n\n### 2. Create a replication slot in Supabase\n\nWith your Supabase database connected to Sequin, you'll now create the replication slot that Sequin will use to detect changes in your database.\n\n1. In the Supabase SQL editor, run the following SQL command to create a replication slot:\n\n   ```sql\n   select pg_create_logical_replication_slot('sequin_slot', 'pgoutput');\n   ```\n\nThis creates a replication slot named `sequin_slot`.\n\n2. Next, you'll create a publication to indicate which tables will publish changes to the replication slot.\n\n   In the SQL editor, run the following SQL command to create a publication:\n\n   ```sql\n   create publication sequin_pub for table table1, table2, table3;\n   ```\n\n   If you want to publish changes from all the tables in your database, you can also use the `for all tables` option:\n\n   ```sql\n   create publication sequin_pub for all tables;\n   ```\n\n3. Back in the Sequin Console, enter the name of the replication slot (e.g. `sequin_slot`) and publication (e.g. `sequin_pub`) you just created. Then, name your database and click **Create Database**.\n\n   ![Supabase connected to Sequin](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/sequin/sequin-stream-successful-database-connection.png)\n\n✓ Sequin will now capture rows and changes from your Supabase database.\n\n### 3. Add a consumer in Sequin\n\nSequin and Supabase are now working together. Every change in your database will be captured and can be sent to your application, another service, or trigger a Supabase edge function.\n\nYou’ll add a consumer in Sequin to define what changes you want to process and where you want to send them.\n\n1. In the Sequin Console, navigate to the Consumers page and click Create Consumer.\n2. Select your Supabase database and the table that contains the data you want to process in the consumer. Then, add filters to process just the rows and changes you need.\n3. Set your consumer as an HTTP push consumer or HTTP pull consumer, and then configure the endpoints and headers as needed. Then save your consumer.\n\n\n✓ Make a change in your database, and see it appear in your consumer:\n\n![Supabase change to Sequin consumer](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/sequin/sequin-stream-imgur.gif)\n\n## Next steps\n\nYou’ve now walked through the basics of connecting to Sequin, creating a consumer, and capturing changes. Now, you can write the business logic for your application to react to the changes.\n\nFrom here, you might want to:\n\n- [Move some Supabase webhooks](https://sequinstream.com/docs/guides/supabase#moving-supabase-webhooks-to-sequin) to Sequin.\n- Set up a Sequin consumer to [trigger a Supabase edge function](https://sequinstream.com/docs/guides/supabase#triggering-a-supabase-edge-function-with-sequin).\n- Use the [Sequin javascript SDK](https://github.com/sequinstream/sequin-js) to pull messages from a consumer.\n- Dig into Sequin’s [core concepts](https://sequinstream.com/docs/core-concepts) to tune your setup."])</script><script>self.__next_f.push([1,"38:T507,"])</script><script>self.__next_f.push([1,"## Overview\nFigma Make is Figma's prompt-to-app tool, turning ideas and existing Figma designs into functional, interactive web apps with nothing but natural-language instructions. It's built for designers and product teams who want to go from concept to working prototype without writing code.\n\nPrototypes are only as convincing as the data behind them. The Figma Make integration gives your prototypes a real Supabase backend, so instead of stopping at static screens, you can ship apps with authentication, persistent storage, and secure connections to external APIs. Just describe what you need in plain language, and Supabase handles the setup behind the scenes.\n\nOnce connected, the integration lets you add user sign-in with email/password, magic links, or social logins like Google and GitHub, with Supabase ensuring people only ever see their own data. You can store and retrieve app data through built-in key-value storage, add file uploads for
