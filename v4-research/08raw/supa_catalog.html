 images, PDFs, and other assets with access control built in, and securely connect to external services like OpenAI, Spotify, or LinkedIn with key management handled for you. Supabase projects can be reused across multiple Figma Make files, and everything stays manageable from your Supabase dashboard whenever you want more control."])</script><script>self.__next_f.push([1,"39:T523,"])</script><script>self.__next_f.push([1,"ZapDigits connects to your Supabase project via OAuth — no API keys or manual configuration needed. Once connected, you get instant access to your Supabase user data directly inside your ZapDigits dashboards.\n\n## Why Connect Supabase to ZapDigits?\n\nTrack the metrics that matter most for your product:\n\n- **User Data Overview** — a full table view of your Supabase users\n- **Signups Trend** — visualise new user growth over time\n- **User Churn** — identify users who have stopped being active\n- **Inactive Users** — see how many users haven't engaged recently\n- **Users in Last 7 Days** — monitor recent signups and activity at a glance\n\n## How to Connect\n\n1. Go to the Integrations page in ZapDigits and search for Supabase\n2. Click **Connect** — you will be redirected to Supabase to authorise via OAuth\n3. Select the Supabase project you want to connect\n4. Return to ZapDigits and start adding Supabase metrics to your dashboards\n\n## Multi-Source Dashboards\n\nZapDigits supports multiple data sources in a single dashboard. Combine your Supabase user data with traffic data from Google Search Console, marketing metrics, and more — all in one place.\n\n## Troubleshooting\n\nIf you experience any issues connecting your Supabase account, reach out to the ZapDigits support team at hello@zapdigits.com."])</script><script>self.__next_f.push([1,"3a:T2033,"])</script><script>self.__next_f.push([1,"Directus is an open-source data platform that layers on top of any SQL database, providing a powerful suite of tools. The Directus Engine provides dynamic REST and GraphQL APIs based on your schema, hooks and automation, authentication and access control, and file transformations. Directus Studio enables engineers and non-technical users alike to browse, manage, and visualize database content through a no-code app.\n\n## Documentation\n\nIn this guide, we will demonstrate how to create a new Supabase project, install a fresh instance of the Directus platform, then configure the two to work together seamlessly. If you're unfamiliar with either of these systems, don't worry! We'll start off with an overview of each platform and explain how they complement each other, noting any overlap in capabilities.\n\n## Introduction\n\n![Supabase App](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/directus/supabase-20220608A.webp)\n\n[Supabase](https://supabase.com/) is an open-source Firebase alternative that provides a PostgreSQL database, storage, authentication, and a dynamic REST API based on your schema. While it is possible to self-host Supabase on your own infrastructure, this article will focus on Supabase Cloud's Free plan, which is the fastest and easiest way to get started.\n\n![Directus App](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/directus/directus-20220608A.webp)\n\n[Directus](https://directus.io/) is an open-source data platform that layers on top of any SQL database, providing a powerful suite of tools. The Directus Engine provides dynamic REST and GraphQL APIs based on your schema, hooks and automation, authentication and access control, and file transformations. Directus Studio enables engineers and non-technical users alike to browse, manage, and visualize database content through a no-code app.\n\nSupabase is a suite of open-source tools making Postgres databases, file storage, authentication, and edge functions more accessible to developers of all skill levels. Directus is also developer tooling and additionally provides a Data Studio that is safe and intuitive enough for anyone, including non-technical users, to use. This is the crucial bit that gives the two platforms such a strong “network effect.”\n\nWhen these two systems are brought together, you get a scalable datastore, limitless connectivity options, and a no-code app that allows your technical and business teams to collaborate together efficiently.\n\nThe two platforms share an overlap of capabilities that deepens their integration and offers developers the freedom of choice across a broader spectrum of connectivity. Key areas of intersection include:\n\nThe ability to generate _powerful_ APIs dynamically to connect data\nUser management and fine-grained access control\nDigital asset storage and management.\n\nMore importantly, Directus and Supabase share a common vision for your data, making them quite symbiotic. Both solutions are completely open-source, with self-hosted and cloud deployment options available. They are unopinionated in their approach, with vendor-agnostic data storage, and they both focus on providing a polished developer experience along with comprehensive documentation.\n\nBy linking the Supabase database with your Directus Project, _you get a superset of data tools._ You'll benefit from Supabase's Postgres database and its _dev-centric_ admin app with the raw power to run SQL queries, **_as well as_** the Directus no-code app, which enables intuitive permissions-based data access for the whole team.\n\nLet's dive into how we actually set up and link these two platforms to create a modern data stack powerhouse.\n\n## Create a Supabase Project\n\nAs mentioned, while you can [deploy Supabase locally](/docs/guides/getting-started/local-development). For the purpose of this guide, we'll use Supabase Cloud:\n\n1. Create a **Supabase** account by signing in with GitHub.\n2. Give your organization a name (this can be changed later).\n3. Click **New Project** and select your organization.\n4. Follow the prompts, setting a project Name, Database Password, Region, and Pricing Plan, then click **Create New Project**.\n5. After your project has been provisioned, navigate to **Settings \u003e Database** in the sidebar.\n6. Scroll down to **Connection Info** and take note of your database's **Host**, **Database Name**, **Port**, **User**, and **Password**. You will need to enter this during your Directus project setup.\n\n## Optional: Add PostGIS to Support Geometry and Mapping\n\nTo take full advantage of the built-in geometry and mapping features Directus offers, we recommend enabling Geometric Data Support. To add PostGIS, follow these steps:\n\n![Enable PostGis](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/directus/enable-PostGIS-20220608A.webp)\n\n1. From the sidebar, navigate to **Database \u003e Extensions**.\n2. Use the search bar to look up `PostGIS`.\n3. Toggle the PostGIS option to enable it.\n\n## Set up Directus\n\nAt the time of writing this article, [Directus Cloud](https://directus.cloud/) does not yet support hybrid deployments for connecting an external database. So, we'll be deploying a self-hosted instance to connect with Supabase. To install a self-hosted instance of Directus that's connected to our Supabase project, follow these steps:\n\n1. Run the following command in your terminal:\n\n```bash\nnpm init directus-project example-project\n```\n\n2. Using the up/down arrow keys, select `Postgres` from the list:\n\n```bash\n? Choose your database client Postgres\n```\n\n3. Next, you will be prompted to input database credentials. Add in the Supabase Database Connection Info noted above as follows:\n\n- **Database Host** – The IP address for your database.\n- **Port** – Port number your database is running on.\n- **Database Name** – Name of your existing database.\n- **Database User** – Name of existing user in database.\n- **Database Password** – Password to enter database.\n- **Enable SSL** – Select Y for yes or N for no.\n- **Root** – The root name.\n\n4. Now, simply set an email and password for your first Directus admin account. To be clear, this is Directus-specific, and is unrelated to your database user:\n\n```bash\nCreate your first admin user:\n? Email: admin@example.com\n? Password: ********\n```\n\nOnce this is complete, you should see details about your new project:\n\n```bash\nYour project has been created at \u003cfile-path\u003e/example-project.\nThe configuration can be found in \u003cfile-path\u003e/example-project/.env\n```\n\n5. Lastly, navigate to your new project folder (in this case `example-project`) and start the platform:\n\n```bash\ncd example-project\nnpx directus start\n```\n\n**Please note:** To prevent public accessibility when using the supabase-js library,turn on row level security (RLS) on all these tables inside of the Supabase Dashboard. By default when RLS is turned on these tables cannot be read from or written to with the supabase-js library.\n\nThat's it! Your project is now up and running locally. You can access the Directus Studio in the browser via the URL displayed, and log in with the Directus admin credentials you entered above:\n\n```bash\n✨ Server started at http://localhost:8055\n```\n\nIn a matter of minutes, we've created a flexible data backend, with access to an intuitive no-code app for managing and visualizing data along with a robust connectivity toolkit. This modern data stack is flexible and scalable enough to power any data-driven project… all you need to do is build the frontend!\n\n## Next Steps\n\nFrom here, the sky's the limit on what you can build. You'll probably want to invite some new collaborators to your project and start architecting your data model.\n\nBelow are some additional resources to dive in and start exploring these two platforms:\n\n**Directus**\n\n- See the [Directus guides](https://directus.io/guides/).\n- Join the Directus community on [Discord](https://directus.chat/).\n- Check out the source code on the official [Directus GitHub Repo](https://github.com/directus/directus).\n\n**Supabase**\n\n- Explore the [Supabase documentation](https://supabase.com/docs)\n- Join the Supabase community on [Discord](https://discord.supabase.com/)\n"])</script><script>self.__next_f.push([1,"3b:T5f1,"])</script><script>self.__next_f.push([1,"[ClickHouse](https://clickhouse.com/) is an open-source column-oriented database built for real-time analytics at scale. It delivers sub-second query performance over billions of rows, supports full read/write SQL, and is used by companies like Tesla, GitLab, and Cloudflare for observability, analytics, and AI workloads.\n\nThe ClickHouse Wrapper brings your ClickHouse tables into Postgres as queryable foreign tables. Read and write ClickHouse data with plain SQL and join it against your application data. Supports aggregate pushdown so queries run on ClickHouse rather than locally, and works with Supabase Vault for secure connection string management.\n\n### Supported Operations\n\n| Object | Select | Insert | Update | Delete |\n| --- | --- | --- | --- | --- |\n| Tables | ✅ | ✅ | ✅ | ✅ |\n\n### Supported Data Types\n\n| Postgres Type | ClickHouse Type |\n| --- | --- |\n| boolean | Bool |\n| \"char\" | Int8 |\n| smallint | UInt8, Int16 |\n| integer | UInt16, Int32 |\n| bigint | UInt32, Int64, UInt64 |\n| real | Float32 |\n| double precision | Float64 |\n| numeric | Decimal, UInt128, Int128 |\n| text | String, FixedString(N), UInt256, Int256 |\n| date | Date |\n| timestamp | DateTime |\n| uuid | UUID |\n| boolean[] | Array(Boolean) |\n| smallint[] | Array(Int16) |\n| integer[] | Array(Int32) |\n| bigint[] | Array(Int64) |\n| real[] | Array(Float32) |\n| double precision[] | Array(Float64) |\n| text[] | Array(String) |\n| any | Nullable(T) |\n\n### Resources\n\n- [supabase/wrappers on GitHub](https://github.com/supabase/wrappers)"])</script><script>self.__next_f.push([1,"3c:T44b4,"])</script><script>self.__next_f.push([1,"WeWeb is a no-code tool that allows you to build user interfaces on top of existing databases.\n\nIt allies the short learning curve of no-code with the freedom of code.\n\nYou can build complete frontends with drag-and-drop UI elements and no-code CSS properties but have the option to add custom code or import your own Vue.js components.\n\nYou can follow development best practices by building global workflows and re-usable functions with no-code triggers and formulas but also have the option to add custom JS where needed.\n\nWeWeb generates a standard PWA-ready Single Page Application and allows you to deploy your projects on your own infrastructure. Build in no-code, host on-premise.\n\n## Documentation\n\nThis guide explains how to connect a Supabase back-end to a WeWeb front-end and then configure all the CRUD operations necessary to build an Admin Portal with user authentication, roles, and permissions.\n\n[WeWeb](https://dashboard.weweb.io/sign-up) is a low-code front-end builder that allies the short learning curve of no-code with the freedom of code.\n\nIt connects to Supabase via two native integrations:\n\n- one for data manipulation, and\n- another for user authentication.\n\nIf you don't have an WeWeb account, you can create one [here](https://dashboard.weweb.io/sign-up).\n\nLet's get started!\n\n## Step 1: Add the Supabase Data Source Plugin in WeWeb\n\nIn order to read Supabase data in WeWeb, you'll first need to add the Supabase Data Source Plugin:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-08-09-at-11.38.44@2x.png)\n\nOnce you've added it, you will be invited to share your Supabase project URL and public API key:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-08-09-at-11.39.33@2x.png)\n\nIn Supabase, you can find both your project URL and public key in the `Settings` \u003e `API` menu:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-08-09-at-11.45.46@2x.png)\n\nOnce you have added both to WeWeb, you will have the option to enable realtime tables if you wish to do so:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-08-18-at-12.22.43@2x.png)\n\n**🚨 Warning 🚨**\n\n\u003e Realtime is disabled by default in Supabase for better database performance and security. Learn more about [realtime functionalities](/docs/guides/realtime).\n\n## Step 2: GET Data from Supabase\n\nOnce you click on `Add a Collection`, you will be invited to give your Collection a name and choose Supabase as a Data source:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-08-09-at-11.55.15@2x.png)\n\nYou will then be able to select the Table from which you want to pull data:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-08-09-at-11.57.09.gif)\n\nNotice that this gives you access to 2 separate modes to access the fields in the table:\n\n1.  a \"Guided\" mode, and\n2.  an \"Advanced\" mode.\n\n### Guided mode\n\nBy default, the \"Guided\" mode returns the data from all the fields.\n\nIn the example below, we decide to exclude the data from the `created_at` field in our `vehicles` table:\n\n_![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-08-09-at-12.04.37@2x.png)_\n\nAs a result, WeWeb does not fetch the `created_at` field.\n\nThis is helpful because we can exclude data that we don't want to load in the frontend, either because we don't need it or because it's confidential.\n\n### Advanced mode\n\nIn our database, we created 2 separate tables for vehicles and locations.\n\nIn the `vehicles` table, we made a reference to the `locations` table in our `location_id` field so we know where each car is:\n\n_![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-08-09-at-12.30.20@2x.png)_\n\nThe problem is, the link only gives us the id of the location in the `locations` table.\n\nIf you choose the \"Advanced\" mode, you will be able to get the `name` field of the location instead of the `id`.\n\nHow?\n\nBy [making custom queries to Supabase](https://supabase.com/docs/reference/javascript/select):\n\n_![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-08-18-at-12.06.17.gif)_\n\nIn the example above, we are telling Supabase:\n\n- from the table selected in the Collection – in this case the `vehicles` table – please send me the data in the `id`, `model`, and `mileage` fields\n- look for the `location_id` in the `vehicles` table in the `locations` table and send me the data in the corresponding `name` field\n\nIf we only ask for the data from the `location` field of the `vehicles` table, Supabase will only return the `id`:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-08-09-at-12.39.12@2x.png)\n\n**🚨 Warning 🚨**\n\n\u003e If you have enabled Row-Level Security in Supabase, make sure you have also [added a Policy](https://supabase.com/docs/learn/auth-deep-dive/auth-policies) that allows users to read the data in the table. Otherwise, WeWeb won't be able to get the data.\n\n## Step 3: Display Supabase Data in WeWeb\n\nAssuming you were able to fetch data from Supabase in a WeWeb Collection, you'll be able to bind the data from that Collection on your WeWeb pages.\n\nIn the example below, we chose to display the car model and mileage in the [Data Grid element](https://docs.weweb.io/add-elements/elements/data-grid.html) that comes out-of-the-box in WeWeb:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-10-21-at-12.31.05@2x.png)\n\nWe chose this element because it includes a built-in inline editing mode we'll want to use later for our CRUD operations.\n\n#### 🔥 Pro Tip 🔥\n\n\u003e In WeWeb, you can [bind arrays of data to any Container](https://docs.weweb.io/binding-filtering/display-data.html). Just bear in mind that the first child of the Container you bind the Collection to will be the repeated item. With that in mind, you might want the first child Element to be another Container with a number of items inside like a title, description, button or image.\n\n## Step 4: Update a record in Supabase\n\nOnce you've added a Supabase Collection of data to WeWeb, you might want to allow users to manipulate the data in that Collection.\n\nIn order to do so, you'll need to create a Workflow in WeWeb.\n\nIn the example below, we are using the \"Update row\" Workflow that comes by default with WeWeb's Data Grid Element.\n\nThe trigger is `On Row update`.\n\nSince we added the Supabase Data Source Plugin above, we have access to all the CRUD actions available in Supabase:\n\n- Select\n- Insert\n- Update\n- Upsert\n- Delete\n\nIn this case, we choose the \"Update\" action:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-10-13-at-15.27.20@2x.png)\n\nThen, in our \"Update\" action, we select the `vehicles` table and map the `id` to the id of the Workflow Event:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-10-13-at-17.16.51@2x.png)\n\nFinally, we tell WeWeb we want to update the `mileage` field in our Supabase table, and send the value in the `mileage` column of our Data Grid:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-10-13-at-17.20.24@2x.png)\n\nAnd that's it!\n\nIf you switch to Preview mode, you will be update your Supabase table from your WeWeb Data Grid:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-10-13-at-17.35.20.gif)\n\n**🔥 Pro Tip 🔥**\n\n\u003e By default, the fields in the Data Grid Element are Text fields but you can change the input type to Number if you need to send numerical data to your database:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-10-13-at-17.22.58@2x.png)\n\n## Restrict who can modify a record in Supabase\n\nBy default, all the data in the tables that are in the `public` schema of your Supabase project can be read, updated, or deleted.\n\nSupabase allows you to [enable Row-Level Security](https://supabase.com/docs/learn/auth-deep-dive/auth-row-level-security) for each of your tables:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-10-13-at-16.10.39@2x.png)\n\nIf you want to restrict certain actions to specific users or roles, you'll need to:\n\n- add Supabase authentication to your WeWeb project, and\n- [write SQL policies in Supabase](https://supabase.com/docs/learn/auth-deep-dive/auth-policies).\n\nWe provide a number of policy templates to get you started:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-10-13-at-16.17.32@2x.png)\n\nIn the example below, we say that users can:\n\n1.  update a record\n2.  in the \"locations\" table of the \"public\" schema\n3.  if they are authenticated\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-10-13-at-16.19.28@2x.png)\n\n**🔥 Pro Tip 🔥**\n\n\u003e Once you enable RLS on a Supabase table, you won't be able to access the data in a WeWeb Collection unless you've added a policy.\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-10-13-at-16.28.51.gif)\n\n## Step 4: Add User Authentication\n\nOnce you are able to display Supabase data in WeWeb, you might want to restrict access to certain users or display specific data based on a user's role.\n\nIn order to do that, you'll need to add WeWeb's Supabase Auth Plugin.\n\n### Add Supabase Auth Plugin in WeWeb\n\nSupabase comes with an in-built authentication system which you can use in WeWeb.\n\nTo add the Supabase Auth Plugin in WeWeb, go to `Plugins` \u003e `Authentication`:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-08-09-at-15.00.47@2x.png)\n\nAssuming you have already provided your Supabase project URL and public API key when setting up the Supabase Data source, the only thing left to do will be to add your private API key:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-08-09-at-15.04.04@2x.png)\n\nIn Supabase, you can find your private API key in `Settings` \u003e `API`:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-08-09-at-15.05.40@2x.png)\n\n**🚨 Warning 🚨**\n\n\u003e As the name suggests, you'll want to keep this API key secret! Assuming you copy it properly in the \"Private API key\" field of the Supabase Auth Plugin and don't use it anywhere else in your Weweb project, Weweb will never make it public.\n\nYou will then be invited to choose a page to redirect _unauthenticated_ users, i.e. users who are NOT signed-in:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-08-09-at-15.17.43@2x.png)\n\n**🚨 Warning 🚨**\n\n\u003e When you setup your Login Workflow, make sure you don't redirect unauthenticated users to a page that is only accessible to authenticated users. Otherwise, you'll be creating an **infinite loop** and your app will crash.\n\n### Create User Sign Up and Sign In Workflows\n\nIn the `Add` \u003e `UI kit` menu of WeWeb, you can find ready-made Sign in and Sign up Forms:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-08-19-at-11.45.02@2x.png)\n\nOnce you've added a Form to the Canvas, you'll be able to style it whichever way you want.\n\nIn the example below, we added an image with the logo of our project to a Sign up Form and changed the background color of the `Create Form` Container:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-08-19-at-11.49.24@2x.png)\n\nTo allow users to sign up, you'll need to create a Sign up Workflow on the Form Container:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-08-19-at-11.50.42@2x.png)\n\n**🔥 Pro Tip 🔥**\n\n\u003e It's important that the Workflow is on the Form Container and not the Sign up Button because we want to validate the fields of the Form when users submit it.\n\nIn the Workflow, you will choose the `On submit` trigger and add the Supabase `Sign up` Action:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-08-19-at-11.58.23.gif)\n\nThen, you'll want to map the email, password, and metadata information in the Form to the email, password, and metadata in Supabase before choosing what page the new user should be redirected to:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-08-19-at-12.02.32.gif)\n\nIn the example above, we made sure to add the user's name as an item in that user's metadata.\n\nIn Supabase, you can find the user's metadata in JSON format in a dedicated field of the `users` table, named `raw_user_meta_data`:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-08-19-at-12.12.46@2x.png)\n\nThe same logic will apply to any Supabase Action you want to trigger.\n\n## Adding User Roles \u0026 Permissions\n\nNow let's say we want to gate content and set different permissions based on a user's role.\n\n### Adding Roles in Supabase\n\nIn Supabase, we'll need to create a `roles` table with a list of roles and a join table that links the `roles` table with our `users` table.\n\nFirst, let's create a `roles` table with three roles and make sure that each role had a UUID and a `name`:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-08-19-at-18.39.08@2x.png)\n\n**🚨 Warning 🚨**\n\n\u003e In order for the integration to work with the Users tab in WeWeb, it is crucial that the role title is a text field named `name`.\n\n### Joining Roles and Users in Supabase\n\nSecond, let's create a `userRoles` join table:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-08-19-at-18.45.10@2x.png)\n\nIn the join table above, you can see we have an `id` field that is uniquely identifiable thanks to a UUID.\n\nThis unique `id` is linked to a `userId`, which is also a UUID, more specifically, it is the UUID we find in the `id` field of the `users` table in the `auth` schema:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-08-19-at-18.51.00@2x.png)\n\nEach row in our `userRoles` table is also linked to a `roleId` which is the UUID we find in the `id` field of the `roles` table in the `public` schema:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-08-19-at-18.52.57.gif)\n\n### Linking Users in WeWeb to Roles and Users in Supabase\n\nOnce we've added our list of roles in Supabase and created an empty join table to link our roles with users, it's time to go to WeWeb.\n\nIn `Plugins` \u003e `Supabase Auth` \u003e `3. Roles table`, we'll click `refresh` and select the relevant Supabase tables we just created:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-08-19-at-19.00.54@2x.png)\n\nOnce you've told WeWeb where to find the `roles` and the join table in Supabase, you'll be able to easily view and maintain user roles in the `Users` tab in WeWeb:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-08-19-at-19.03.13.gif)\n\nWhen you make a change to a User in WeWeb, it will automatically be updated in Supabase.\n\n## Users vs Profiles\n\nSo far, we've showed you how to work with the default `users` table that Supabase generates in the `auth` schema when you create a new project.\n\nNote that, for security purposes, the information in that `users` table is not exposed on the auto-generated API.\n\nHow does this affect your project in WeWeb?\n\n### Let users update their information\n\nLet's say you want to let authenticated users update their information, then you don't need to set up anything else in Supabase.\n\nYou could simply create a user profile page in WeWeb and display their information when they sign in, based on the data you have in the `user` Variable:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/weweb/CleanShot-2022-08-19-at-19.16.17@2x.png)\n\n### Display other users' information\n\nIn some use cases, you might want to display _other_ users' information.\n\nFor example, if you're building an HR portal in WeWeb, you might want HR employees to have access to a list of applicants and their user profiles.\n\nYou wouldn't be able to do that with the `users` table in the `auth` schema because each user's information is only available to them.\n\nFor such a use case, we recommend creating a `profiles` table in the `public` schema to store user data that you want to access via the API.\n\nIn WeWeb, you would then be able to create a Collection to get data from the `profiles` table.\n\nLearn more about [managing user data in Supabase](https://supabase.com/docs/guides/auth/managing-user-data).\n"])</script><script>self.__next_f.push([1,"3d:T44b,"])</script><script>self.__next_f.push([1,"ElectricSQL is a local-first sync layer for building fast, collaborative apps that work offline.\n\nLocal-first is a new paradigm where your app code talks directly to an embedded local database and data syncs in the background via active-active replication. It takes the network off the interaction path and combines instant reactivity with realtime multi-user collaboration and conflict-free offline support.\n\nElectricSQL is an open source sync layer that allows you to build local-first apps directly on Postgres. It provides a conflict-free programming model and is formally proven to have the strongest possible consistency and integrity guarantees for a highly available database system. It also supports dynamic partial replication, with an expressive programming model that allows you to craft how data syncs between Postgres and local applications.\n\nElectricSQL works with both the Supabase Platform and self-host Supabase and integrates natively with Supabase Auth. It's designed to work with your existing data model and provides full SQL support with referential integrity and constraints."])</script><script>self.__next_f.push([1,"3e:T3a02,"])</script><script>self.__next_f.push([1,"Draftbit is a \"pro-code\" low-code mobile app building platform. Draftbit exports React Native source code that is 100% run on open-source languages and libraries.\n\n## Documentation\n\nThis guide explains how to connect a Supabase back-end to a Draftbit front-end and then configure all CRUD operations necessary to build a simple mobile app.\n\n[Draftbit](https://draftb.it/3Fkbask) is a \"pro-code\" low-code mobile app building platform. Draftbit exports React Native source code that is 100% run on open-source languages and libraries.\n\nDraftbit is back-end agnostic and connects to Supabase via REST API.\n\n\u003e Note: For the demonstration purpose of this guide, we are using a pre-populated database in Supabase. We are calling `Groceries`. To follow along, rename it any way you prefer.\n\n![Prepopulated Database](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/draftbit/prepopulated-database.png)\n\nIf you don’t have a Draftbit account, create one [here](https://draftb.it/3Fkbask). Once you’ve got your account set up, Create a New App. You can select `Start From a Blank App` for this demo and proceed to the Builder interface.\n\n## Step 1: Get the RESTful endpoint and Project API key\n\nTo connect the REST API in the Draftbit app, the following fields are required:\n\n- Base URL of the REST API, which is in the format: `https://\u003cyour-domain\u003e.supabase.co/rest/v1` where the `\u003cyour-domain` is a unique domain name generated by Supabase.\n- The `supabase-key` is the secret key.\n\nYou can find these unique values in the API settings of your Supabase account.\n\n- Click the Settings button from the top menu bar.\n- In Settings, select **API**.\n- In the **Project URL** section, select and copy the URL. It is the Base URL of your Supabase REST API. It will be required to make a connection to the Draftbit app.\n- Also, under `Project API keys`, select and copy the API key under `anon`. It is required for every request made to the Supabase database.\n\n![Get Supabase connection string](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/draftbit/endpoint.png)\n\n## Step 2: Save Supabase API key as Authorization Header in Draftbit\n\nTo authorize your Draftbit app with Supabse, in the builder interface:\n\n- Open the **Settings** tab from the top menu bar.\n- In Project Settings, navigate to App Variables.\n- Enter a name to access the API Key such as `Authorization_Header`. When making the service connection in the next section, it will be passed as the value for the header `Authorization`.\n- The value of this key requires you to enter an authorization token that starts with syntax `Bearer \u003cyour-api-key\u003e` (the space between `Bearer` and `\u003cyour-api-key\u003e` is required). Click **Add** after adding the value.\n- Enter another key name to access the API Key such as `Api_Key_Header`. When making the service connection in the next section, it will be passed as the header `apiKey` value.\n- The value of this key requires you to enter an authorization token that starts with syntax is `\u003cyour-api-key\u003e`. Click **Add** after adding the value.\n- Click **Save** to save these keys and close the modal.\n\n![Add header values in Draftbit](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/draftbit/authheader.png)\n\n## Step 3: Add Supabase RESTful endpoint in Draftbit\n\nIn your Draftbit builder interface:\n\n- Open the **API \u0026 Cloud Services** modal from the top menu bar.\n- From the **Connect a service** menu, click on **Rest API**.\n\n- In Step 1: Enter a name for your REST API. Then, paste your `Base URL` (from the first section) into the Base URL field.\n- In Step 2: Under **Key** add `Authorization` and `apikey`. Then, under **Value**, select the global variables (from the previous section) to add the actual values for both keys.\n- Click Save.\n\n![Create a API service in Draftbit](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/draftbit/service.png)\n\n## Making API requests with Supabase \u0026 Draftbit\n\n### GET request to Fetch all records\n\nIn this section, let's populate a Fetch component with all the data from a simple Supabase and then display the data fetched from the Supabase data table in a List component.\n\nFor reference, here is a how the Components tree looks like for this screen:\n\n![Components tree](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/draftbit/ctree.png)\n\nThe next step is to create an endpoint. Let's try fetching all the data using a `GET` HTTP request. Select the Supabase service in the **API \u0026 Cloud Services** modal, and then:\n\n- Click **Add endpoint**.\n- In Step 1: enter the name for the endpoint. Make sure the **Method** select is `GET`.\n- In Step 2: add the base name path: `/groceries/select=*`, where `groceries` is the table name in Supabase.\n- In Step 4: click the **Test** button next to the Endpoint input to verify the response coming from the Supabase.\n- Click Save.\n\n![Creating a GET request endpoint](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/draftbit/get-request.gif)\n\nIn the Builder, on the app screen:\n\n- Select the Fetch component in the Components tree and go to the [Data tab from Properties Panel](doc:introduction-to-the-builder#properties-panel).\n- For **Service**, select the name of the Supabase Service.\n- For **Endpoint**, select the endpoint you want to fetch the data from.\n- Select the List component in the Components and go to the [Data tab from Properties Panel](doc:introduction-to-the-builder#properties-panel). In Data, select `Top-Level Response` from the dropdown menu.\n- Then, select the Text component in the Components and then go to the Data tab from the Properties Panel.\n- Add a `{{varName}}` value (inside the curly braces) to represent a column field from the Supabase. For example, add `{{title}}` to represent the column name from the Supabase Base.\n- Under **Variables**, you will see the variable name defined in the previous step. From the dropdown menu, select the appropriate field that represents the data field.\n\n![Fetching data on app screen](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/draftbit/fetchall.gif)\n\n### GET request to fetch single row\n\nOpen the **API \u0026 Cloud services** modal from the top menu, select the Supabase service, and then:\n\n- Click **Add endpoint**.\n- In Step 1: enter a name for the endpoint.\n- In Step 2: add the `/groceries/column-name=eq.{{column-name}}` variable. Then, add a Test value for the `{{column-name}}`. For example, it can be the `title` or the `id`.\n- In Step 4: click the **Test** button next to the Endpoint input to verify the response coming from the Supabase.\n- Click Save.\n\n![Creating endpoint to fetch a single row](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/draftbit/getsingle.gif)\n\nOn app screen:\n\n- Select the Fetch component in the Components tree and go to the Data tab from Properties Panel\n- For **Service**, select the name of the Supabase Service.\n- For **endpoint**, select the endpoint you want to fetch the data from.\n- Set the value for the `id` in the Configuration \u003e URL Structure section to Navigation \u003e id.\n- Select the List component in the Components and go to the Data tab from Properties Panel. In Data, select `Top-Level Response` from the dropdown menu.\n- Then, select the Text component in the Components and then go to the Data tab from the Properties Panel.\n- Add a `{{varName}}` value (inside the curly braces) to represent the column field from the Supabase. For example, add `{{title}}` to represent the field and value from the Supabase data table.\n- Under **Variables**, you will see the variable name defined in the previous step. From the dropdown menu, select the appropriate field that represents the data field.\n\n![Displaying data from single row](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/draftbit/fetchsingle.png)\n\n### POST request to submit a new row\n\nSubmitting new Data from the Draftbit app to Supabase's REST API requires the request to be sent using the HTTP `POST` method.\n\nFor this section, you need to use at least one component that accepts user input and has a Field Name prop to POST data using Supabase REST API.\n\nYou can use one of the following components in Draftbit:\n\n- Text Input\n- Text Area/Text Field\n- Checkbox\n- Slider\n- Radio Button Group\n- Radio Button\n\nIn addition, you need a Touchable component like a Button to attach the POST action. After you have created these components, we will create the `POST` endpoint:\n\n- Click **Add endpoint**.\n- In Step 1: enter a name for the endpoint and select the Method to `POST`.\n- In Step 2: enter the base name as path: `/groceries`.\n- In Step 3: add a valid Body structure to submit a POST request. Add one or many `{{variable}}` for test values. Click Body Preview to validate the structure of the Body in the request. For the example, let's create a variable called `{{inputValue}}`.\n- In Step 4: to see the new row added to the Supabase data table as JSON response inside the Builder, you have to pass a new header called `Prefer` with its value as `return=representation`.\n- In Step 5: click the **Test** button next to the Endpoint input to verify the response coming from the Supabase and click Save.\n\n![Make a POST request to add new data to Supabase database](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/draftbit/postrequest.gif)\n\nOnce you follow the above steps, you should get a 200 OK response with exactly the new record as a JSON you have entered for your schema.\n\nAn example of how Body in a request will look like:\n\n```json\n{\n  \"title\": {{inputValue}}\n}\n```\n\nWhere `title` is the column name in your Supabase database table.\n\nIn Draftbit, using a Touchable or a Button component, you can trigger the action **API Request** to submit the data to the endpoint.\n\nNow, there is a working `POST` request in Draftbit. Map its response to the components on your screen in Draftbit.\n\nFirst, for each input component, make sure you have set the Field Names (found in the Configs tab, second from the left) to unique values. For example, in the screen below, there is one TextInput field component with the value of the `Field Name` prop of `textInputValue`.\n\n![Field Name prop on a TextInput component](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/draftbit/textinput.png)\n\nNext, on your Button component, go to the Interactions tab in the Properties panel located on the far-right-hand side. Select an Action called `API request`.\n\nIn the API request action:\n\n- In **Service**, select the name to Supabase API Service.\n- In **Endpoint**, select the name of the Endpoint.\n- Then add the configuration for the body request to be sent by selecting the values for `{{inputValue}}`.\n\n![Setting up the API Request to send a POST request](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/draftbit/postapirequest.png)\n\nAfter completing the above steps, you can trigger the API request to submit new data to the Supabase database.\n\n### PATCH request to Update a new record\n\nUpdating an existing record from the Draftbit app to Supabase's REST API requires the request to be sent using the HTTP `PATCH` method.\n\nAfter you have created your screen components in the Draftbit builder, open the Supabase service and make the `PATCH` endpoint:\n\n- Click **Add endpoint**.\n- In Step 1: enter a name for the endpoint and select the Method to `PATCH`.\n- In Step 2: enter the base name as path: `/groceries?id=eq.{{id}}`, where `id` is the value of an existing record in the database.\n- In Step 3: add a valid Body structure to submit a PATCH request. Add one or many `{{variable}}` for test values depending on the structure of your app. Click Body Preview to validate the structure of the Body in the request. For the example, let's create a variable called `{{inputValue}}`.\n- In Step 5: click the **Test** button next to the Endpoint input to verify the response coming from the Supabase and click Save.\n\n![Creating an endpoint for PATCH request](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/draftbit/patch.gif)\n\nNext, on your Button component, go to the Interactions tab in the Properties panel located on the far-right-hand side. Select an Action called `API request`.\n\nIn the API request action:\n\n- In **Service**, select the name to Supabase API Service.\n- In **Endpoint**, select the name of the Endpoint.\n- Then add the configuration for the query param, and the body request to be sent by selecting the values for `{{inputValue}}`.\n\n![Setting up the API Request to send a PATCH request](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/draftbit/patchapirequest.png)\n\nAfter completing the above steps, you can trigger the API request to update existing data in the Supabase database.\n\n### DELETE request to remove an existing record\n\nThe `DELETE` request is to the Supabase with an item's `column-name` to remove that particular record from the table. You can use a [filter from Supabase](https://supabase.io/docs/reference/javascript/using-filters) to filter the value of a specific `column-name`.\n\nAfter you have created your screen components in the Draftbit builder, open the Supabase service and create the `DELETE` endpoint:\n\n- Click **Add endpoint**.\n- In Step 1: enter a name for the endpoint and select the Method to `DELETE`.\n- In Step 2: add `/groceries/columnName=eq.{{columnName}}`. Then, add a Test value for the `{{columnName}}`. For example, the `{{columnName}}` here can be `id` of the record.\n- In Step 4: click the **Test** button next to the Endpoint input to verify the response from the Supabase.\n- Click Save.\n\n![Creating an endpoint for DELETE request](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/draftbit/delete.gif)\n\nNext, on your Button component, go to the Interactions tab in the Properties panel located on the far-right-hand side. Select an Action called `API request`.\n\nIn the API Request action:\n\n- In **Service**, select the name to Supabase API Service.\n- In **Endpoint**, select the name of the Endpoint.\n- Then, add the configuration for the query request to be sent by selecting a value. For example, in this case it will be the `id` of the record coming from the Navigation parameter.\n\n![Setting up the API Request to send a DELETE request](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/draftbit/deleteapirequest.gif)\n\n## Resources\n\n- [Draftbit](https://draftb.it/3Fkbask) official website.\n- [Draftbit Community](https://community.draftbit.com/home).\n- [Draftbit](https://docs.draftbit.com/) documentation.\n"])</script><script>self.__next_f.push([1,"3f:T5ca,"])</script><script>self.__next_f.push([1,"ChatGPT is OpenAI's assistant, and for a lot of teams it's the first place a question gets asked. It answers, drafts, and analyzes, and through connected tools it can act on the systems you point it at.\n\nYour project data is usually the thing you most want to ask about, and the thing a general assistant can't see. Connecting Supabase over the Model Context Protocol closes that gap, giving ChatGPT scoped access to your project so you can ask about a real schema and real rows instead of pasting exports into a chat window.\n\nOnce connected, you can:\n\n- Ask what tables exist and how they relate\n- Run SQL queries and read the results back\n- Read API, Postgres, Auth, and Storage logs\n- Check the security and performance advisors\n- Pull project URLs and publishable keys\n- Search the Supabase docs without leaving the conversation\n\n**Getting started:**\n\n1. In ChatGPT on the web, open Settings, go to Apps \u0026 Connectors, and open Advanced.\n2. Turn on developer mode, then choose Create App to add an MCP server.\n3. Enter the Supabase MCP server URL: https://mcp.supabase.com/mcp\n4. Authorize with Supabase in the browser window that opens, choosing the organization that holds your project.\n5. Start a new chat, select the Supabase server from the tools menu, and try asking \"What tables are in my database?\"\n\nScope it however you like: pin the connector to a single project, expose only the feature groups you need, or run it read-only, and approve tool calls before they execute."])</script><script>self.__next_f.push([1,"40:Tc76,"])</script><script>self.__next_f.push([1,"Corbado helps you offer passkeys in any new or existing application. Let your users log in via Face ID, Touch ID or Windows Hello to boost conversion, improve UX and increase security - regardless if you already have users or not.\n\nWe’re on a mission to free the world from passwords through innovative passkeys solutions. By helping developers implement passkeys, we want to contribute to make the Internet a safer place.​ \n\nPasskeys are the new standard for authentication for native and web apps as they provide:\n\n- **Best UX with Face ID, Touch ID or Windows Hello**: Let your users login with Face ID \u0026 Touch ID that they've already set up instead of remembering passwords.\n- **Automatic Login**: Your users can log in automatically in over 75% of browsers.\n- **100% Phishing-Resistance**: Passkeys prevent all sort of password-based attacks (e.g. phishing, credential stuffing, brute-force attacks).\n- **4x Better, 2x Faster Logins**: Passkeys offer up to 4x higher login success rates, makes authentication twice as fast \u0026 reduces password resets.\n Never tried passkeys as a user? Then, check out this passkeys demo: https://passkeys.eu \n\n### Why Do Developers Choose Corbado?\n\n- **Simple Integration via Web Components**: Use web components that can be integrated with a couple of lines of code.\n- **Keep Your Supabase User Data**: You can keep all your user data in place and just use Corbado for managing passkey authentication. Existing Supabase users can still use their password as fallback login method.\n- **Passkey Intelligence**: Corbado detects the device’s passkey-readiness and offers based on the individual user device the best passkeys experience (or alternative login methods if passkeys are not available).\n- **Smart User Transition to Passkeys**: Corbado ensures existing password-based users from Supabase Auth are smoothly transitioned to passkeys, while offering new users passkeys already during sign-up.\n\n### How Does the Integration Work?\n\nThe flow of information looks like this: the Corbado web component which is integrated into the login page handles all means of authentication and talks with the Node.js backend to make sure existing Supabase users can still login with their password as fallback and are slowly transitioned to passkeys, while new users are offered passkeys during sign-up.\n\n![Integration diagram](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/corbado/corbado_info.png)\n\n## Getting Started\n\nPlease have a look at our detailed **Supabase integration guide** that teaches all the required steps to connect Supabase and Corbado. Corbado is used for passkey authentication and passwordless fallbacks, while Supabase is used for legacy passwords and user management. The integration guide uses a Node.js (Express) app to showcase the integration.\n\nIf you don’t have a Corbado account, create one here. You will also need a Supabase account, which can be created by signing in here.\n\nYou can have a look at the full code of the integration guide in this GitHub repository.\n\n## Support\n\nFor more implementation guides, code examples, and support, visit our documentation or join our Slack community."])</script><script>self.__next_f.push([1,"41:T529,"])</script><script>self.__next_f.push([1,"[Snowflake](https://www.snowflake.com/) is the AI Data Cloud: a cloud-based platform used by more than 13,000 organizations worldwide for data warehousing, analytics, and AI application development. It runs across AWS, Azure, and Google Cloud, providing a single platform for structured and unstructured data with built-in governance and AI capabilities.\n\nThe Snowflake Wrapper brings your Snowflake data into Postgres as queryable foreign tables. Read and write Snowflake tables and views with plain SQL and join them against your application data. The wrapper uses key-pair authentication to access Snowflake's SQL REST API, works with Supabase Vault for secure private key management, and is built on WebAssembly (Wasm) for lightweight, sandboxed execution.\n\n### Supported Operations\n\n| Object | Select | Insert | Update | Delete |\n| --- | --- | --- | --- | --- |\n| Tables / Views | ✅ | ✅ | ✅ | ✅ |\n\n### Supported Data Types\n\n| Postgres Type | Snowflake Type |\n| --- | --- |\n| boolean | BOOLEAN |\n| smallint | SMALLINT |\n| integer | INT |\n| bigint | BIGINT |\n| float | FLOAT4 |\n| double precision | FLOAT8 |\n| numeric | NUMBER |\n| text | VARCHAR |\n| date | DATE |\n| timestamp | TIMESTAMP_NTZ |\n| timestamptz | TIMESTAMP_TZ |\n\n### Resources\n\n- [supabase/wrappers on GitHub](https://github.com/supabase/wrappers)"])</script><script>self.__next_f.push([1,"42:Tdad,"])</script><script>self.__next_f.push([1,"Atomic CRM lets you build the CRM that matches your company's vision. \n\nIt's both an **application template**, that you can use to get started quickly, and a **framework** that you can extend and customize to fit your needs.\n\nIt's built on Supabase, so it's super easy to host, and to extend with custom logic. The frontend is build with TypeScript, React, Material UI, Tanstack Query, react-hook-form, and react-admin. \n\n## Features\n\nAtomic CRM comes out of the box with all the features you'd expect from a CRM, such as:\n\n- **Organize Contacts**: Effortlessly organize and access all your contacts in one place, ensuring you have the right information at your fingertips.\n- **Create Tasks and Set Reminders**: Stay on top of your to-do list with easy task creation and automated reminders to keep you on track.\n- **Take Notes**: Capture important details and insights with our intuitive note-taking feature, making sure nothing gets lost.\n- **Import and Export Data**: Seamlessly transfer data in and out of the system with our simple import and export tools, making integration a breeze.\n- **Manage Deals**: Visualize and manage your sales process with our customizable deals pipeline, helping you track progress and close deals faster.\n- **Track Activity History**: Get a comprehensive view of all interactions, including emails, tasks, new deals and contacts, with aggregated activity logs.\n\nIt also comes with a set of **advanced capabilities** that will make your CRM stand out:\n\n- **Authentication**: Log in using your Enterprise Workspace account, including Google, Azure, Keycloak, and Auth0.\n- **Kanban Board**: Optimize your sales process with a customizable, drag-and-drop card system.\n- **Email to Note**: Include Atomic CRM in your email CC to automatically capture and save communications as notes.\n- **Contact Avatars**: Enrich contact details by letting the CRM automatically pull avatars from the web using their email.\n- **API Integration**: Tap into Atomic CRM's API to effortlessly integrate with other systems, providing a cohesive and unified data environment.\n\n## Getting Started\n\nGo to https://github.com/marmelab/atomic-crm and follow the instructions in the README to get started with Atomic CRM.\n\nFor the Supabase part, Atomic CRM comes with a CLI that will create and populate a Supabase project for you.\n\n## Extensibility\n\nAtomic CRM was designed as a framework that you can extend and customize to fit your needs. Here are a few ways you can do that:\n\n- **Theming**: Customize the CRM's appearance with your company's colors and logo, ensuring seamless integration with your branding.\n- **Component Flexibility**: Easily swap out any component with your own creations or third-party libraries for a fully tailored experience.\n- **Strong Typing**: Thanks to TypeScript, detect errors early and keep the codebase maintainable.\n- **Custom Pages**: Expand the application's capabilities by adding custom pages for additional functionality.\n- **Extensible Data Model**: With full control over your database, modify the schema to include domain-specific metadata and features.\n- **Built on react-admin**: Leverage over 230 hooks and components to fully tailor your CRM experience.\n\nAtomic CRM was designed with Developer Experience in mind, so you can focus on building the features that matter to your business.\n\n## License\n\nAtomic CRM is free and open-source, licenced under the MIT License. You can use it for personal or commercial projects, and modify it as you see fit."])</script><script>self.__next_f.push([1,"43:T4787,"])</script><script>self.__next_f.push([1,"SuperTokens is an open source authentication solution which provides many stratergies for authenticating and managing users. You can use the managed service for easy setup or you can self host the solution to have complete control over your data.\n\nWith SuperTokens, Supabase can be used to store and authorize access to user data. Supabase makes it simple to setup Row Level Security(RLS) policies which ensure users can only read and write data that belongs to them.\n\n## Documentation\n\n[SuperTokens](https://www.supertokens.com) is an open source authentication solution which provides many stratergies for authenticating and managing users. You can use the managed service for easy setup or you can self host the solution to have complete control over your data.\n\nIn this guide we will build a simple web application using SuperTokens, Supabase, and Next.js. You will be able to sign up using SuperTokens and your email and user ID will be stored in Supabase. Once authenticated the frontend will be able to query Supabase and retrieve the user's email. Our example app will be using the [Email-Password and Social Login](https://supertokens.com/docs/thirdpartyemailpassword/introduction) recipe for authentication and session management.\n\nWe will use Supabase to store and authorize access to user data. Supabase makes it simple to setup Row Level Security(RLS) policies which ensure users can only read and write data that belongs to them.\n\n### Demo App\n\nYou can find a demo app using SuperTokens, Supabase and Nexts.js on [Github](https://github.com/supertokens/supertokens-auth-react/tree/master/examples/with-supabase)\n\n## Step 1: Create a new Supabase project\n\nFrom your [Supabase dashboard](https://supabase.com/dashboard/), click `New project`.\n\nEnter a `Name` for your Supabase project.\n\nEnter a secure `Database Password`.\n\nSelect the same `Region` you host your app's backend in.\n\nClick `Create new project`.\n\n![New Supabase project settings](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/supertokens/supabase_dashboard_create.png)\n\n## Step 2: Creating tables in Supabase\n\nFrom the sidebar menu in the [Supabase dashboard](https://supabase.com/dashboard/), click `Table editor`, then `New table`.\n\nEnter `users` as the `Name` field.\n\nSelect `Enable Row Level Security (RLS)`.\n\nRemove the default columns\n\nCreate two new columns:\n\n- `user_id` as `text` as primary key\n- `email` as `text`\n\nClick `Save` to create the new table.\n\n![Users table](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/supertokens/supabase_table_create.png)\n\n## Step 3: Setup your Next.js App with SuperTokens.\n\nSince the scope of this guide is limited to the integration between SuperTokens and Supabase, you can refer to the SuperTokens website to see [how to setup your Next.js app with SuperTokens](https://supertokens.com/docs/thirdpartyemailpassword/nextjs/about).\n\nOnce you finish setting up your app, you will be greeted with the following screen\n\n![SuperTokens Auth Screen](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/supertokens/supertokens_thirdpartyemailpassword_auth_screen.png)\n\n## Step 4: Creating a Supabase JWT to access Supabase\n\nIn our Nextjs app when a user signs up, we want to store the user's email in Supabase. We would then retrieve this email from Supabase and display it on our frontend.\n\nTo use the Supabase client to query the database we will need to create a JWT signed with your Supabase app's signing secret. This JWT will also need to contain the user's userId so Supabase knows an authenticated user is making the request.\n\nTo create this flow we will need to modify SuperTokens so that, when a user signs up or signs in, a JWT signed with Supabase's signing secret is created and attached to the user's session. Attaching the JWT to the user's session will allow us to retrieve the Supabase JWT on the frontend and backend (post session verification), using which we can query Supabase.\n\nWe want to create a Supabase JWT when we are creating a SuperTokens' session. This can be done by overriding the `createNewSession` function in your backend config.\n\n```ts\n// config/backendConfig.ts\n\nimport ThirdPartyEmailPasswordNode from \"supertokens-node/recipe/thirdpartyemailpassword\";\nimport SessionNode from \"supertokens-node/recipe/session\";\nimport { TypeInput } from \"supertokens-node/lib/build/types\";\nimport { appInfo } from \"./appInfo\";\nimport jwt from \"jsonwebtoken\";\n\nlet backendConfig = (): TypeInput =\u003e {\n    return {\n        framework: \"express\",\n        supertokens: {\n            connectionURI: \"https://try.supertokens.com\",\n        },\n        appInfo,\n        recipeList: [\n            ThirdPartyEmailPasswordNode.init({...}),\n            SessionNode.init({\n                override: {\n                    functions: (originalImplementation) =\u003e {\n                        return {\n                            ...originalImplementation,\n                            // We want to create a JWT which contains the users userId signed with Supabase's secret so\n                            // it can be used by Supabase to validate the user when retrieving user data from their service.\n                            // We store this token in the accessTokenPayload so it can be accessed on the frontend and on the backend.\n                            createNewSession: async function (input) {\n                                const payload = {\n                                    userId: input.userId,\n                                    exp: Math.floor(Date.now() / 1000) + 60 * 60,\n                                };\n\n                                const supabase_jwt_token = jwt.sign(payload, process.env.SUPABASE_SIGNING_SECRET);\n\n                                input.accessTokenPayload = {\n                                    ...input.accessTokenPayload,\n                                    supabase_token: supabase_jwt_token,\n                                };\n\n                                return await originalImplementation.createNewSession(input);\n                            },\n                        };\n                    },\n                },\n            }),\n        ],\n        isInServerlessEnv: true,\n    };\n};\n\n```\n\nAs seen above, we will be using the `jsonwebtoken` library to create a JWT signed with Supabase's signing secret whose payload contains the user's userId.\n\nWe will be storing this token in the `accessTokenPayload` which will essentially allow us to access the `supabase_token` on the frontend and backend whilst the user is logged in.\n\n## Step 5: Creating a Supabase client\n\nCreate a new file called `utils/supabase.ts` and add the following:\n\n```ts\n// utils/supabase.ts\n\nimport { createClient } from '@supabase/supabase-js'\n\nconst getSupabase = (access_token) =\u003e {\n  const supabase = createClient(\n    process.env.NEXT_PUBLIC_SUPABASE_URL,\n    process.env.NEXT_PUBLIC_SUPABASE_KEY\n  )\n\n  supabase.auth.session = () =\u003e ({\n    access_token,\n  })\n\n  return supabase\n}\n\nexport { getSupabase }\n```\n\nThis will be our client for talking to Supabase. We can pass it an `access_token` and it will be attached to our request. This `access_token` is the same as the `supabase_token` we had created earlier.\n\n## Step 6: Inserting users into Supabase when they sign up:\n\nIn our example app there are two ways for signing up a user. Email-Password and Social Login based authentication. We will need to override both these APIs such that when a user signs up, their email mapped to their userId is stored in Supabase.\n\n```ts\n// config/backendConfig.ts\n\nimport ThirdPartyEmailPasswordNode from \"supertokens-node/recipe/thirdpartyemailpassword\";\nimport SessionNode from \"supertokens-node/recipe/session\";\nimport { TypeInput } from \"supertokens-node/lib/build/types\";\nimport { appInfo } from \"./appInfo\";\nimport jwt from \"jsonwebtoken\";\nimport { getSupabase } from \"../utils/supabase\";\n\nlet backendConfig = (): TypeInput =\u003e {\n    return {\n        framework: \"express\",\n        supertokens: {\n            connectionURI: \"https://try.supertokens.com\",\n        },\n        appInfo,\n        recipeList: [\n            ThirdPartyEmailPasswordNode.init({\n                providers: [...],\n                override: {\n                    apis: (originalImplementation) =\u003e {\n                        return {\n                            ...originalImplementation,\n                            // the thirdPartySignInUpPost function handles sign up/in via Social login\n                            thirdPartySignInUpPOST: async function (input) {\n                                if (originalImplementation.thirdPartySignInUpPOST === undefined) {\n                                    throw Error(\"Should never come here\");\n                                }\n\n                                // call the sign up/in api for social login\n                                let response = await originalImplementation.thirdPartySignInUpPOST(input);\n\n                                // check that there is no issue with sign up and that a new user is created\n                                if (response.status === \"OK\" \u0026\u0026 response.createdNewUser) {\n\n                                    // retrieve the accessTokenPayload from the user's session\n                                    const accessTokenPayload = response.session.getAccessTokenPayload();\n\n                                    // create a supabase client with the supabase_token from the accessTokenPayload\n                                    const supabase = getSupabase(accessTokenPayload.supabase_token);\n\n                                    // store the user's email mapped to their userId in Supabase\n                                    const { error } = await supabase\n                                        .from(\"users\")\n                                        .insert({ email: response.user.email, user_id: response.user.id });\n\n                                    if (error !== null) {\n\n                                        throw error;\n                                    }\n                                }\n\n                                return response;\n                            },\n                            // the emailPasswordSignUpPOST function handles sign up via Email-Password\n                            emailPasswordSignUpPOST: async function (input) {\n                                if (originalImplementation.emailPasswordSignUpPOST === undefined) {\n                                    throw Error(\"Should never come here\");\n                                }\n\n                                let response = await originalImplementation.emailPasswordSignUpPOST(input);\n\n                                if (response.status === \"OK\") {\n\n                                    // retrieve the accessTokenPayload from the user's session\n                                    const accessTokenPayload = response.session.getAccessTokenPayload();\n\n                                    // create a supabase client with the supabase_token from the accessTokenPayload\n                                    const supabase = getSupabase(accessTokenPayload.supabase_token);\n\n                                    // store the user's email mapped to their userId in Supabase\n                                    const { error } = await supabase\n                                        .from(\"users\")\n                                        .insert({ email: response.user.email, user_id: response.user.id });\n\n                                    if (error !== null) {\n\n                                        throw error;\n                                    }\n                                }\n\n                                return response;\n                            },\n                        };\n                    },\n                },\n            }),\n            SessionNode.init({...}),\n        ],\n        isInServerlessEnv: true,\n    };\n};\n\n```\n\nAs seen above, we will be overriding the `emailPasswordSignUpPOST` and `thirdPartySignInUpPOST` APIs such that if a user signs up, we retrieve the Supabase JWT (which we created in the `createNewSession` function) from the user's accessTokenPayload and send a request to Supabase to insert the email-userid mapping.\n\n## Step 7: Retrieving the user's email on the frontend\n\nNow that our backend is setup we can modify our frontend to retrieve the user's email from Supabase.\n\n```tsx\n// pages/index.tsx\n\nimport React, { useState, useEffect } from 'react'\nimport Head from 'next/head'\nimport styles from '../styles/Home.module.css'\nimport ThirdPartyEmailPassword, {\n  ThirdPartyEmailPasswordAuth,\n} from 'supertokens-auth-react/recipe/thirdpartyemailpassword'\nimport dynamic from 'next/dynamic'\nimport { useSessionContext } from 'supertokens-auth-react/recipe/session'\nimport { getSupabase } from '../utils/supabase'\n\nexport default function Home() {\n  return (\n    // We will wrap the ProtectedPage component with ThirdPartyEmailPasswordAuth so only an\n    // authenticated user can access it. This will also allow us to access the users session information\n    // within the component.\n    \u003cThirdPartyEmailPasswordAuth\u003e\n      \u003cProtectedPage /\u003e\n    \u003c/ThirdPartyEmailPasswordAuth\u003e\n  )\n}\n\nfunction ProtectedPage() {\n  // retrieve the authenticated user's accessTokenPayload and userId from the sessionContext\n  const { accessTokenPayload, userId } = useSessionContext()\n\n  if (sessionContext.loading === true) {\n    return null\n  }\n\n  const [userEmail, setEmail] = useState('')\n  useEffect(() =\u003e {\n    async function getUserEmail() {\n      // retrieve the supabase client who's JWT contains users userId, this will be\n      // used by supabase to check that the user can only access table entries which contain their own userId\n      const supabase = getSupabase(accessTokenPayload.supabase_token)\n\n      // retrieve the user's name from the users table whose email matches the email in the JWT\n      const { data } = await supabase.from('users').select('email').eq('user_id', userId)\n\n      if (data.length \u003e 0) {\n        setEmail(data[0].email)\n      }\n    }\n    getUserEmail()\n  }, [])\n\n  return (\n    \u003cdiv className={styles.container}\u003e\n      \u003cHead\u003e\n        \u003ctitle\u003eSuperTokens 💫\u003c/title\u003e\n        \u003clink rel=\"icon\" href=\"/favicon.ico\" /\u003e\n      \u003c/Head\u003e\n\n      \u003cmain className={styles.main}\u003e\n        \u003cp className={styles.description}\u003e\n          You are authenticated with SuperTokens! (UserId: {userId})\n          \u003cbr /\u003e\n          Your email retrieved from Supabase: {userEmail}\n        \u003c/p\u003e\n      \u003c/main\u003e\n    \u003c/div\u003e\n  )\n}\n```\n\nAs seen above we will be using SuperTokens `useSessionContext` hook to retrieve the authenticated user's `userId` and `accessTokenPayload`. Using React's `useEffect` hook we can use the Supabase client to retrieve the user's email from Supabase using the JWT retrieved from the user's `accessTokenPayload` and their `userId`.\n\n## Step 8: Create Policies to enforce Row Level Security for Select and Insert requests\n\nTo enforce Row Level Security for the `Users` table we will need to create policies for Select and Insert requests.\n\nThese polices will retrieve the userId from the JWT and check if it matches the userId in the Supabase table\n\nTo do this we will need a PostgreSQL function to extract the userId from the JWT.\n\nThe payload in the JWT will have the following structure:\n\n```\n// JWT payload\n{\n    userId,\n    exp\n}\n```\n\nTo create the PostgreSQL function, lets navigate back to the Supabase dashboard, select `SQL` from the sidebar menu, and click `New query`. This will create a new query called `new sql snippet`, which will allow us to run any SQL against our Postgres database.\n\nWrite the following and click `Run`.\n\n```sql\ncreate or replace function auth.user_id() returns text as $$\n  select nullif(current_setting('request.jwt.claims', true)::json-\u003e\u003e'userId', '')::text;\n$$ language sql stable;\n```\n\nThis will create a function called `auth.user_id()`, which will inspect the `userId` field of our JWT payload.\n\n### SELECT query policy\n\nOur first policy will check whether the user is the owner of the email.\n\nSelect `Authentication` from the Supabase sidebar menu, click `Policies`, and then `New Policy` on the `Users` table.\n\n![Create new policy](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/supertokens/create_policy.png)\n\nFrom the modal, select `Create a policy from scratch` and add the following.\n\n![Policy settings for SELECT](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/supertokens/policy_config_select.png)\n\nThis policy is calling the PostgreSQL function we just created to get the currently logged in user's ID `auth.user_id()` and checking whether this matches the `user_id` column for the current `email`. If it does, then it will allow the user to select it, otherwise it will continue to deny.\n\nClick `Review` and then `Save policy`.\n\n### INSERT query policy\n\nOur second policy will check whether the `user_id` being inserted is the same as the `userId` in the JWT.\n\nCreate another policy and add the following:\n\n![Policy settings for INSERT](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/supertokens/policy_config_insert.png)\n\nSimilar to the previous policy we are calling the PostgreSQL function we created to get the currently logged in user's ID `auth.user_id()` and check whether this matches the `user_id` column for the row we are trying to insert. If it does, then it will allow the user to insert the row, otherwise it will continue to deny.\n\nClick `Review` and then `Save policy`.\n\n## Step 9: Test your changes\n\nYou can now sign up and you should see the following screen:\n\n![SuperTokens App Authenticated](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/supertokens/supabase_app_authenticated_screen.png)\n\nIf you navigate to your table you should see a new row with the user's `user_id` and `email`.\n\n![Supabase Users table](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/supertokens/table_with_user.png)\n\n## Resources\n\n- [SuperTokens](https://supertokens.com/) official website.\n- [SuperTokens community](https://supertokens.com/discord).\n- [SuperTokens documentation](https://supertokens.com/docs/guides).\n"])</script><script>self.__next_f.push([1,"44:T858,"])</script><script>self.__next_f.push([1,"DBOS provides lightweight durable workflows built on top of Postgres, helping you build highly reliable AI agents, data pipelines, and business applications. Instead of managing your own workflow orchestrator or task queue system, you can use DBOS to add durable workflows and queues to your program in just a few lines of code, entirely backed by your Supabase database.\nHere’s how to get started:\n### 1. Set up a Local Application\n\nIf you haven't already, follow the [DBOS quickstart](https://docs.dbos.dev/quickstart) to set up a DBOS application locally. The rest of this guide will assume you have a local application.\n\n### 2. Connect to Your Supabase Database\n\nNext, open your Supabase dashboard at [`supabase.com/dashboard`](https://supabase.com/dashboard), select a project, and click \"Connect\" to retrieve connection information for your Supabase database.\nYou should see a screen that looks like this, showing the connection string for your database:\n\n![Supabase dashboard showing database connection string](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/dbos/integration-guide-image-two.jpg)\n\nMake sure your connection method is set to \"Direct connection\" (if your database supports it) or to \"Session pooler\".\n\nWhen you are ready, copy the connection string (filling in your Supabase password) from the dashboard and set the `DBOS_SYSTEM_DATABASE_URL` environment variable to it:\n\n```\nexport DBOS_SYSTEM_DATABASE_URL=\"\u003cyour connection string\u003e\"\n```\n\n### 3. Launch Your Application\n\nNow, launch your DBOS application. It should successfully connect to your Supabase database, printing your masked Supabase database URL on startup.\n\nAfter connecting your DBOS application to Supabase, you can use the Supabase console to view your DBOS system tables. Open the \"Table Editor\" tab in the Supabase console. For your schema, select \"dbos\".  You can now see DBOS durably checkpoint your workflows to your Supabase database:\n\n![Supabase database view showing workflows table](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/dbos/integration-guide-image-one.jpg)"])</script><script>self.__next_f.push([1,"45:T447f,"])</script><script>self.__next_f.push([1,"Out of the box Multi-Factor Authentication (MFA). Built specifically for developers and Fraud Ops teams. Implementation in hours, protection for a lifetime.\n\nWith Authsignal's flexible single API and SDK, step-up passwordless authentication challenge flows can be implemented at any stage or action in the customer journey. Drop in our code, select the authentication method(s), upload your branding, and you’re away. With a no-code rules engine, fraud ops teams can focus on creating rules so you can keep building.\n\n## Documentation\n\nThis guide shows how to integrate [Authsignal](https://www.authsignal.com/) with [Next.js](https://nextjs.org/) and [Supabase](https://supabase.com/) in order to add an MFA step after sign-in.\n\nThe user flow is as follows:\n\n1. The user enters their email and password to sign in\n2. If the user has set up MFA, they're prompted to complete an MFA challenge (via Authenticator App) in order to complete sign-in\n3. If the user has not set up MFA, they're signed in immediately and will see a button to set up MFA\n\nThe approach uses a temporary encrypted cookie to ensure that the Supabase auth cookies (`access_token` and `refresh_token`) are only set if the MFA challenge was successful. Session data is encrypted using [@hapi/iron](https://hapi.dev/family/iron).\n\nThe full code version of this example can be found [here](https://github.com/authsignal/supabase-example).\n\nA live demo can be found [here](https://authsignal-supabase-example.vercel.app).\n\n## How it works\n\n1. A sign-in form posts email and password to the Next.js API route `/api/sign-in`\n2. The `signIn` API route calls the Supabase client's `signInWithEmail` method and gets back a session object\n3. The `signIn` API route then calls the Authsignal client's `track` method to determine if an MFA challenge is required\n4. If a challenge is required, the `signIn` API route saves the session object in a temporary encrypted cookie and redirects to Authsignal\n5. Once the challenge is completed, Authsignal redirects back to `/api/callback` which retrieves the session and sets the Supabase auth cookies\n6. The `callback` API route then redirects to the in
