dex page which is protected with Supabase's `withPageAuth` wrapper around `getServerSideProps`\n\n## Step 1: Configuring an Authsignal tenant\n\nGo to the [Authsignal Portal](https://portal.authsignal.com) and create a new project and tenant.\n\nYou will also need to [enable at least one authenticator for your tenant](https://portal.authsignal.com/organisations/tenants/authenticators) - for example Authenticator Apps.\n\nFinally, to configure the sign-in action to always challenge, go [here](https://portal.authsignal.com/actions/signIn/rules) and set the default action outcome to `CHALLENGE` and click save.\n\n![Authsignal settings](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/authsignal/authsignal-settings.png)\n\n## Step 2: Creating a Supabase project\n\nFrom your [Supabase dashboard](https://supabase.com/dashboard/), click `New project`.\n\nEnter a `Name` for your Supabase project and enter or generate a secure `Database Password`, then click `Create new project`.\n\nOnce your project is created go to `Authentication -\u003e Settings -\u003e Auth Providers` and ensure `Enable Email provider` is checked and that `Confirm Email` is unchecked.\n\n![Supabase settings](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/authsignal/supabase-settings.png)\n\n## Step 3: Building a Next.js app\n\nCreate a new Next.js project:\n\n```bash\nnpx create-next-app --typescript supabase-authsignal-example\ncd supabase-authsignal-example\n```\n\nCreate a `.env.local` file and enter the following values:\n\n```sh\nNEXT_PUBLIC_SUPABASE_URL=get-from-supabase-dashboard\nNEXT_PUBLIC_SUPABASE_ANON_KEY=get-from-supabase-dashboard\nAUTHSIGNAL_SECRET=get-from-authsignal-dashboard\nTEMP_TOKEN_SECRET=this-is-a-secret-value-with-at-least-32-characters\n```\n\nSupabase values can be found under `Settings \u003e API` for your project.\n\nAuthsignal values can be found under `Settings \u003e API Keys` for your tenant.\n\n`TEMP_TOKEN_SECRET` is used to encrypt the temporary cookie. Set it to a random 32 character length string.\n\nRestart your Next.js development server to read in the new values from `.env.local`.\n\n```bash\nnpm run dev\n```\n\n## Step 4: Installing dependencies\n\nInstall the Supabase client and Auth helpers for Next.js:\n\n```bash\nnpm install @supabase/supabase-js @supabase/auth-helpers-nextjs\n```\n\nInstall the Authsignal Node.js client:\n\n```bash\nnpm install @authsignal/node\n```\n\nFinally install 2 packages to help encrypt and serialize session data in cookies:\n\n```bash\nnpm install @hapi/iron cookie\nnpm install --save-dev @types/cookie\n```\n\n## Step 5: Initializing the Authsignal client\n\nAdd the following code to `/lib/authsignal.ts`:\n\n```ts\nimport { Authsignal } from '@authsignal/node'\n\nconst secret = process.env.AUTHSIGNAL_SECRET\n\nif (!secret) {\n  throw new Error('AUTHSIGNAL_SECRET is undefined')\n}\n\nconst redirectUrl = 'http://localhost:3000/api/callback'\n\nexport const authsignal = new Authsignal({ secret, redirectUrl })\n```\n\nThe `redirectUrl` here is a Next.js API route which Authsignal will redirect back to after an MFA challenge. We'll implement this below.\n\n## Step 6: Managing session data in cookies\n\nNext we will add some helper functions for managing cookies:\n\n- `setTempCookie` encrypts and serializes the Supabase session data and sets it in a temporary cookie\n- `getSessionFromTempCookie` decrypts and parses this session data back from the cookie\n- `setAuthCookie` sets the Supabase auth cookies (`access_token` and `refresh_token`) and clears the temporary cookie\n\nAdd the following code to `/lib/cookies.ts`:\n\n```ts\nimport Iron from '@hapi/iron'\nimport { Session } from '@supabase/supabase-js'\nimport { parse, serialize } from 'cookie'\nimport { NextApiRequest, NextApiResponse } from 'next'\n\nexport async function setTempCookie(session: Session, res: NextApiResponse) {\n  const token = await Iron.seal(session, TEMP_TOKEN_SECRET, Iron.defaults)\n\n  const cookie = serialize(TEMP_COOKIE, token, {\n    maxAge: session.expires_in,\n    httpOnly: true,\n    secure: process.env.NODE_ENV === 'production',\n    path: '/',\n    sameSite: 'lax',\n  })\n\n  res.setHeader('Set-Cookie', cookie)\n}\n\nexport async function getSessionFromTempCookie(req: NextApiRequest): Promise\u003cSession | undefined\u003e {\n  const cookie = req.headers.cookie as string\n\n  const cookies = parse(cookie ?? '')\n\n  const tempCookie = cookies[TEMP_COOKIE]\n\n  if (!tempCookie) {\n    return undefined\n  }\n\n  const session = await Iron.unseal(tempCookie, TEMP_TOKEN_SECRET, Iron.defaults)\n\n  return session\n}\n\nexport function setAuthCookie(session: Session, res: NextApiResponse) {\n  const { access_token, refresh_token, expires_in } = session\n\n  const authCookies = [\n    { name: ACCESS_TOKEN_COOKIE, value: access_token },\n    refresh_token ? { name: REFRESH_TOKEN_COOKIE, value: refresh_token } : undefined,\n  ]\n    .filter(isDefined)\n    .map(({ name, value }) =\u003e\n      serialize(name, value, {\n        maxAge: expires_in,\n        httpOnly: true,\n        secure: process.env.NODE_ENV === 'production',\n        path: '/',\n        sameSite: 'lax',\n      })\n    )\n\n  // Also clear the temp cookie\n  const updatedCookies = [...authCookies, serialize(TEMP_COOKIE, '', { maxAge: -1, path: '/' })]\n\n  res.setHeader('Set-Cookie', updatedCookies)\n}\n\nconst isDefined = \u003cT\u003e(value: T | undefined): value is T =\u003e !!value\n\nconst TEMP_TOKEN_SECRET = process.env.TEMP_TOKEN_SECRET!\nconst TEMP_COOKIE = 'as-mfa-cookie'\nconst ACCESS_TOKEN_COOKIE = 'sb-access-token'\nconst REFRESH_TOKEN_COOKIE = 'sb-refresh-token'\n```\n\n## Step 7: Building the UI\n\nWe will add some form components for signing in and signing up as well as a basic home page.\n\nAdd the following code to `/pages/sign-up.tsx`:\n\n```ts\nimport Link from 'next/link'\nimport { useRouter } from 'next/router'\n\nexport default function SignUpPage() {\n  const router = useRouter()\n\n  return (\n    \u003cmain\u003e\n      \u003cform\n        onSubmit={async (e) =\u003e {\n          e.preventDefault()\n\n          const target = e.target as typeof e.target \u0026 {\n            email: { value: string }\n            password: { value: string }\n          }\n\n          const email = target.email.value\n          const password = target.password.value\n\n          await fetch('/api/sign-up', {\n            method: 'POST',\n            headers: { 'Content-Type': 'application/json' },\n            body: JSON.stringify({ email, password }),\n          }).then((res) =\u003e res.json())\n\n          router.push('/')\n        }}\n      \u003e\n        \u003clabel htmlFor=\"email\"\u003eEmail\u003c/label\u003e\n        \u003cinput id=\"email\" type=\"email\" name=\"email\" required /\u003e\n        \u003clabel htmlFor=\"password\"\u003ePassword\u003c/label\u003e\n        \u003cinput id=\"password\" type=\"password\" name=\"password\" required /\u003e\n        \u003cbutton type=\"submit\"\u003eSign up\u003c/button\u003e\n      \u003c/form\u003e\n      \u003cdiv\u003e\n        {'Already have an account? '}\n        \u003cLink href=\"sign-in\"\u003e\n          \u003ca\u003eSign in\u003c/a\u003e\n        \u003c/Link\u003e\n      \u003c/div\u003e\n    \u003c/main\u003e\n  )\n}\n```\n\nThen add the following code to `/pages/sign-in.tsx`:\n\n```ts\nimport Link from 'next/link'\nimport { useRouter } from 'next/router'\n\nexport default function SignInPage() {\n  const router = useRouter()\n\n  return (\n    \u003cmain\u003e\n      \u003cform\n        onSubmit={async (e) =\u003e {\n          e.preventDefault()\n\n          const target = e.target as typeof e.target \u0026 {\n            email: { value: string }\n            password: { value: string }\n          }\n\n          const email = target.email.value\n          const password = target.password.value\n\n          const { state, mfaUrl } = await fetch('/api/sign-in', {\n            method: 'POST',\n            headers: { 'Content-Type': 'application/json' },\n            body: JSON.stringify({ email, password }),\n          }).then((res) =\u003e res.json())\n\n          if (state === 'CHALLENGE_REQUIRED') {\n            window.location.href = mfaUrl\n          } else {\n            router.push('/')\n          }\n        }}\n      \u003e\n        \u003clabel htmlFor=\"email\"\u003eEmail\u003c/label\u003e\n        \u003cinput id=\"email\" type=\"email\" name=\"email\" required /\u003e\n        \u003clabel htmlFor=\"password\"\u003ePassword\u003c/label\u003e\n        \u003cinput id=\"password\" type=\"password\" name=\"password\" required /\u003e\n        \u003cbutton type=\"submit\"\u003eSign in\u003c/button\u003e\n      \u003c/form\u003e\n      \u003cdiv\u003e\n        {\"Don't have an account? \"}\n        \u003cLink href=\"sign-up\"\u003e\n          \u003ca\u003eSign up\u003c/a\u003e\n        \u003c/Link\u003e\n      \u003c/div\u003e\n    \u003c/main\u003e\n  )\n}\n```\n\nNow we will use Supabase's `withPageAuth` wrapper around `getServerSideProps` to make the home page require authentication via SSR. Replace the existing code in `/pages/index.tsx` with the following:\n\n```ts\nimport { getUser, User, withPageAuth } from '@supabase/auth-helpers-nextjs'\nimport { GetServerSideProps } from 'next'\nimport { useRouter } from 'next/router'\nimport { authsignal } from '../lib/authsignal'\n\ninterface Props {\n  user: User\n  isEnrolled: boolean\n}\n\nexport const getServerSideProps: GetServerSideProps\u003cProps\u003e = withPageAuth({\n  redirectTo: '/sign-in',\n  async getServerSideProps(ctx) {\n    const { user } = await getUser(ctx)\n\n    const { isEnrolled } = await authsignal.getUser({ userId: user.id })\n\n    return {\n      props: { user, isEnrolled },\n    }\n  },\n})\n\nexport default function HomePage({ user, isEnrolled }: Props) {\n  const router = useRouter()\n\n  return (\n    \u003cmain\u003e\n      \u003csection\u003e\n        \u003cdiv\u003e Signed in as: {user?.email}\u003c/div\u003e\n        \u003cbutton\n          onClick={async (e) =\u003e {\n            e.preventDefault()\n\n            const { mfaUrl } = await fetch('/api/mfa', {\n              method: 'POST',\n              headers: { 'Content-Type': 'application/json' },\n              body: JSON.stringify({ isEnrolled }),\n            }).then((res) =\u003e res.json())\n\n            window.location.href = mfaUrl\n          }}\n        \u003e\n          {isEnrolled ? 'Manage MFA settings' : 'Set up MFA'}\n        \u003c/button\u003e\n        \u003cbutton onClick={() =\u003e router.push('/api/sign-out')}\u003eSign out\u003c/button\u003e\n      \u003c/section\u003e\n    \u003c/main\u003e\n  )\n}\n```\n\nOptional: To make things look a bit nicer, you can add the following to `/styles/globals.css`:\n\n```css\nmain {\n  min-height: 100vh;\n  display: flex;\n  flex: 1;\n  flex-direction: column;\n  justify-content: center;\n  align-items: center;\n}\n\nsection,\nform {\n  display: flex;\n  flex-direction: column;\n  min-width: 300px;\n}\n\nbutton {\n  cursor: pointer;\n  font-weight: 500;\n  line-height: 1;\n  border-radius: 6px;\n  border: none;\n  background-color: #24b47e;\n  color: #fff;\n  padding: 0 15px;\n  height: 40px;\n  margin: 10px 0;\n  transition: background-color 0.15s, color 0.15s;\n}\n\ninput {\n  outline: none;\n  font-family: inherit;\n  font-weight: 400;\n  background-color: #fff;\n  border-radius: 6px;\n  color: #1d1d1d;\n  border: 1px solid #e8e8e8;\n  padding: 0 15px;\n  margin: 5px 0;\n  height: 40px;\n}\n\na {\n  color: #24b47e;\n  cursor: pointer;\n}\n```\n\n## Step 8: Adding the API routes\n\nNow we'll replace the existing api routes in `/pages/api/` with 5 new routes:\n\n- `/sign-in.ts`: handles signing in with Supabase and initiating the MFA challenge with Authsignal\n- `/sign-up.ts`: handles signing up with Supabase\n- `/sign-out.ts`: clears the Supabase auth cookies and signs the user out\n- `/mfa.ts`: handles the user's attempt to set up MFA or to manage their existing MFA settings\n- `/callback.ts`: handles completing the MFA challenge with Authsignal\n\nAdd the following code to `/pages/api/sign-in.ts`:\n\n```ts\nimport { supabaseClient } from '@supabase/auth-helpers-nextjs'\nimport { NextApiRequest, NextApiResponse } from 'next'\nimport { authsignal } from '../../lib/authsignal'\nimport { setAuthCookie, setTempCookie } from '../../lib/cookies'\n\nexport default async function signIn(req: NextApiRequest, res: NextApiResponse) {\n  const { email, password } = req.body\n\n  const { data, error } = await supabaseClient.auth.api.signInWithEmail(email, password)\n\n  if (error || !data?.user) {\n    return res.send({ error })\n  }\n\n  const { state, url: mfaUrl } = await authsignal.track({\n    action: 'signIn',\n    userId: data.user.id,\n  })\n\n  if (state === 'CHALLENGE_REQUIRED') {\n    await setTempCookie(data, res)\n  } else {\n    setAuthCookie(data, res)\n  }\n\n  res.send({ state, mfaUrl })\n}\n```\n\nThen to handle new sign-ups add the following to `/pages/api/sign-up.ts`:\n\n```ts\nimport { supabaseClient } from '@supabase/auth-helpers-nextjs'\nimport { Session } from '@supabase/supabase-js'\nimport { NextApiRequest, NextApiResponse } from 'next'\nimport { setAuthCookie } from '../../lib/cookies'\n\nexport default async function signUp(req: NextApiRequest, res: NextApiResponse) {\n  const { email, password } = req.body\n\n  const { data, error } = await supabaseClient.auth.api.signUpWithEmail(email, password)\n\n  if (error || !isSession(data)) {\n    res.send({ error })\n  } else {\n    setAuthCookie(data, res)\n    res.send({ data })\n  }\n}\n\nconst isSession = (data: any): data is Session =\u003e !!data?.access_token\n```\n\nTo clear the auth cookies on sign-out add the following to `/pages/api/sign-out.ts`:\n\n```ts\nimport { supabaseClient } from '@supabase/auth-helpers-nextjs'\nimport { NextApiRequest, NextApiResponse } from 'next'\n\nexport default async function signOut(req: NextApiRequest, res: NextApiResponse) {\n  supabaseClient.auth.api.deleteAuthCookie(req, res, { redirectTo: '/sign-in' })\n}\n```\n\nTo handle the user's actions to set up MFA or manage their existing MFA settings, add the following to `/pages/api/mfa.ts`:\n\n```ts\nimport { getUser, withApiAuth } from '@supabase/auth-helpers-nextjs'\nimport { NextApiRequest, NextApiResponse } from 'next'\nimport { authsignal } from '../../lib/authsignal'\n\nexport default withApiAuth(async function mfa(req: NextApiRequest, res: NextApiResponse) {\n  if (req.method !== 'POST') {\n    return res.status(405).send({ message: 'Only POST requests allowed' })\n  }\n\n  const { user } = await getUser({ req, res })\n\n  const { isEnrolled } = req.body\n\n  const { url: mfaUrl } = await authsignal.track({\n    action: isEnrolled ? 'manageSettings' : 'enroll',\n    userId: user.id,\n    redirectToSettings: isEnrolled,\n  })\n\n  res.send({ mfaUrl })\n})\n```\n\nBecause the user should be authenticated with Supabase to set up or manage MFA, we can use Supabase's `withApiAuth` wrapper to protect this route.\n\nThe `redirectToSettings` param specifies whether the user should be redirected to the MFA page settings panel after a challenge, rather than redirecting them immediately back to the application.\n\nFinally we need a route to handle the redirect back from Authsignal after an MFA challenge. Add the following to `/pages/api/callback.ts`:\n\n```ts\nimport { NextApiRequest, NextApiResponse } from 'next'\nimport { authsignal } from '../../lib/authsignal'\nimport { getSessionFromTempCookie, setAuthCookie } from '../../lib/cookies'\n\nexport default async function callback(req: NextApiRequest, res: NextApiResponse) {\n  const token = req.query.token as string\n\n  const { success } = await authsignal.validateChallenge({ token })\n\n  if (success) {\n    const session = await getSessionFromTempCookie(req)\n\n    if (session) {\n      setAuthCookie(session, res)\n    }\n  }\n\n  res.redirect('/')\n}\n```\n\nThat's it! You should now be able to sign up a new user and set up MFA.\n\nThen if you sign out, you'll be prompted to complete an MFA challenge when signing back in again.\n\n## Resources\n\n- To learn more about Authsignal take a look at the [API Documentation](https://docs.authsignal.com/).\n- You can customize the look and feel of the Authsignal Prebuilt MFA page [here](https://portal.authsignal.com/organisations/tenants/customizations).\n"])</script><script>self.__next_f.push([1,"46:T2a9e,"])</script><script>self.__next_f.push([1,"# Data Enrichment with Supabase + Parallel\n\nBuild a real-time data enrichment pipeline using [Supabase Edge Functions](https://supabase.com/docs/guides/functions) and [Parallel's Task API](https://docs.parallel.ai/task-api/task-quickstart).\n\nThis cookbook demonstrates how to create a data enrichment experience where users input minimal data (e.g., company names) and get back enriched information automatically.\n\n![Screenshot](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/parallel-company-enrichment/parallel-screenshot.png)\n\n## Why Supabase + Parallel?\n\n| Feature | Benefit |\n|---------|---------|\n| **Zero infrastructure** | Supabase Edge Functions + Parallel = no servers to manage |\n| **Real-time updates** | Supabase Realtime pushes enrichment results to the UI instantly |\n| **Flexible schema** | JSONB storage adapts to any enrichment fields without migrations |\n| **Cost-effective** | Pay only for what you use on both platforms |\n| **Global edge** | Edge Functions run close to users, Parallel handles web research |\n\n## Architecture\n\n```\n┌─────────────┐     ┌─────────────────┐     ┌─────────────────┐     ┌─────────────────┐\n│   Web App   │────▶│  API Routes     │────▶│  Edge Function  │────▶│  Parallel API   │\n│  (Next.js)  │     │  (Next.js)      │     │  (Supabase)     │◀────│  (Task API)     │\n└─────────────┘     └─────────────────┘     └─────────────────┘     └─────────────────┘\n       │                    │                       │                       │\n       │  realtime          │  secret key           │  writes               │ researches\n       ▼                    ▼                       ▼                       ▼\n┌─────────────────────────────────────────────────────────────────────────────────────┐\n│                              Supabase Database                                       │\n│  ┌─────────────┐  ┌──────────────────────────────────────┐                          │\n│  │  companies  │  │  enrichment fields (JSONB)           │                          │\n│  │  - name     │  │  - industry, funding, employees...   │                          │\n│  │  - website  │  │  - custom fields you define          │                          │\n│  │  - status   │  │                                      │                          │\n│  └─────────────┘  └──────────────────────────────────────┘                          │\n└─────────────────────────────────────────────────────────────────────────────────────┘\n```\n\n### How It Works\n\n1. **User submits** a company name (and optional website)\n2. **Frontend** inserts a record with `status: pending`\n3. **Frontend** calls a Next.js API route\n4. **API route** invokes the Edge Function using the secret key (server-side)\n5. **Edge Function** calls Parallel's Task API with a structured output schema\n6. **Parallel** searches the web and returns structured data\n7. **Edge Function** saves results to the database\n8. **Supabase Realtime** pushes the update to the frontend\n9. **UI updates** automatically with enriched data\n\n## Quick Start\n\n### Prerequisites\n\n- Check out the [code for the cookbook](https://github.com/parallel-web/parallel-cookbook/tree/main/typescript-recipes/parallel-supabase-enrichment)\n- [Supabase CLI](https://supabase.com/docs/guides/cli) installed\n- A [Supabase project](https://supabase.com) (free tier works)\n- A [Parallel API key](https://platform.parallel.ai)\n- Node.js 18+\n\n### 1. Clone and Set Up\n\n```bash\n# Navigate to the cookbook\ncd typescript-recipes/parallel-supabase-enrichment\n\n# Link to your Supabase project (config.toml is already provided)\n# Find your project ref in: Dashboard \u003e Project Settings \u003e General \u003e Reference ID\n# Or from your project URL: https://supabase.com/dashboard/project/\u003cproject-ref\u003e\nsupabase link --project-ref your-project-ref\n```\n\n### 2. Create the Database Tables\n\nRun the SQL files in your Supabase SQL Editor (Dashboard \u003e SQL Editor \u003e New Query):\n\n1. Copy and run `sql/01_create_companies.sql` (required)\n2. Copy and run `sql/02_create_enrichment_columns.sql` (optional - for dynamic columns)\n\n### 3. Set Up Secrets\n\n```bash\n# Set your Parallel API key as a secret\nsupabase secrets set PARALLEL_API_KEY=your-parallel-api-key\n```\n\n### 4. Deploy Edge Functions\n\n```bash\nsupabase functions deploy enrich-company\nsupabase functions deploy poll-enrichment\n```\n\n### 5. Set Up the Web App\n\n```bash\ncd web\n\n# Install dependencies\nnpm install\n\n# Create environment file\ncp .env.example .env.local\n```\n\nEdit `.env.local` with your Supabase credentials (Dashboard \u003e Project Settings):\n\n```\n# From Data API \u003e Project URL\nNEXT_PUBLIC_SUPABASE_URL=https://your-project-ref.supabase.co\n# From API Keys \u003e publishable key (client-side)\nNEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=your-publishable-key\n# From API Keys \u003e secret key (server-side only)\nSUPABASE_SECRET_KEY=your-secret-key\n```\n\n### 6. Run the App\n\n```bash\nnpm run dev\n```\n\nOpen http://localhost:3000 and start enriching!\n\n## Project Structure\n\n```\nparallel-supabase-enrichment/\n├── README.md                     # This file\n├── sql/\n│   ├── 01_create_companies.sql   # Main table with enrichment tracking\n│   └── 02_create_enrichment_columns.sql  # (Optional) Dynamic column config\n├── supabase/\n│   ├── config.toml               # Supabase configuration\n│   └── functions/\n│       ├── enrich-company/       # Main enrichment function\n│       │   └── index.ts\n│       └── poll-enrichment/      # Background polling for long tasks\n│           └── index.ts\n└── web/                          # Next.js frontend\n    ├── app/\n    │   ├── api/\n    │   │   ├── enrich/route.ts   # API route to call enrich-company\n    │   │   └── poll/route.ts     # API route to call poll-enrichment\n    │   ├── layout.tsx\n    │   ├── page.tsx              # Main UI\n    │   └── globals.css\n    ├── lib/\n    │   └── supabase.ts           # Supabase client + types\n    ├── package.json\n    └── .env.example\n```\n\n## Customizing Enrichment Fields\n\nThe enrichment schema is defined in the Edge Function. To change what data gets enriched:\n\n\u003e **Important**: When you modify `outputSchema` in the Edge Function, also update `ENRICHMENT_FIELDS` in `web/lib/supabase.ts` to display the new columns in the table.\n\n### Option 1: Static Schema (Simpler)\n\nEdit `supabase/functions/enrich-company/index.ts`:\n\n```typescript\nconst outputSchema = {\n  type: \"object\",\n  properties: {\n    industry: { type: \"string\", description: \"Primary industry\" },\n    employee_count: {\n      type: \"string\",\n      enum: [\"1-10\", \"11-50\", \"51-200\", \"201-500\", \"500+\"],\n      description: \"Company size range\"\n    },\n    headquarters: { type: \"string\", description: \"HQ location (City, Country)\" },\n    // Add your custom fields here\n    ceo_name: { type: \"string\", description: \"Current CEO or founder name\" },\n    tech_stack: { type: \"string\", description: \"Primary technologies used\" },\n  },\n  required: [\"industry\", \"employee_count\", \"headquarters\"],\n};\n```\n\n### Option 2: Dynamic Schema (Advanced)\n\nUse the `enrichment_columns` table to define fields in the database:\n\n```sql\nINSERT INTO enrichment_columns (name, display_name, column_type, description)\nVALUES ('ceo_name', 'CEO Name', 'text', 'The current CEO or chief executive');\n```\n\nThe Edge Function will automatically build the schema from these definitions.\n\n## Configuration\n\n### Parallel Processors\n\nThe Edge Function uses `base-fast` by default. See [processor options](https://docs.parallel.ai/task-api/guides/choose-a-processor) and [pricing](https://docs.parallel.ai/resources/pricing) to choose the right one for your use case.\n\n```typescript\nconst taskRun = await parallel.taskRun.create({\n  processor: \"base\", // Change processor here\n  // ...\n});\n```\n\n### Environment Variables\n\n**Edge Functions** (set via `supabase secrets set`):\n- `PARALLEL_API_KEY` - Your Parallel API key\n\n**Web App** (in `.env.local`):\n- `NEXT_PUBLIC_SUPABASE_URL` - Your Supabase project URL\n- `NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY` - Client-side key for database/realtime\n- `SUPABASE_SECRET_KEY` - Server-side key for calling Edge Functions (never expose to browser)\n\n## Handling Long-Running Tasks\n\nThe Parallel Task API may take longer than the Edge Function timeout (50s) for complex enrichments. This cookbook handles that with a polling pattern:\n\n1. `enrich-company` starts the task and stores the `run_id`\n2. If the task doesn't complete in time, it returns with `status: processing`\n3. `poll-enrichment` runs periodically to check pending tasks\n4. The frontend polls via API route (`/api/poll`) every 10 seconds\n\nFor production, consider using [Supabase Cron](https://supabase.com/docs/guides/functions/schedule-functions) to run `poll-enrichment` automatically instead of client-side polling.\n\n## Troubleshooting\n\n### \"PARALLEL_API_KEY not configured\"\n\n```bash\nsupabase secrets set PARALLEL_API_KEY=your-key\n# Redeploy the function\nsupabase functions deploy enrich-company\n```\n\n### Enrichment stuck on \"processing\"\n\nCheck Edge Function logs in the Supabase Dashboard (Edge Functions \u003e enrich-company \u003e Logs).\n\nOr trigger a manual poll:\n\n```bash\ncurl -X POST https://your-project.supabase.co/functions/v1/poll-enrichment \\\n  -H \"Authorization: Bearer your-secret-key\"\n```\n\n### Real-time updates not working\n\nEnsure the table has realtime enabled:\n\n```sql\nALTER PUBLICATION supabase_realtime ADD TABLE companies;\n```\n\n## Resources\n\n- [Parallel API Documentation](https://docs.parallel.ai)\n- [Parallel Task API Quickstart](https://docs.parallel.ai/task-api/task-quickstart)\n- [Supabase Edge Functions Guide](https://supabase.com/docs/guides/functions)\n- [Supabase Realtime](https://supabase.com/docs/guides/realtime)\n- [parallel-web npm package](https://www.npmjs.com/package/parallel-web)\n\n## License\n\nMIT..."])</script><script>self.__next_f.push([1,"47:T6f8,"])</script><script>self.__next_f.push([1,"Open Source Authentication for Next.js. \n\n#### NOTE\n\nThis adapter is developed by the community and not officially maintained or supported by Supabase. It uses the Supabase Database to store user and session data in a separate `next_auth` schema. It is a standalone Auth server that does not interface with Supabase Auth and therefore provides a different feature set.\n\nIf you’re looking for an officially maintained Auth server with additional features like [built-in email server](https://supabase.com/docs/guides/auth/auth-email#configure-email-settings?utm_source=next-auth-docs\u0026medium=referral\u0026campaign=next-auth), [phone auth](https://supabase.com/docs/guides/auth/auth-twilio?utm_source=next-auth-docs\u0026medium=referral\u0026campaign=next-auth), and [Multi Factor Authentication (MFA / 2FA)](https://supabase.com/contact/mfa?utm_source=next-auth-docs\u0026medium=referral\u0026campaign=next-auth), please use [Supabase Auth](https://supabase.com/auth) with the [Auth Helpers for Next.js](https://supabase.com/docs/guides/auth/auth-helpers/nextjs?utm_source=next-auth-docs\u0026medium=referral\u0026campaign=next-auth).\n\n#### Easy\n\n- Built in support for popular services (Google, Facebook, Auth0, Apple…). \n- Built in email / passwordless / magic link. Use with any username / password store. \n- Use with OAuth 1.0 \u0026 2.0 services\n\n#### Flexible\n\n- Built for Serverless, runs anywhere. \n- Works with your [Supabase Database](https://next-auth.js.org/adapters/supabase). \n- User and session data is stored in a separate `next_auth` schema within your own database.\n- Secure web pages and API routes.\n\n#### Secure\n\n- Signed, prefixed, server-only cookies\n- HTTP POST + CSRF Token validation\n- JWT with JWS / JWE / JWK\n- Tab syncing, auto-revalidation, keepalives\n- Doesn't rely on client side JavaScript"])</script><script>self.__next_f.push([1,"48:T2be4,"])</script><script>self.__next_f.push([1,"# **Connecting Supabase to Zapier**\n\n**Zapier** is a powerhouse in automation that effortlessly connects different platforms — Supabase included. This post will show you how to connect your Supabase PostgreSQL instance with Zapier.\n\nIt will emphasize security practices and highlight Supabase features that will help you manage your integration. Additionally, it addresses Zapier's limitations and suggests alternatives to overcome them.\n\n# **Walkthrough**\n\nThis guide will show you how to send emails when database events occur, but it can be generalized to work with any Zapier connection.\n\n## **Database Set up**\n\n### Create a user_profile table:\n\nIn your project’s [SQL Editor](https://supabase.com/dashboard/project/_/sql/new), execute the below query. This will be used as the example table for the walkthrough.\n\n```sql\ncreate table \"products\" (\n\t\"product_id\" serial primary key,\n\t\"product_name\" varchar(512) not null,\n\t\"price\" decimal(10, 2) not null,\n\t\"description\" text,\n\t\"stock_quantity\" INT DEFAULT 0\n);\n```\n\n### Insert some items into your product table:\n\n```sql\ninsert into \"products\" (\n\tproduct_name,\n\tprice,\n\tdescription,\n\tstock_quantity\n)\nvalues\n('Pokeball', 4.99, 'Basic Poké Ball for catching Pokémon.', 100),\n('Great Ball', 7.99, 'Better than a Poké Ball, higher catch rate.', 75),\n('Ultra Ball', 12.99, 'High-performance ball with excellent catch rate.', 10);\n```\n\nYou should be able to see your newly created table in your [Dashboard’s Table Editor](https://supabase.com/dashboard/project/_/editor)\n\n![Dashboard Table Editor](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/zapier/first_image.png)\n\n## **Zapier Triggers and Actions:**\n\nDepending on your settings, Zapier will connect to your database every 2 to 15 minutes to observe changes. When information is added or updated in PostgreSQL, Zapier can initiate external events, like sending an email.\n\nHere are the types of PostgreSQL events that Zapier can respond to:\n\n![Zapier trigger events](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/zapier/second_image.png)\n\nUnfortunately, at the time of writing, Zapier is unable to respond to destructive events, such as deleting a row or dropping a table. Likewise, when an external event occurs, such as a change in a Google Spreadsheet, Zapier can only update, insert, or read rows within PostgreSQL.\n\n![PostgreSQL responses to external events](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/zapier/thrid_image.png)\n\nZapier can essentially respond to any update or creation event, but it is incapable of observing delete or drop events in PostgreSQL. Don’t worry! This tutorial will offer alternatives to circumvent these limitations.\n\n## **Creating a Custom Zapier User:**\n\n**Best practice** demands that you create a new PostgreSQL user for Zapier. In the worst-case scenario where your Zapier account gets compromised, you want to have user restrictions against the custom user to protect your data.\n\n### Create a “zapier” User in the [SQL Editor](https://supabase.com/dashboard/project/_/sql/new):\n\ncreate user \"zapier\" with a “super secret password”;\n\n```sql\nCREATE USER \"zapier\" WITH PASSWORD '\u003cnew password\u003e';\n```\n\nIn the [Dashboard’s Database section under roles](https://supabase.com/dashboard/project/_/database/roles), you should be able to see your new user.\n\n![new role in Dashboard](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/zapier/fourth_image.png)\n\nAll new database users are capable of seeing what database objects exist, such as tables and schemas, but they are unable to look at their data or definitions, nor are they able to call commands, such as SELECT or DELETE. You will need to explicitly grant the necessary privileges to your new “zapier” user. Here is a visual of all possible user privileges from the PostgreSQL [documentation](https://www.postgresql.org/docs/current/ddl-priv.html).\n\n![PostgreSQL database object priveleges](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/zapier/fifth_image.png)\n\nYou want to give your “zapier” user the bare minimum of necessary privileges. In this example, it will only need read access to the `products` table.\n\n### Grant the Below Privileges to Your “zapier” User:\n\n```sql\n-- optional if the table is in the “public” schema\ngrant usage on schema public to zapier;\n\n-- Grant SELECT privilege on the table\ngrant select on table products to “zapier”;\n```\n\nIf you enabled RLS for your table, you will also need to create policies for `zapier`.\n\n```sql\ncreate policy \"zapier can read from products table\"\non public.products\nfor select\nto \"zapier\"\nusing (\n\ttrue\n);\n```\n\nWith the following privileges set, you can connect to Zapier.\n\n## **Configuring your Zap:**\n\n### In Zapier, Create a New _[Zap](https://zapier.com/app/zaps):_\n\n![Zapier entry image](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/zapier/sixth_image.png)\n\n### Select PostgreSQL as Your Trigger:\n\n![PostgreSQL trigger option in Zapier](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/zapier/seventh_image.png)\n\n### Connect PostgreSQL to Zapier:\n\nYou will be prompted to connect your PostgreSQL instance to Zapier. You will need the following credentials:\n\n- Host\n- Port\n- Database\n- Schema\n- Username\n- Password\n- SSL Certificate\n\nYou can find your host, port, and database in your [Dashboard’s Database Settings](https://supabase.com/dashboard/project/_/settings/database):\n\n![Screenshot 2024-02-11 at 11.28.07 PM.png](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/zapier/eighth_image.png)\n\nYou can enter your `zapier.\u003cproject id\u003e` as your user and the password you created earlier in the tutorial.\n\nFurther down in the [Dashboard’s Database Settings](https://supabase.com/dashboard/project/_/settings/database), you will see the option to download an SSL certificate. This certificate is necessary to prevent snooping and man-in-the-middle attacks.\n\n![Dashboard's SSL certiciate](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/zapier/ninth_image.png)\n\nAfter connecting your instance, Zapier will allow you to define the event that triggers your Zap.\n\n### Choose Your Trigger Event (Select _Custom Query):_\n\n[Possible PostgreSQL/Zapier trigger events](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/zapier/tenth_image.png)\n\nIt will prompt you to insert a trigger query.\n\n### Insert the Following SQL:\n\n```sql\nselect * from \"products\" where \"stock_quantity\" \u003c= 10;\n```\n\n![Query in Zapier](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/zapier/eleventh_image.png)\n\nFinally, it will ask you to perform a test using a row it received from your table. The only row that should have returned should be for the “Ultra Ball” product.\n\n### Select a Product and go to the Next Step:\n\n![Selecting a prow from product's table](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/zapier/twelfth_image.png)\n\nYou should be prompted to pick an application for an event to occur in after a trigger happens.\n\n### Select Gmail for the _App_ and _Send Email_ for the _Event:_\n\n![Selecting Event](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/zapier/thirteenth_image.png)\n\n### Connect Your Gmail Account to Zapier:\n\nFinally, it will ask you to compose an email with the values from your PostgreSQL table. I chose to make the below message, but you can format it however you want.\n\n### Format Your Message:\n\n![Formatting Message](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/zapier/fourthteenth_image.png)\n\n**Viola!** You can now run a test in Zapier and publish your Zap. Depending on where you sent the test email, you may receive a message like the following:\n\n![email from zapier](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/zapier/fifteenth_image.png)\n\nIn your [Dashboard’s Postgres Logs](https://supabase.com/dashboard/project/wavwvitxkgeviubqugal/logs/postgres-logs?s=zapier), you should be able to see when Zapier connects:\n\n![Viewing Zapier connection message](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/zapier/sixteenth_image.png)\n\n## **Clean up**\n\nIn case you want to drop your “zapier” user, you can do so with the following queries:\n\n```sql\nrevoke select on table \"products\" from \"zapier\";\ndrop user \"zapier\";\n```\n\n## **The Limitations of Zapier:**\n\n## Non-Destructive Observations and Actions Only:\n\nAs discussed earlier, Zapier is only capable of monitoring non-destructive actions. It can observe when rows are updated, or when columns or tables are created, but it is unable to see when they’re deleted/dropped. Similarly, Zapier cannot be used to destroy objects within your database.\n\n## Limited Polling Frequency:\n\nAnother concern is how frequently Zapier makes observations. Within the advanced settings, you can configure Zapier to observe your database as frequently as every 2 minutes, or as infrequently as every 15. Many users, though, need a broader window of observation.\n\n## Max Observable Rows:\n\n[Zapier](https://help.zapier.com/hc/en-us/articles/8496037193997-Common-Problems-with-PostgreSQL#some-new-rows-didn-t-trigger-my-zap-0-1) [is capable of observing only the 50 most recently created rows when using the \"New Row\" trigger.](https://help.zapier.com/hc/en-us/articles/8496037193997-Common-Problems-with-PostgreSQL#some-new-rows-didn-t-trigger-my-zap-0-1) So, if more than 50 rows are added in a polling interval, some data will be ignored.\n\n# **Alternatives to Zapier:**\n\nThe value of Zapier is that it can bridge together practically any service, making your life as a developer relatively simple. Even with its limitations, it is a robust and reliable solution. However, other integrations are available that may be more suitable for your workload.\n\n[n8n](https://supabase.com/partners/integrations/n8n), like Zapier, offers simple, no-code connectors (760 to be exact), but it is open source and can be self-hosted.\n\nOther workflow automation alternatives that have partnered with Supabase include [Sequin.io](https://supabase.com/partners/integrations/sequin_io) and [Brackets](https://supabase.com/partners/integrations/bracket).\n\nIf you just need to trigger outside services when database events occur, you could also leverage [Supabase Webhooks](https://supabase.com/docs/guides/database/webhooks)! If the requests need to be scheduled, then this could be implemented natively with only PostgreSQL through the [pg_cron extension](https://supabase.com/docs/guides/database/extensions/pg_cron) in tandem with either the [pg_net](https://supabase.com/docs/guides/database/extensions/pg_net) or [http](https://supabase.com/docs/guides/database/extensions/http) extensions.\n\n## **Conclusion**\n\nIn this walkthrough, we learned how to connect Zapier and Supabase, but also about the alternative solutions that may meet our integration needs\n"])</script><script>self.__next_f.push([1,"49:T1d06,"])</script><script>self.__next_f.push([1,"[FlutterFlow](https://flutterflow.io/) is a low-code builder for developing native mobile and web applications using Flutter. You can use the simple drag-and-drop interface to build your app faster than traditional development, and create designs in seconds with AI-powered assistance.\n\n## Documentation\n\nThis guide gives you a quick overview of implementing basic CRUD operations using FlutterFlow and Supabase. You can find the full docs on FlutterFlow and Supabase here:\n\n- [docs.flutterflow.io/integrations/database/supabase/setup](https://docs.flutterflow.io/integrations/supabase/setup/)\n- [docs.flutterflow.io/integrations/database/supabase/database-actions](https://docs.flutterflow.io/integrations/database/supabase/database-actions/)\n\n## Step 1: Connect FlutterFlow to Supabase\n\nBefore we dive into the code, this guide assumes that you have the following ready:\n\n- [Supabase](https://database.new/) project created\n- Have setup tables in your Supabase project\n- [FlutterFlow](https://app.flutterflow.io/) project created\n\nYou can then connect your Supabase project to your FlutterFlow project with the following steps:\n\n1. In your Supabase project, navigate to Project Settings \u003e API. Copy the Project URL.\n2. Return to FlutterFlow, navigate to Settings and Integrations \u003e Integrations \u003e Supabase. Tap Connect to Supabase and log in to Supabase.\n3. Select an existing Supabase project to connect to.\n4. Click on the Get Schema button. This will show the list of all tables with their schema (structure) created in Supabase.\n\n\u003cdiv className=\"video-container\"\u003e\n  \u003ciframe\n    src=\"https://www.youtube-nocookie.com/embed/T0O2TT2Q2L8\"\n    frameBorder=\"1\"\n    allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\"\n    allowFullScreen\n  \u003e\u003c/iframe\u003e\n\u003c/div\u003e\n\n## Step 2: Inserting rows\n\nGo to your project page on FlutterFlow and follow the steps below to define the Action to any widget.\n\n1. Select the Widget (e.g., `Button`) on which you want to define the action.\n2. Select Actions from the Properties panel (the right menu), and click Open. This will open an Action flow Editor in a new popup window.\n   1. Click on + Add Action.\n   2. On the right side, search and select the Supabase \u003e Insert Row action.\n   3. Set the Table to your table name (e.g., assignments).\n   4. Under the Set Fields section, click on the + Add Field button.\n   5. Click on the Field name and scroll down to find the Value Source dropdown and change it to From Variable.\n   6. Click on UNSET and select Widget State \u003e Name of the TextField.\n   7. Similarly, add the field for the other UI elements.\n\n\u003cdiv className=\"video-container\"\u003e\n  \u003ciframe\n    src=\"https://www.youtube-nocookie.com/embed/q57npcXaa54\"\n    frameBorder=\"1\"\n    allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\"\n    allowFullScreen\n  \u003e\u003c/iframe\u003e\n\u003c/div\u003e\n\n## Step 3: Selecting and displaying rows\n\nTo query a Supabase table on a `ListView` or `Column`:\n\n1. Select the `ListView`/`Column` widget.\n2. Select Backend Query from the properties panel (the right menu), and click Add Backend Query.\n3. Set the Query Type to Supabase Query.\n4. Select your Table from the dropdown list\n5. Set the Query Type to List of Rows.\n6. Optional: If you want to display the limited result, say, for example, you have thousands of entries, but you want to display only 100, you can specify the limit.\n7. Confirm in the ‘Create Backend Query’ dialog\n8. Populate the list item data.\n\n\u003cdiv className=\"video-container\"\u003e\n  \u003ciframe\n    src=\"https://www.youtube-nocookie.com/embed/pixdSchwbgk\"\n    frameBorder=\"1\"\n    allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\"\n    allowFullScreen\n  \u003e\u003c/iframe\u003e\n\u003c/div\u003e\n\n## Step 4: Updating rows\n\nGo to your project page on FlutterFlow and follow the steps below to define the Action to any widget.\n\n1. Select the Widget (e.g., Button) on which you want to define the action.\n2. Select Actions from the Properties panel (the right menu), and click Open. This will open an Action flow Editor in a new popup window.\n   1. Click on + Add Action.\n   2. On the right side, search and select the Supabase \u003e Update Row action.\n   3. Set the Table to your table name (e.g., assignments).\n   4. Optional: If you want to get the rows after the update is finished, enable the Return Matching Rows option.\n   5. Now, you must set the row you want to update. Usually, this is done by finding a row in a table that matches the current row ID. To do so, click + Add Filter button inside the Matching Rows section.\n      1. Set the Field Name to the field that contains the IDs. Typically, this is the id column.\n      2. Set the Relation to Equal To because you want to find a row with the exact id.\n      3. Into the Value Source, you can select the From Variable and provide the id of the row for which you just updated values in the UI.\n   6. Under the Set Fields section, click on the + Add Field button.\n   7. Click on the field name.\n   8. Scroll down to find the Value Source dropdown and change it to From Variable.\n   9. Click on UNSET and select Widget State \u003e Name of the TextField.\n   10. Similarly, add the field for the other UI elements.\n\n\u003cdiv className=\"video-container\"\u003e\n  \u003ciframe\n    src=\"https://www.youtube-nocookie.com/embed/LYcfi8J0Epk\"\n    frameBorder=\"1\"\n    allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\"\n    allowFullScreen\n  \u003e\u003c/iframe\u003e\n\u003c/div\u003e\n\n## Step 5: Deleting rows\n\nGo to your project page on FlutterFlow and follow the steps below to define the Action to any widget.\n\n1. Select the Widget (e.g., Button) on which you want to define the action.\n2. Select Actions from the Properties panel (the right menu), and click Open. This will open an Action flow Editor in a new popup window.\n   1. Click on + Add Action.\n   2. On the right side, search and select the Supabase -\u003e Delete Row action.\n   3. Set the Table to your table name (e.g., assignments).\n   4. Optional: Later, if you want to know which rows were deleted from a table, enable the Return Matching Rows option.\n   5. Now, you must set the row you want to delete. Usually, this is done by finding a row in a table that matches the current row ID. To do so, click + Add Filter button inside the Matching Rows section.\n      1. Set the Field Name to the field that contains the IDs. Typically, this is the id column.\n      2. Set the Relation to Equal To because you want to find a row with the exact id.\n      3. Into the Value Source, you can select the From Variable and provide the id of the row you want to delete.\n\n\u003cdiv className=\"video-container\"\u003e\n  \u003ciframe\n    src=\"https://www.youtube-nocookie.com/embed/pEvkGv0vvIo\"\n    frameBorder=\"1\"\n    allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\"\n    allowFullScreen\n  \u003e\u003c/iframe\u003e\n\u003c/div\u003e\n\n## Resources\n\nYou can find more detailed guides on FlutterFlow’s docs.\n\n- [FlutterFlow Supabase available actions](https://docs.flutterflow.io/integrations/database/supabase/database-actions/#types-of-supabase-database-actions)\n- [Retrieving Data from Supabase on FlutterFlow](https://docs.flutterflow.io/integrations/database/supabase/database-actions/#query-rows-action)\n- [Adding data to Supabase DB from FlutterFlow](https://docs.flutterflow.io/integrations/database/supabase/database-actions/#insert-row-action)\n"])</script><script>self.__next_f.push([1,"4a:T52a,"])</script><script>self.__next_f.push([1,"[Amazon S3 Vectors](https://aws.amazon.com/s3/features/vectors/) is the first cloud object storage with native support for storing and querying vectors at scale. It delivers purpose-built, cost-optimized vector storage for AI agents, RAG, inference, and semantic search, supporting up to 2 billion vectors per index with sub-100ms query latency and up to 90% cost reduction compared to dedicated vector databases.\n\nThe S3 Vectors Wrapper brings your vector indexes into Postgres as queryable foreign tables. Insert, query, and delete vectors with plain SQL, perform approximate nearest neighbor (ANN) similarity search using the `\u003c=\u003e` operator, and filter results by metadata. Works with Supabase Vault for secure credential management and uses the same two-secret pattern as the S3 and Iceberg wrappers.\n\n### Supported Operations\n\n| Object | Select | Insert | Update | Delete |\n| --- | --- | --- | --- | --- |\n| Vector Indexes | ✅ | ✅ |  | ✅ |\n\n### Supported Data Types\n\n| Postgres Type | S3 Vectors Type |\n| --- | --- |\n| text | String |\n| boolean | Boolean |\n| smallint | Int16 |\n| integer | Int32 |\n| bigint | Int64 |\n| real | Float32 |\n| double precision | Float64 |\n| jsonb | JSON object |\n| s3vec | Float32 array (vector) |\n\n### Resources\n\n- [supabase/wrappers on GitHub](https://github.com/supabase/wrappers)"])</script><script>self.__next_f.push([1,"4b:Td6d,"])</script><script>self.__next_f.push([1,"Reading EXPLAIN ANALYZE output can be tough.\n\nEven if you know how, Postgres includes so much useful information, it is easy to miss something important. And for queries that do a lot, the plans are even more useful-yet-time-consuming.\n\npgMustard speeds up your journey from knowing which query is a problem to working out what can be done about it.\n\n## Documentation\n\nThis guide explains how to troubleshoot slow queries on Supabase using `explain` and pgMustard.\n\n[pgMustard](https://pgmustard.com/) is a visualization tool for [`explain analyze`](https://www.postgresql.org/docs/current/using-explain.html#USING-EXPLAIN-ANALYZE) that also gives performance tips.\n\n## Step 1: Get the query plan from Supabase\n\nUse `explain analyze` to get a query plan from Postgres. This will run the query behind the scenes, so be careful with data modification queries.\n\npgMustard requires plans to be in json format, and the buffers, verbose, and settings parameters allow it to give better tips.\n\nSo a good prefix for your query would be:\n\n```jsx\nexplain (analyze, format json, buffers, verbose, settings)\n```\n\nRun the query, and copy the output.\n\n![01-supabase-run-query](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/pgmustard/01-supabase-run-query.png)\n\nIf you’re using the Supabase SQL Editor, this is easily copied from the cell titled `QUERY PLAN`, as seen above.\n\nIf you have any trouble, check out pgMustard’s guide for [getting a query plan](https://www.pgmustard.com/getting-a-query-plan).\n\n## Step 2: Paste the query plan into pgMustard\n\nPaste the json output into pgMustard and press Submit.\n\n![02-paste-plan-pgmustard](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/pgmustard/02-paste-plan-pgmustard.png)\n\n## Step 3: Look through the top tips and slowest operations\n\nReview the top tips in pgMustard. These are scored on a scale of 0 to 5 stars, based on how much time-saving potential they have (5 stars meaning lots of potential).\n\n![03-review-tips-pgmustard](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/pgmustard/03-review-tips-pgmustard.png)\n\nClick one of the tips, or one of the operations, to see more information.\n\n![04-click-tip-pgmustard](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/pgmustard/04-click-tip-pgmustard.png)\n\n## Step 4: Consider your options\n\nIf you get some promising suggestions, you may wish to explore them.\n\nIf you don’t get any tips, your query might be quite fast for the amount of work it’s doing.\n\nFor the example we saw in Step 3, let's try adding an index on the `customer_name` field in Supabase.\n\n![05-create-index-supabase](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/pgmustard/05-create-index-supabase.png)\n\nGoing through Steps 1-3 again, we now get an efficient index scan, that will scale nicely as our data grows.\n\n![06-check-pgmustard](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/pgmustard/06-check-pgmustard.png)\n\nWe could look into why Postgres isn’t choosing to do an index-only scan here, but pgMustard is letting us know that it doesn’t think we’ll gain much by doing so, by scoring the tip 0.3 out of 5.\n\n## Resources\n\n- [pgMustard](https://www.pgmustard.com) official website.\n- [pgMustard explain glossary](https://www.pgmustard.com/docs/explain).\n"])</script><script>self.__next_f.push([1,"4c:T1bc5,"])</script><script>self.__next_f.push([1,"Keyri is an authentication company, providing customers with a simple and secure form of passwordless MFA. Our platform transforms every login into a one-step biometrics-based process that provides a seamless user experience while strengthening account security. Users simply scan a QR code on your login page with their smartphone and pass biometrics in your mobile app to log into your web app.\n\nIncorporating Keyri QR login into your Supabase-based authentication system is a matter of sending the user's `refreshToken` from your mobile app to your web app via the Keyri mobile SDK and web Widget. On the mobile side, just load the `refreshToken` string as the payload into the Keyri method you're using in your app. On the web side, extract the refreshToken string from the payload that the Widget outputs and load it into the setSession method provided by the Supabase JS SDK.\n\n## Documentation\n\nKeyri can be used to incorporate sign-in-with-QR functionality into your Supabase app, allowing users to scan a QR code on your web app with your mobile app and be instantly logged into the web app without having to input any credentials.\n\nConfiguration is split into Web and Mobile components. On web, the Keyri QR Widget needs to be installed along with an event listener, and in your mobile app, install the Keyri SDK and pass into it the user's refresh token when sign-in-with-QR is initiated. When the refresh token lands in your web app, it's passed into Supabase's `setSession()` method.\n\n# Sign up for Keyri\n\nFirst make a free account on the Keyri dashboard ([https://app.keyri.com](https://app.keyri.com)). On Add Your Application, set a name and input the domain on which your app will eventually be deployed. You can create multiple application in Keyri to account for your development, staging, and production environments\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/keyri/HvTIja3KfgKUIMiNVKAqP_screen-shot-2022-10-13-at-21524-pm.png)\n\nNote your application key from the Keys and Credentials section - this will be used in the Mobile portion of the implementation\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/keyri/KnD6LkWs-PUDtTS1sT9Rz_screen-shot-2022-10-13-at-21746-pm.png)\n\n# Web\n\n\u003cdiv className=\"video-container\"\u003e\n  \u003ciframe\n    src=\"https://www.youtube-nocookie.com/embed/jrjrcpc2PFQ\"\n    frameBorder=\"1\"\n    allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\"\n    allowFullScreen\n  \u003e\u003c/iframe\u003e\n\u003c/div\u003e\n\nFor your web app, first download KeyriQR.html (available [here](https://raw.githubusercontent.com/Keyri-Co/library-keyri-connect/main/KeyriQR.html)) and save it to a public directory.\n\nNext, embed KeyriQR.html in your login page as an iFrame within the desired div. This serves as the widget that displays the dynamic QR code and connects with the Keyri API.\n\n```html\n\u003cdiv\u003e\n    \u003ciframe\n        title='KeyriQR'\n        src='/KeyriQR.html'\n        id='qr-frame'\n        height='300'\n        width='300'\n        scrolling='no'\n        style={{ border: 'solid 5px white' }}\n      \u003e\u003c/iframe\u003e\n\u003c/div\u003e\n```\n\nNext, for the same login view, set up an event listener to pick up the session token that the iFrame emits when the QR code is scanned by your app.\n\n```javascript\nuseEffect(() =\u003e {\n    window.addEventListener('message', async (evt) =\u003e {\n      if (evt.data.keyri \u0026\u0026 evt.data.data \u0026\u0026 document.location.origin == evt.origin) {\n        const { data } = evt;\n        if (!data.error) {\n          let refresh_token = JSON.parse(data.data).refreshToken;\n          await handleQrLogin(refresh_token);\n        } else if (data.error) {\n          console.log(`Keyri error: ${data.message}`);\n        }\n      }\n});\n```\n\nThat's it!\n\n# Mobile\n\n\u003cdiv className=\"video-container\"\u003e\n  \u003ciframe\n    src=\"https://www.youtube-nocookie.com/embed/oGMsSKyh6tc\"\n    frameBorder=\"1\"\n    allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\"\n    allowFullScreen\n  \u003e\u003c/iframe\u003e\n\u003c/div\u003e\n\n### Install Flutter\n\nFirst, install the Flutter SDK, found at flutter.dev\n\nMake sure to add Flutter to your PATH, for example:\u0026#x20;\n\n```shell\nexport PATH=\"$PATH:`pwd`/flutter/bin\"\n```\n\n### Apple - initial setup\n\nDownload the latest version of Xcode from the Mac App Store. Make sure the Xcode provided simulator is using a 64-bit device (iPhone 5s or later). You can check the device by viewing the settings in the simulator’s **Hardware \u003e Device** or **File \u003e Open Simulator** menus.\n\n### Android - initial setup\n\nDownload the latest version of [Android Studio](https://developer.android.com/studio). Install Android SDK and needed emulator(s).\n\n### Create Project\n\nRun this command in your terminal/shell at the desired location for your new project\n\n```shell\n$ flutter create my_app\n```\n\nYou can then CD into the new directory, and run the test app with\u0026#x20;\n\n```shell\nflutter run\n```\n\nThis is a good test - if things are configured correctly so far you should see the default Flutter test app deployed.\n\n### Add dependencies (Keyri and Supabase)\n\nOpen your Pubspec.yaml file, which should be at the top level directory in your new project\n\nAdd Keyri and Supabase under **dependencies**\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/keyri/jlAfOTEchuZpBq8TeXhJZ_screen-shot-2022-09-29-at-060908.png)\n\nOne can now access Supabase and Keyri sdks in their Flutter code\n\n### Utilize the two together\n\n1.  Make a request to Supabase to authenticate the user\n2.  Parse the response to extract the token\n3.  Authenticate using Keyri\n    1.  Below, we show how to utilize the EasyKeyriAuth function, which takes the user through scanning the code, creating the session, displaying the confirmation screen, and finalizing the payload transmission\n        - Note - you can find your App Key in the Keyri Developer Portal​\n    2.  Alternatively, intermediate functions in the Keyri SDK, discussed in the mobile docs, can provide control over displaying a custom QR Scanner and/or Confirmation screen\n\n```kotlin\n// Sign in user with email and password\n// Alternatively one can utilize the Supabase API to accomplish the same thing\nfinal response = await client.auth.signIn(email: 'email', password: 'password');\nif (response.error != null) {\n  // Error\n    print('Error: ${response.error?.message}');\n} else {\n    // Success\n    final session = response.data;\n    // This is the payload that needs to be send through Keyri\n    final refreshToken = session.refreshToken\n    // EasyKeyriAuth guides the user through scanning and parsing the QR, confirming the session, and configuring the payload\n    // One can also use the initiateQRSession method to use the Keyri Scanner with a custom Confirmation screen\n    // Or the ProcessLink method if you have your own scanner or are using deep linking\n    await keyri\n        .easyKeyriAuth([App Key],\n            '{\"refreshToken\":\"$refreshToken\"}', [email])\n        .then((authResult) =\u003e _onAuthResult(authResult))\n        .catchError((error, stackTrace) =\u003e _onError(error));\n}\n```\n"])</script><script>self.__next_f.push([1,"4d:T481,"])</script><script>self.__next_f.push([1,"[RxDB](https://rxdb.info/) is a local-first database for JavaScript applications that stores and queries data directly on the client. It provides a reactive API for instantly updating the UI as data changes, enabling smooth, real-time experiences without waiting for network responses. RxDB works across browsers, mobile apps, and desktop environments, giving developers a unified local database layer for modern applications.\n\nThe RxDB Supabase plugin connects client-side RxDB databases directly to Supabase’s managed Postgres servers. It synchronizes data continuously between local clients and Supabase, ensuring that every change made offline or online is replicated across devices in real time. The plugin integrates seamlessly with Supabase Auth, Realtime, and Row Level Security, so user-specific permissions and live updates work out of the box. Conflict resolution and sync logic are handled automatically by RxDB, allowing developers to focus on building product features rather than managing complex data flows.\n\n[Start building local-first, reactive applications today with RxDB and Supabase](https://rxdb.info/replication-supabase.html)."])</script><script>self.__next_f.push([1,"4e:T365a,"])</script><script>self.__next_f.push([1,"OneSignal is a tool that allows you to send messages across different channels such as the following to keep your users engaged.\n\n- Push notifications\n- SMS\n- Emails\n- In-app notifications\n\nCombined with Supabase Database Webhooks and you can provide realtime cloud messaging experience to your users.\n\nYou can get started with OneSignal and Supabase [here](https://supabase.com/docs/guides/integrations/onesignal).\n\n## Documentation\n\n[OneSignal](https://onesignal.com/) is a tool that allows you to send messages across different channels such as the following to keep your users engaged.\n\n- Push notifications\n- SMS\n- Emails\n- In-app notifications\n\nHere is William giving us the overview of how OneSignal can work with Supabase to send notifications to your users.\n\n\u003cdiv className=\"video-container\"\u003e\n  \u003ciframe\n    src=\"https://www.youtube-nocookie.com/embed/mw0DLwItue4\"\n    frameBorder=\"1\"\n    allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\"\n    allowFullScreen\n  \u003e\u003c/iframe\u003e\n\u003c/div\u003e\n\nIn this guide, we will build a similar app and steps you through how you can integrate OneSignal with Supabase to create a seamless cloud messaging experience for your users using Database webhooks and edge functions through a simple Next.js application.\n\n![Entity Diagram](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/onesignal/diagram.png)\n\nWe will create a simple ordering app and use Supabase Database Webhooks in conjunction with Edge Function to provide a real-time push notification experience.\n\nYou can find the complete example app along with the edge functions code to send the notifications [here](https://github.com/supabase-community/onesignal).\n\n![Ordering app UI](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/onesignal/app-ui.png)\n\n## Step 1: Getting started\n\nBefore we dive into the code, this guide assumes that you have the following ready\n\n- [Supabase](https://supabase.com/) project created\n- [OneSignal](https://onesignal.com/) app created\n- [Supabase CLI](https://supabase.com/docs/guides/cli) installed on your machine\n\nLet’s create a Next.js app with tailwind CSS pre-installed\n\n```bash\nnpx create-next-app -e with-tailwindcss --ts\n```\n\nWe will then install the Supabase and OneSignal SDK.\n\n```bash\nnpm i @supabase/supabase-js\nnpm i react-onesignal\n```\n\nAfter that, follow the instructions [here](https://documentation.onesignal.com/docs/web-push-custom-code-setup) to set up OneSignal for the web. You can set the URL of the app as a local host if you want to run the app locally, or add a remote URL if you want to deploy your app to a public hosting. You should add the file you obtain in step 4 of the instruction under the `public` directory of your Next.js app like [this](https://github.com/supabase-community/onesignal/tree/main/app/public).\n\n## Step 2: Build Next.js app\n\nThe Next.js app will have a login form for the user to sign in, and a button that they can press to make an order once they are signed in. Update the `index.tsx` file to the following.\n\n```tsx pages/index.tsx\nimport { createClient, User } from '@supabase/supabase-js'\nimport type { NextPage } from 'next'\nimport Head from 'next/head'\nimport React, { useEffect, useState } from 'react'\nimport OneSignal from 'react-onesignal'\n\nconst supabaseUrl = process.env.NEXT_PUBLIC_SUPABASE_URL!\nconst supabaseAnonKey = process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY!\nconst oneSignalAppId = process.env.NEXT_PUBLIC_ONESIGNAL_APP_ID!\n\nconst supabase = createClient(supabaseUrl, supabaseAnonKey)\n\nconst Home: NextPage = () =\u003e {\n  const [user, setUser] = useState\u003cUser | null\u003e(null)\n\n  const [oneSignalInitialized, setOneSignalInitialized] =\n    useState\u003cboolean\u003e(false)\n\n  /**\n   * Initializes OneSignal SDK for a given Supabase User ID\n   * @param uid Supabase User ID\n   */\n  const initializeOneSignal = async (uid: string) =\u003e {\n    if (oneSignalInitialized) {\n      return\n    }\n    setOneSignalInitialized(true)\n    await OneSignal.init({\n      appId: oneSignalAppId,\n      notifyButton: {\n        enable: true,\n      },\n\n      allowLocalhostAsSecureOrigin: true,\n    })\n\n    await OneSignal.login(uid)\n  }\n\n  const sendMagicLink = async (event: React.FormEvent\u003cHTMLFormElement\u003e) =\u003e {\n    event.preventDefault()\n    const { email } = Object.fromEntries(new FormData(event.currentTarget))\n    if (typeof email !== 'string') return\n\n    const { error } = await supabase.auth.signInWithOtp({ email })\n    if (error) {\n      alert(error.message)\n    } else {\n      alert('Check your email inbox')\n    }\n  }\n\n  // Place a order with the selected price\n  const submitOrder = async (event: React.FormEvent\u003cHTMLFormElement\u003e) =\u003e {\n    event.preventDefault()\n    const { price } = Object.fromEntries(new FormData(event.currentTarget))\n    if (typeof price !== 'string') return\n\n    const { error } = await supabase\n      .from('orders')\n      .insert({ price: Number(price) })\n    if (error) {\n      alert(error.message)\n    }\n  }\n\n  useEffect(() =\u003e {\n    const initialize = async () =\u003e {\n      const initialUser = (await supabase.auth.getUser())?.data.user\n      setUser(initialUser ?? null)\n      if (initialUser) {\n        initializeOneSignal(initialUser.id)\n      }\n    }\n\n    initialize()\n\n    const authListener = supabase.auth.onAuthStateChange(\n      async (event, session) =\u003e {\n        const user = session?.user ?? null\n        setUser(user)\n        if (user) {\n          initializeOneSignal(user.id)\n        }\n      }\n    )\n\n    return () =\u003e {\n      authListener.data.subscription.unsubscribe()\n    }\n  }, [])\n\n  return (\n    \u003c\u003e\n      \u003cHead\u003e\n        \u003ctitle\u003eOneSignal Order Notification App\u003c/title\u003e\n        \u003clink rel=\"icon\" href=\"/favicon.ico\" /\u003e\n      \u003c/Head\u003e\n\n      \u003cmain className=\"flex items-center justify-center min-h-screen bg-black\"\u003e\n        {user ? (\n          \u003cform className=\"flex flex-col space-y-2\" onSubmit={submitOrder}\u003e\n            \u003cselect\n              className=\"bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded block p-2\"\n              name=\"price\"\n            \u003e\n              \u003coption value=\"100\"\u003e$100\u003c/option\u003e\n              \u003coption value=\"200\"\u003e$200\u003c/option\u003e\n              \u003coption value=\"300\"\u003e$300\u003c/option\u003e\n            \u003c/select\u003e\n            \u003cbutton\n              type=\"submit\"\n              className=\"py-1 px-4 text-lg bg-green-400 rounded\"\n            \u003e\n              Place an Order\n            \u003c/button\u003e\n          \u003c/form\u003e\n        ) : (\n          \u003cform className=\"flex flex-col space-y-2\" onSubmit={sendMagicLink}\u003e\n            \u003cinput\n              className=\"border-green-300 border rounded p-2 bg-transparent text-white\"\n              type=\"email\"\n              name=\"email\"\n              placeholder=\"Email\"\n            /\u003e\n            \u003cbutton\n              type=\"submit\"\n              className=\"py-1 px-4 text-lg bg-green-400 rounded\"\n            \u003e\n              Send Magic Link\n            \u003c/button\u003e\n          \u003c/form\u003e\n        )}\n      \u003c/main\u003e\n    \u003c/\u003e\n  )\n}\n\nexport default Home\n```\n\nThere is quite a bit of stuff going on here, but basically, it’s creating a simple UI for the user to sign in using the [magic link](https://supabase.com/docs/guides/auth/auth-magic-link), and once the user is signed in, will initialize OneSignal to ask the user to receive notifications on the website.\n\nNotice that inside the `initializeOneSignal()` function, we use the Supabase user ID a to log the user into OneSignal. This allows us to later send push notifications to the user using their Supabase user ID from the backend, which is very handy.\n\n```tsx\nawait OneSignal.login(uid)\n```\n\nThe front-end side of things is done here. Let’s get into the backend.\n\nWe also need to set our environment variables. Create a `.env.local` file and use the following template to set the environment variables. You can find your Supabase configuration in your dashboard under `settings \u003e API`, and you can find the OneSignal app ID from `Settings \u003e Keys \u0026 IDs`\n\n```bash\nNEXT_PUBLIC_SUPABASE_URL=YOUR_SUPABASE_URL\nNEXT_PUBLIC_SUPABASE_ANON_KEY=YOUR_SUPABASE_ANON_KEY\nNEXT_PUBLIC_ONESIGNAL_APP_ID=YOUR_ONESIGNAL_APP_ID\n```\n\n![Where to find OneSignal App ID](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/onesignal/onesignal-app-id.png)\n\n## Step 3: Create the Edge Function\n\nLet’s create an edge function that will receive [database webhooks](https://supabase.com/docs/guides/database/webhooks) from the database and calls the OneSignal API to send the push notification.\n\n```bash\nsupabase functions new notify\n```\n\nReplace the contents of `supabase/functions/notify/index.ts` with the following\n\n```tsx\nimport { serve } from 'https://deno.land/std@0.177.0/http/server.ts'\nimport * as OneSignal from 'https://esm.sh/@onesignal/node-onesignal@1.0.0-beta7'\n\nconst _OnesignalAppId_ = Deno.env.get('ONESIGNAL_APP_ID')!\nconst _OnesignalUserAuthKey_ = Deno.env.get('USER_AUTH_KEY')!\nconst _OnesignalRestApiKey_ = Deno.env.get('ONESIGNAL_REST_API_KEY')!\nconst configuration = OneSignal.createConfiguration({\n  userKey: _OnesignalUserAuthKey_,\n  appKey: _OnesignalRestApiKey_,\n})\n\nconst onesignal = new OneSignal.DefaultApi(configuration)\n\nserve(async (req) =\u003e {\n  try {\n    const { record } = await req.json()\n\n    // Build OneSignal notification object\n    const notification = new OneSignal.Notification()\n    notification.app_id = _OnesignalAppId_\n    notification.include_external_user_ids = [record.user_id]\n    notification.contents = {\n      en: `You just spent $${record.price}!`,\n    }\n    const onesignalApiRes = await onesignal.createNotification(notification)\n\n    return new Response(\n      JSON.stringify({ onesignalResponse: onesignalApiRes }),\n      {\n        headers: { 'Content-Type': 'application/json' },\n      }\n    )\n  } catch (err) {\n    console.error('Failed to create OneSignal notification', err)\n    return new Response('Server error.', {\n      headers: { 'Content-Type': 'application/json' },\n      status: 400,\n    })\n  }\n})\n```\n\nIf you see bunch of errors in your editor, it's because your editor is not configured to use Deno. Follow the official setup guide [here](https://deno.land/manual@v1.28.3/getting_started/setup_your_environment) to setup your IDE to use Deno.\n\nThe function receives a `record` object, which is the row inserted in your `orders` table, and constructs a notification object to then send to OneSignal to deliver the push notification.\n\nWe also need to set the environment variable for the function. Create a `.env` file under your `supabase` directory and paste the following.\n\n```bash\nONESIGNAL_APP_ID=YOUR_ONESIGNAL_APP_ID\nUSER_AUTH_KEY=YOUR_USER_AUTH_KEY\nONESIGNAL_REST_API_KEY=YOUR_ONESIGNAL_REST_API_KEY\n```\n\n`ONESIGNAL_APP_ID` and `ONESIGNAL_REST_API_KEY` can be found under `Settings \u003e Keys \u0026 IDs` of your OneSignal app, and `USER_AUTH_KEY` can be found by going to `Account \u0026 API Keys` page by clicking your icon in the top right corner and scrolling to the `User Auth Key` section.\n\n![Where to find OneSignal User Auth Key](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/onesignal/onesignal-api-key.png)\n\nOnce your environment variables are filled in, you can run the following command to set the environment variable.\n\n```bash\nsupabase secrets set --env-file ./supabase/.env\n```\n\nAt this point, the function should be ready to be deployed! Run the following command to deploy your functions to the edge! The `no-verify-jwt` flag is required if you plan to call the function from a webhook.\n\n```bash\nsupabase functions deploy notify --no-verify-jwt\n```\n\n## Step 4: Setting up the Supabase database\n\nFinally, we get to set up the database! Run the following SQL to set up the `orders` table.\n\n```sql\ncreate table\n  if not exists public.orders (\n    id uuid not null primary key default uuid_generate_v4 (),\n    created_at timestamptz not null default now (),\n    user_id uuid not null default auth.uid (),\n    price int8 not null\n  );\n```\n\nAs you can see, the `orders` table has 4 columns and 3 of them have default values. That means all we need to send from the front-end app is the price. That is why our insert statement looked very simple.\n\n```tsx\nconst { error } = await supabase.from('orders').insert({\n  price: 100,\n})\n```\n\nLet’s also set up the webhook so that whenever a new row is inserted in the `orders` table, it calls the edge function. Go to `Database \u003e Webhooks` and create a new Database Webhook. The table should be set to `orders` and Events should be inserted. The type should be HTTP Request, the HTTP method should be POST, and the URL should be the URL of your edge function. Hit confirm to save the webhook configuration.\n\n![Supabase Webhooks configuration](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/onesignal/webhook.png)\n\nAt this point, the app should be complete! Run your app locally with `npm run dev`, or deploy your app to a hosting service and see how you receive a push notification when you place an order!\nRemember that if you decide to deploy your app to a hosting service, you would need to create another OneSignal app configured for your local address.\n\n![Ordering app UI](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/onesignal/app-ui.png)\n\n## Resources\n\nThis particular example was using Next.js, but you can apply the same principles to implement send push notification, SMS, Emails, and in-app-notifications on other platforms as well.\n\n- [OneSignal + Flutter + Supabase example](https://github.com/OneSignalDevelopers/onesignal-supabase-sample-integration-supabase)\n- [OneSignal Mobile Quickstart](https://documentation.onesignal.com/docs/mobile-sdk-setup)\n- [OneSignal Documentation](https://documentation.onesignal.com/docs/onesignal-platform)\n- [OneSignal Onboarding guide](https://documentation.onesignal.com/docs/onboarding-with-onesignal)\n"])</script><script>self.__next_f.push([1,"4f:T1987,"])</script><script>self.__next_f.push([1,"Analytics for your Supabase data. Estuary helps seamlessly migrate your data from Firestore to a Supabase Postgres database.\n\n\u003cdiv style={{position: 'relative', paddingBottom: '57.23370429252782%', height: 0 }}\u003e\n  \u003ciframe\n    src=\"https://www.loom.com/embed/a8eb6fa3bece4f89835c778011637a6c\"\n    frameborder=\"0\"\n    allowfullscreen\n    style={{position: 'absolute', top: 0, left: 0, width: '100%', height: '100%'}}\n  \u003e\u003c/iframe\u003e\n\u003c/div\u003e\n\nEstuary is a real-time data pipeline platform, enabling seamless capture from sources, historical backfill and real-time synchronization between sources and destinations. This makes it simple to continuously extract data from Supabase for analytics or creating data products.\n\n## Benefits\n\nAs a real-time platform, Estuary continuously extracts data from sources like Supabase using CDC.  This has a few main benefits:\n\n- Access real-time analytics in your warehouse or destination of choice\n- Least impact on your Supabase DB\n- The ability to push to any destination that either Estuary or Kafka Connect and push to\n\n## Overview\n\nDetails on how to use Estuary's Supabase specific connector can be found [here](https://docs.estuary.dev/reference/Connectors/capture-connectors/PostgreSQL/Supabase/).  Setting up Estuary is straightforward and has a few main requirements:\n1. Create a free account [here](https://dashboard.estuary.dev/register).  Note that Estuary provides lifetime free service for anyone whose monthly usage is less than 10 GB and 2 connectors.  A 30 day free trial is automatically applied for accounts that exceed that usage.\n2. Capture data from your Supabse instance using the [relevant documentation](https://docs.estuary.dev/reference/Connectors/capture-connectors/PostgreSQL/Supabase/).  Note that you will need to create a dedicated IPV4 address to use as your hostname within Estuary.\n3. Push that data to your destination of choice.  Example docs for Snowflake can be found [here](https://docs.estuary.dev/reference/Connectors/materialization-connectors/Snowflake/).\n\n## Detailed Documentation\n\n### Prerequisites\n\nYou'll need a Supabase PostgreSQL database setup with the following:\n- A Supabase IPV4 address. This can be configured under \"Project Settings\" -\u003e \"Add ons\" within Supabase's UI.\n- [Logical replication enabled](https://www.postgresql.org/docs/current/runtime-config-wal.html) - `wal_level=logical`\n- [User role](https://www.postgresql.org/docs/current/sql-createrole.html) with `REPLICATION` attribute\n- A [replication slot](https://www.postgresql.org/docs/current/warm-standby.html#STREAMING-REPLICATION-SLOTS). This represents a \"cursor\" into the PostgreSQL write-ahead log from which change events can be read.\n    - Optional; if none exist, one will be created by the connector.\n    - If you wish to run multiple captures from the same database, each must have its own slot. You can create these slots yourself, or by specifying a name other than the default in the advanced [configuration](https://docs.estuary.dev/referen
