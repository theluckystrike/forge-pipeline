ce/Connectors/capture-connectors/PostgreSQL/Supabase/#configuration).\n- A [publication](https://www.postgresql.org/docs/current/sql-createpublication.html). This represents the set of tables for which change events will be reported.\n    - In more restricted setups, this must be created manually, but can be created automatically if the connector has suitable permissions.\n- A watermarks table. The watermarks table is a small \"scratch space\" to which the connector occasionally writes a small amount of data to ensure accuracy when backfilling preexisting table contents.\n    - In more restricted setups, this must be created manually, but can be created automatically if the connector has suitable permissions.\n\n#### Configuration Tip\n\nTo configure this connector to capture data from databases hosted on your internal network, you must set up SSH tunneling. For more specific instructions on setup, see [configure connections with SSH tunneling](https://docs.estuary.dev/guides/connect-network/).\n\n### Setup\n\nThe simplest way to meet the above prerequisites is to change the WAL level and have the connector use a database superuser role.\n\nFor a more restricted setup, create a new user with just the required permissions as detailed in the following steps:\n\n1.  Connect to your instance and create a new user and password:\n\n    ```\n    CREATE USER flow_capture WITH PASSWORD 'secret' REPLICATION;\n    ```\n\n2.  Assign the appropriate role.\n\n    a.  If using PostgreSQL v14 or later:\n\n    ```\n    GRANT pg_read_all_data TO flow_capture;\n    ```\n\n    b.  If using an earlier version:\n\n    ```\n    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES to flow_capture;\n    GRANT SELECT ON ALL TABLES IN SCHEMA public, \u003cother_schema\u003e TO flow_capture;\n    GRANT SELECT ON ALL TABLES IN SCHEMA information_schema, pg_catalog TO flow_capture;\n    ```\n\n    where `\u003cother_schema\u003e` lists all schemas that will be captured from.\n\n    INFO\n\n    If an even more restricted set of permissions is desired, you can also grant SELECT on just the specific table(s) which should be captured from. The 'information_schema' and 'pg_catalog' access is required for stream auto-discovery, but not for capturing already configured streams.\n\n3.  Create the watermarks table, grant privileges, and create publication:\n\n```\nCREATE TABLE IF NOT EXISTS public.flow_watermarks (slot TEXT PRIMARY KEY, watermark TEXT);\nGRANT ALL PRIVILEGES ON TABLE public.flow_watermarks TO flow_capture;\nCREATE PUBLICATION flow_publication;\nALTER PUBLICATION flow_publication SET (publish_via_partition_root = true);\nALTER PUBLICATION flow_publication ADD TABLE public.flow_watermarks, \u003cother_tables\u003e;\n```\n\nwhere `\u003cother_tables\u003e` lists all tables that will be captured from. The `publish_via_partition_root` setting is recommended (because most users will want changes to a partitioned table to be captured under the name of the root table) but is not required.\n\n4.  Set WAL level to logical:\n\n```\nALTER SYSTEM SET wal_level = logical;\n```\n\n5.  Restart PostgreSQL to allow the WAL level change to take effect.\n\n## Resources\n\nFor more information, visit the [Flow docs](https://docs.estuary.dev/). In particular:\n\n- [Guide to create a Data Flow](https://docs.estuary.dev/guides/create-dataflow/)\n- [Firestore capture connector](https://docs.estuary.dev/reference/Connectors/capture-connectors/google-firestore/)\n- [Postgres materializaiton connector](https://docs.estuary.dev/reference/Connectors/materialization-connectors/PostgreSQL/)\n"])</script><script>self.__next_f.push([1,"50:Tb3a,"])</script><script>self.__next_f.push([1,"**Artie is a fully managed CDC streaming platform — the modern way to replicate data.** From change capture to merges, backfills, and observability, Artie automates the entire ingestion lifecycle.\n\nBy eliminating brittle orchestration, manual backfill logic, and silent failures, Artie delivers production-grade infrastructure teams can trust — with no maintenance required.\n\nFollow the steps below to set up real-time replication from your Supabase database to data warehouses like Snowflake, Redshift, BigQuery, and more (see [our docs](https://www.artie.com/docs/quickstart) for a full list of supported connectors).\n\n### Step #1 - Enable IPv4 Add On\n\nArtie does not support IPv6. Please ensure that you have IPv4 enabled as an add on. \n\nTo do this:\n1. Go to your project settings in Supabase\n2. Click on Add Ons\n3. Enable IPv4\n\n![Screenshot 1](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/artie/img1.jpeg)\n\n### Step #2 - Create an Artie account\n\nVisit [artie.com/contact](https://www.artie.com/contact) and complete the form to request access.\n\n![Screenshot 2](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/artie/img2.jpeg)\n\n### Step #3 - Find your Supabase database credentials\n\nYou can find this under Settings \u003e Database \u003e Connection Parameters.\n\nWe will need the following:\n- Database Host (Uncheck Display connection pooler)\n- Database Port (Should be 5432)\n- Username\n- Password\n- Database\n\nTo create a service account, please run the following commands in Supabase.\n\n```sql\nCREATE USER artie_transfer WITH PASSWORD 'password';\n\n-- Grant replication permissions\nALTER USER artie_transfer REPLICATION;\n\n-- Grant read-only access to future tables\nALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO artie_transfer;\n-- Grant access to existing tables\nGRANT SELECT ON ALL TABLES IN SCHEMA public TO artie_transfer;\n\nCREATE PUBLICATION dbz_publication FOR ALL TABLES;\n```\n\n### Step #4 - Create a new deployment in Artie\n\nHead over to Artie with the information you have gathered from Step #3 and create a new deployment by following a 3 step process.\n\n1. Connect your source\n2. Choose the tables you want to replicate\n3. Connect your destination\n\n![Screenshot 3](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/artie/img3.jpeg)\n\nFor any additional inquiry, check out [Artie docs](https://artie.com/docs/quickstart) or reach out to the team at [hi@artie.com](hi@artie.com).\n\n## Product Screenshots\n\n![Screenshot 4](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/artie/img4.jpeg)\n![Screenshot 5](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/artie/img5.jpeg)\n![Screenshot 6](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/artie/img6.jpeg)"])</script><script>self.__next_f.push([1,"51:T6d4d,"])</script><script>self.__next_f.push([1,"\nBy integrating Supabase with Plasmic — a visual builder for the web — you can create data-backed applications without writing code. Although many users leverage Plasmic for rapid landing page development, this tutorial demonstrates its power as a general-purpose visual builder for React, enabling the creation of fully featured read-write applications.\n\n## Documentation\n\nIn this guide, we’ll walk you through building a crowd-sourced Pokémon Pokédex by connecting **Supabase**, an open-source Firebase alternative, with **Plasmic**, a visual web builder.\n\nLive demo (signing up is quick):\n\n[https://plasmic-supabase-demo.vercel.app](https://plasmic-supabase-demo.vercel.app/)\n\nRepository:\n\n[https://github.com/plasmicapp/plasmic/tree/master/examples/supabase-demo](https://github.com/plasmicapp/plasmic/tree/master/examples/supabase-demo)\n\nPlasmic project:\n\n[https://studio.plasmic.app/projects/66RKaSPCwKxYjCfXWHCxn6](https://studio.plasmic.app/projects/66RKaSPCwKxYjCfXWHCxn6)\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/plasmic/16.png)\n\nAt a high level:\n\n- **Supabase** serves as the backend (powered by Postgres) for storing Pokémon data and managing authentication. Our code base includes React components for querying the database, displaying data, and handling user sessions.\n- **Plasmic** is used to build the application’s pages and design its visual layout. We import our Supabase components into Plasmic Studio, where they can be visually arranged and configured (for instance, to display data).\n- Plasmic-designed pages are rendered back into the Next.js application.\n\n## Step 1: Set up your Backend on Supabase\n\n- On the [Supabase dashboard](https://supabase.com/dashboard), click New project and give your project a name.\n\nBy default, Supabase configures email-based signups, storing users in the `users` table.\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/plasmic/15.png)\n\n- Navigate to the **Table Editor** in the left sidebar. Here, create a **New table** to store your Pokémon entries. Ensure you are in the `schema public` view and create a table called `entries` with six columns:\n    - `id`: A unique identifier for the entry, automatically generated as the primary column.\n    - `user_id`: Create a relation to the user table by clicking the link 🔗 icon next to the column name and selecting the `id` column from the `user` table.\n    - `name`, `description`, `imageUrl`: These columns store the Pokémon’s name, description, and image URL respectively.\n    - `inserted_at`: Automatically populated with the timestamp when the row is first inserted.\n\n\u003e Note:  In this tutorial, we’ve turned off Row Level Security (RLS). In a production environment, you should create policies that restrict who can create, edit, and delete posts. With RLS off, any user can modify the database without restrictions.\n\u003e \n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/plasmic/14.png)\n\nFor convenience, you can import the following CSV file into Supabase to pre-populate your database. To import, select **Import data via spreadsheet** in the new table dialog box (this does not work on existing tables):\n\n```\nid,user_id,name,imageUrl,inserted_at,description\n5,94232f4a-1376-4f5a-8985-4b2f5e063b99,Charmander,https://assets.pokemon.com/assets/cms2/img/pokedex/full/004.png,2022-03-08 16:19:13.970657+00,\"It has a preference for hot things. When it rains, steam is said to spout from the tip of its tail.\"\n6,94232f4a-1376-4f5a-8985-4b2f5e063b99,Bulbasaur,https://assets.pokemon.com/assets/cms2/img/pokedex/full/001.png,2022-03-11 03:01:46.021406+00,There is a plant seed on its back right from the day this Pokémon is born. The seed slowly grows larger.\n7,94232f4a-1376-4f5a-8985-4b2f5e063b99,Squirtle,https://assets.pokemon.com/assets/cms2/img/pokedex/full/007.png,2022-03-17 17:44:57.442837+00,\"When it retracts its long neck into its shell, it squirts out water with vigorous force.\"\n8,94232f4a-1376-4f5a-8985-4b2f5e063b99,Pikachu,https://assets.pokemon.com/assets/cms2/img/pokedex/full/025.png,2022-03-17 18:06:40.250145+00,Pikachu that can generate powerful electricity have cheek sacs that are extra soft and super stretchy.\n9,94232f4a-1376-4f5a-8985-4b2f5e063b99,Ekans,https://assets.pokemon.com/assets/cms2/img/pokedex/full/023.png,2022-03-17 18:07:01.72287+00,\"The older it gets, the longer it grows. At night, it wraps its long body around tree branches to rest.\"\n10,94232f4a-1376-4f5a-8985-4b2f5e063b99,Rattata,https://assets.pokemon.com/assets/cms2/img/pokedex/full/019.png,2022-03-17 18:07:18.175796+00,\"Will chew on anything with its fangs. If you see one, you can be certain that 40 more live in the area.\"\n11,94232f4a-1376-4f5a-8985-4b2f5e063b99,Pidgey,https://assets.pokemon.com/assets/cms2/img/pokedex/full/016.png,2022-03-17 18:07:53.323738+00,\"Very docile. If attacked, it will often kick up sand to protect itself rather than fight back.\"\n12,94232f4a-1376-4f5a-8985-4b2f5e063b99,Butterfree,https://assets.pokemon.com/assets/cms2/img/pokedex/full/012.png,2022-03-17 18:08:07.248343+00,\"In battle, it flaps its wings at great speed to release highly toxic dust into the air.\"\n13,94232f4a-1376-4f5a-8985-4b2f5e063b99,Caterpie,https://assets.pokemon.com/assets/cms2/img/pokedex/full/010.png,2022-03-17 18:08:18.907813+00,\"For protection, it releases a horrible stench from the antenna on its head to drive away enemies.\"\n```\n\nYou’ll also need to create a function in your database to fetch the schema. This function will retrieve the Supabase database schema to display the table and column names in Plasmic Studio.\n\nTo do this, navigate to **Database** → **Functions** and click **Add a new function**.\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/plasmic/13.png)\n\nUse `get_table_info` as the function name and leave the schema as public. In the **Return type** field, select `JSON`.\n\nPaste the following function definition:\n\n```sql\nDECLARE\n  result json;\nBEGIN\n  WITH tables AS (\n    SELECT c.oid :: int8     AS id,\n        nc.nspname       AS schema,\n        c.relname       AS name,\n        obj_description(c.oid) AS comment\n    FROM  pg_namespace nc\n        JOIN pg_class c\n         ON nc.oid = c.relnamespace\n    WHERE c.relkind IN ( 'r', 'p' )\n        AND\n    ( pg_has_role(c.relowner, 'USAGE')\n      OR has_table_privilege(c.oid,\n       'SELECT, INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER')\n      OR has_any_column_privilege(c.oid, 'SELECT, INSERT, UPDATE, REFERENCES')\n    )\n  ),\n  columns AS (\n    SELECT c.table_schema AS schema,\n        c.table_name AS table,\n        c.column_name AS name,\n        c.column_default AS default,\n        c.data_type,\n        c.udt_name AS format,\n        (c.is_identity = 'YES') AS is_identity,\n        (c.is_updatable = 'YES') AS is_updatable,\n        CASE\n          WHEN pk.column_name IS NOT NULL THEN TRUE\n          ELSE FALSE\n        END AS is_primary_key,\n        array_to_json(array\n                (SELECT e.enumlabel\n                FROM pg_enum e\n                JOIN pg_type t ON e.enumtypid = t.oid\n                WHERE t.typname = udt_name\n                ORDER BY e.enumsortorder)) AS enums\n    FROM information_schema.columns c\n    LEFT JOIN\n     (SELECT ku.table_catalog,\n         ku.table_schema,\n         ku.table_name,\n         ku.column_name\n      FROM information_schema.table_constraints AS tc\n      INNER JOIN information_schema.key_column_usage AS ku ON tc.constraint_type = 'PRIMARY KEY'\n      AND tc.constraint_name = ku.constraint_name) pk ON c.table_catalog = pk.table_catalog\n    AND c.table_schema = pk.table_schema\n    AND c.table_name = pk.table_name\n    AND c.column_name = pk.column_name\n  )\n  SELECT json_agg(t)\n  INTO result\n  FROM (\n    SELECT\n      name,\n      COALESCE(\n       (\n        SELECT\n         array_agg(\n          row_to_json(columns)\n         ) FILTER (\n          WHERE\n           columns.schema = tables.schema AND columns.table = tables.name\n         )\n        FROM\n         columns\n       ),\n       '{}'::json[]\n      ) AS columns\n    FROM\n      tables\n    WHERE\n      schema NOT IN (\n       'information_schema', 'pg_catalog',\n       'pg_temp_1', 'pg_toast', 'pg_toast_temp_1'\n      ) AND\n      name NOT IN ('buckets',\n       'objects', 'migrations', 's3_multipart_uploads', 's3_multipart_uploads_parts', 'schema_migrations', 'subscription', 'messages')\n  ) t;\n\n  RETURN result;\nEND;\n```\n\nSince we’ve disabled RLS for now, ensure that your function is executable by the anonymous user. To do this, navigate to the SQL Editor in the sidebar and run the following query:\n\n```sql\nGRANT EXECUTE ON FUNCTION get_table_info() TO anon;\n```\n\n\u003e Important! Make sure to revert this step when you add RLS to your table later.\n\u003e \n\n## Step 2: Set up your codebase\n\nWe have a working code example available [here](https://github.com/plasmicapp/plasmic/tree/master/examples/supabase-demo). This starter project includes all the code components you need to begin querying Supabase through Plasmic Studio.\n\n\u003e Code components are React components defined in your code base that we import into Plasmic Studio. Your project is configured to look for these at `http://localhost:3000/plasmic-host`. You can use and style these components in your design. See `supabase-demo/plasmic-init.ts` to understand how they are registered with Plasmic.\n\u003e \n\nFirst, clone the repo to your development machine:\n\n```bash\ngit clone --depth=1 git@github.com:plasmicapp/plasmic.git\ncd plasmic/examples/supabase-demo/\n```\n\nCopy `.env.example` to `.env` to store your environment variables for the local development server. Then, add your Supabase project’s URL and public key (found in the API tab on the left pane of your Supabase dashboard).\n\nInstall the dependencies and fetch the Supabase schema by running:\n\n```bash\nyarn\n```\n\nNow, start the development server (it listens on http://localhost:3000):\n\n```bash\nyarn dev\n```\n\n## Step 3: Explore the existing application\n\nOpen [http://localhost:3000](http://localhost:3000/) in your web browser. The project is already set up for user sign-ups and logins and includes an admin interface for adding and editing Pokémon in the database. Feel free to sign up with your email address and add Pokémon entries. Note that Supabase requires email verification before you can log in.\n\nIf you pre-populated the database in Step 1, you should see the following homepage after logging in. Otherwise, you can manually add Pokémon via the UI.\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/plasmic/12.png)\n\n## Step 4: Clone the Plasmic project\n\nNow, let’s make some enhancements! The code base is initially set up with a read-only copy of the Plasmic project. Let’s create an editable copy first.\n\nOpen the default starter Plasmic project here:\n\n[https://studio.plasmic.app/projects/66RKaSPCwKxYjCfXWHCxn6](https://studio.plasmic.app/projects/66RKaSPCwKxYjCfXWHCxn6)\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/plasmic/11.png)\n\nTo create an editable copy, click the **Copy Project** button in the blue bar. This will clone the project and redirect you to your copy.\n\n### Step 4a: Configure your code base to use the new Plasmic project\n\nTake note of the `project ID` and `API token`. You can find the project ID in the URL:\n\n`https://studio.plasmic.app/projects/PROJECTID`.\n\nThe API token is available by clicking the **Code** button in the top bar.\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/plasmic/10.png)\n\nReturn to `.env` and update the corresponding project ID and token fields.\n\n### Step 4b: Configure your Plasmic project app host\n\nTo ensure Plasmic looks for your code components on your development server, update your project’s app host to [http://localhost:3000/plasmic-host](http://localhost:3000/plasmic-host).\n\n\u003e **Note**: Keep your development server running at [http://localhost:3000](http://localhost:3000/) for the project to load.\n\u003e \n\nAfter restarting both the dev server and Plasmic Studio, you should be able to edit both the Studio and your codebase.\n\n## Step 4: Deployment (optional)\n\nYou can host your application using Vercel, Netlify, AWS, or any other provider you prefer.\n\nIn this section, we will cover deployment using Vercel:\n\n1. First, create a GitHub repository for your project.\n2. Next, log into vercel.app and add a new project.\n3. Point to the repository you created in the first step.\n4. Go to the project settings.\n5. Set the Build \u0026 Development settings to the following:\n    \n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/plasmic/9.png)\n    \n6. Set the Node.js version to 20.x.\n7. Go to the Environment Variables tab and copy the contents of your .env file.\n8. Trigger a deployment of your project.\n9. (optional) go back to step 4b, and point to your /plasmic-host page using your newly created domain. (for example, [https://plasmic-supabase-demo.vercel.app/plasmic-host](https://plasmic-supabase-demo.vercel.app/plasmic-host))\n\nYou can also refer to this [video](https://www.youtube.com/watch?v=atSGchKVe5I\u0026ab_channel=Plasmic) to see how another project is configured on Vercel and Netlify.\n\nYou are not able to use Plasmic hosting for this example, because it uses code components. Plasmic hosting does not have access to your codebase, meaning you would need to host your Next.js server using 3rd party providers.\n\n## Step 5: Create a new page – Look up Pokémon by name\n\nLet’s create a lookup page for our Pokédex using the code components from the code base.\n\n1. Create a new page called `Guess` and set its path to `/guess`.\n2. Add a NavBar and any additional elements to enhance the layout (we used two vertical containers for background and centering).\n3. Insert a `SupabaseDataProvider` by opening the AddDrawer (click the blue + button).\n\n\u003e For source, see `components/CodeComponents/DatabaseComponents/SupabaseDataProvider`.\n\u003e \n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/plasmic/8.png)\n\nAbove the `SupabaseDataProvider`, add a text input element and a heading. Change the text input’s placeholder to `Type your guess`. Your layout should resemble the following:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/plasmic/7.png)\n\nNext, configure the props for the `SupabaseDataProvider` in the right-hand panel:\n\n- **Table:** Set this to the table you created in Supabase.\n- **Columns:** Provide a comma-separated list of the columns you want to select from the table.\n- **Filters:** Define which data to fetch (similar to a WHERE clause).\n- **Single:** Specify whether to fetch a single record or multiple records.\n\nAdditionally, we set a visibility condition so that data is fetched only when the input contains more than three characters.\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/plasmic/6.png)\n\nThis is how the filter parameter should appear, with the operation set to eq (meaning it will fetch records where the property equals a specific value).\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/plasmic/5.png)\n\nThe `SupabaseDataProvider` passes down the fetched data, leaving it up to you to decide how to use it.\n\nNext, add a `Post` component (used on the homepage) to display the Pokémon.\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/plasmic/4.png)\n\nIf no matching Pokémon exists in the database, configure a nearby text node to inform the user. Control its visibility based on the data from the `SupabaseDataProvider`—this is how you can access that data in the Studio:\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/plasmic/3.png)\n\nFinally, add your new page as a link in the NavBar component. Try this as an exercise 🙂\n\n## Step 6: Check your dev server\n\nIf your development server has been running all along, you’ll notice that the site automatically fetches and rebuilds as you make changes in Plasmic Studio. To restart the dev server, run:\n\n```bash\nyarn dev\n```\n\nThen, view the results at [http://localhost:3000/guess](http://localhost:3000/guess)\n\n## How does this all work under the hood?\n\nAll the code components are defined in your codebase, and you’re free to enhance them to support more powerful querying capabilities in Plasmic Studio.\n\n### Email Verification API Route\n\nTo sign up, users must verify their email address. After signing up, they receive an email with a verification link. Clicking the link directs them to the API route at `/pages/api/auth/confirm.ts`, which confirms the OTP code and redirects them to the homepage.\n\nLearn more here: [https://supabase.com/docs/guides/auth/server-side/nextjs?queryGroups=router\u0026router=pages](https://supabase.com/docs/guides/auth/server-side/nextjs?queryGroups=router\u0026router=pages)\n\n### SupabaseDataProvider\n\nThis simple component executes queries and populates the application's data. If your data is mostly static, consider using `usePlasmicQueryData` instead of the mutable version.\n\n```tsx\nimport { Database } from \"@/types/supabase\";\nimport { createSupabaseClient } from \"@/util/supabase/component\";\nimport { Filter, applyFilter, isValidFilter } from \"@/util/supabase/helpers\";\nimport {\n  DataProvider,\n  usePlasmicCanvasContext,\n  useSelector,\n} from \"@plasmicapp/loader-nextjs\";\nimport { useMutablePlasmicQueryData } from \"@plasmicapp/query\";\nimport { ReactNode } from \"react\";\n\nexport interface SupabaseDataProviderProps {\n  children?: ReactNode;\n  tableName?: keyof Database[\"public\"][\"Tables\"];\n  columns?: string[];\n  className?: string;\n  filters?: any;\n  single?: boolean;\n}\n\nexport function SupabaseDataProvider(props: SupabaseDataProviderProps) {\n  const supabase = createSupabaseClient();\n  const inEditor = usePlasmicCanvasContext();\n  // These props are set in the Plasmic Studio\n  const { children, tableName, columns, className, filters, single } = props;\n  const currentUser = useSelector(\"auth\");\n  const validFilters = filters?.filter((f: any) =\u003e isValidFilter(f)) as\n    | Filter[]\n    | undefined;\n\n  const selectFields = columns?.join(\",\") || \"\";\n\n  // Error messages are currently rendered in the component\n  if (!tableName) {\n    return \u003cp\u003eYou need to set the tableName prop\u003c/p\u003e;\n  } else if (!selectFields) {\n    return \u003cp\u003eYou need to set the columns prop\u003c/p\u003e;\n  }\n\n  // Performs the Supabase query\n  async function makeQuery() {\n    // dont perform query if user is not logged in.\n    // allow to query in editor mode for demo purposes\n    if (!inEditor \u0026\u0026 !currentUser?.email) {\n      return;\n    }\n    let query = supabase.from(tableName!).select(selectFields || \"\");\n    query = applyFilter(query, validFilters);\n    // This is where the Single property comes into play—either querying for a single record or multiple records.\n    const { data, error, status } = await (single\n      ? query.single()\n      : query.order(\"id\", { ascending: false }));\n\n    if (error \u0026\u0026 status !== 406) {\n      throw error;\n    }\n    return data;\n  }\n\n  // The first parameter is a unique cache key for the query.\n  // If you want to update the cache - you are able to use the Refresh Data function in the Plasmic Studio.\n  const { data } = useMutablePlasmicQueryData(\n    `${tableName}-${JSON.stringify(filters)}`,\n    async () =\u003e {\n      try {\n        return await makeQuery();\n      } catch (err) {\n        console.error(err);\n        return {};\n      }\n      // As an additional way to control the cache flow - you are able to specify the revalidate options.\n      // For example, you can revalidate the data on mount and on page focus, to make sure that data is always up-to-date.\n      // If your data is mostly static - turn these options off.\n    },\n    { revalidateOnMount: true, revalidateOnFocus: true }\n  );\n\n  return (\n    \u003cdiv className={className}\u003e\n      \u003cDataProvider name={tableName} data={data}\u003e\n        {children}\n      \u003c/DataProvider\u003e\n    \u003c/div\u003e\n  );\n}\n```\n\n**How it is registered:**\n\n```tsx\n// /plasmic-init.ts\nPLASMIC.registerComponent(SupabaseQuery, {\n  name: \"SupabaseQuery\",\n  providesData: true,\n  props: {\n    children: \"slot\",\n    tableName: tableNameProp,\n    columns: {\n      ...columnProp,\n      multiSelect: true,\n    },\n    filters: filtersProp,\n    single: \"boolean\",\n  },\n  importPath: \"./components/CodeComponents/DatabaseComponents\",\n});\n```\n\nThe shared props for this registration are defined below. We use the `dbSchema` variable from an auto-generated file that fetches the Supabase schema. This file refreshes during `yarn build` or when you run `yarn`, allowing the Studio to display current tables and columns without hardcoding them.\n\n```tsx\nconst tableNameProp = {\n  type: \"choice\" as const,\n  multiSelect: false,\n  options: dbSchema.map((table) =\u003e table.name) || [],\n};\n\nconst columnProp = {\n  type: \"choice\" as const,\n  options: (props: any) =\u003e {\n    const table = dbSchema.find((t) =\u003e t.name === props.tableName);\n    return table?.columns?.map((column) =\u003e column.name) ?? [];\n  },\n};\n\nconst filtersProp = {\n  type: \"array\" as const,\n  nameFunc: (item: any) =\u003e item.name || item.key,\n  itemType: {\n    type: \"object\" as const,\n    fields: {\n      name: {\n        type: \"choice\" as const,\n        options: [\"eq\", \"match\"],\n      },\n      args: {\n        type: \"array\" as const,\n        itemType: {\n          type: \"object\" as const,\n          fields: {\n            column: columnProp,\n            value: \"string\" as const,\n          },\n        },\n      },\n    },\n  },\n};\n```\n\n### SupabaseForm\n\nThis component performs database mutations (such as delete, update, or insert operations). It wraps form elements and calls an action upon submission. In most cases, a submit button triggers the form, and the `onSuccess` hook is useful for redirecting the user or refreshing page data.\n\n```tsx\nimport { Database } from \"@/types/supabase\";\nimport { createSupabaseClient } from \"@/util/supabase/component\";\nimport { Filter, applyFilter, isValidFilter } from \"@/util/supabase/helpers\";\nimport React, { ReactNode } from \"react\";\n\nexport interface SupabaseFormProps {\n  children?: ReactNode;\n  tableName?: keyof Database[\"public\"][\"Tables\"];\n  method?: \"upsert\" | \"insert\" | \"update\" | \"delete\";\n  filters?: any;\n  data?: any;\n  onSuccess?: () =\u003e void;\n  className?: string;\n}\nexport function SupabaseForm(props: SupabaseFormProps) {\n  const { children, tableName, method, filters, data, className, onSuccess } =\n    props;\n  const supabase = createSupabaseClient();\n\n  if (!tableName) {\n    return \u003cp\u003eYou need to set the tableName prop\u003c/p\u003e;\n  }\n  if (!method) {\n    return \u003cp\u003eYou need to choose a method\u003c/p\u003e;\n  }\n\n  if (method !== \"delete\" \u0026\u0026 !data) {\n    return \u003cp\u003eYou need to set the data prop\u003c/p\u003e;\n  }\n\n  const validFilters = filters?.filter((f: any) =\u003e isValidFilter(f)) as\n    | Filter[]\n    | undefined;\n\n  async function onSubmit(e: React.FormEvent) {\n    e?.preventDefault();\n    try {\n      const table = supabase.from(tableName!);\n      let query: any;\n      switch (method) {\n        case \"update\": {\n          query = table.update(data);\n          break;\n        }\n        case \"upsert\": {\n          query = table.upsert(data);\n        }\n        case \"insert\": {\n          query = table.insert(data);\n        }\n        case \"delete\": {\n          query = table.delete();\n        }\n        default: {\n          throw new Error(\"Invalid method\");\n        }\n      }\n\n      query = applyFilter(query, validFilters);\n      const { error } = await query;\n\n      if (error) {\n        console.error(error);\n      } else if (onSuccess) {\n        onSuccess();\n      }\n    } catch (error) {\n      console.error(error);\n    }\n  }\n\n  return (\n    \u003cform onSubmit={onSubmit} className={className}\u003e\n      {children}\n    \u003c/form\u003e\n  );\n}\n```\n\n**How it is registered:**\n\n```tsx\nPLASMIC.registerComponent(SupabaseForm, {\n  name: \"SupabaseForm\",\n  props: {\n    children: \"slot\",\n    tableName: tableNameProp,\n    filters: filtersProp,\n    method: {\n      type: \"choice\",\n      options: [\"upsert\", \"insert\", \"update\", \"delete\"],\n    },\n    data: \"exprEditor\",\n    onSuccess: {\n      type: \"eventHandler\",\n      argTypes: [],\n    },\n  },\n});\n```\n\n### SupabaseUserSession\n\nThis component provides global user data across the application and is registered as a [GlobalContext](https://docs.plasmic.app/learn/global-contexts/). If you’d prefer not to log in every time to see content from a specific user’s perspective, you can set a `staticToken` in the context settings.\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/plasmic/2.png)\n\nYou can find the authentication token from the hosted application by inspecting any network request. The token is in the Authentication header (everything after “Bearer”).\n\n![](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/plasmic/1.png)\n\n**Source code:**\n\n```tsx\nimport { createSupabaseClient } from \"@/util/supabase/component\";\nimport {\n  DataProvider,\n  usePlasmicCanvasContext,\n} from \"@plasmicapp/loader-nextjs\";\nimport { User } from \"@supabase/supabase-js\";\nimport React from \"react\";\n\nexport function SupabaseUserSession({\n  children,\n  staticToken,\n}: {\n  className?: string;\n  staticToken?: string;\n  children?: React.ReactNode;\n}) {\n  const supabase = createSupabaseClient();\n  const [currentUser, setCurrentUser] = React.useState\u003cUser | null\u003e(null);\n  const [isLoaded, setIsLoaded] = React.useState(false);\n\n  const inEditor = usePlasmicCanvasContext();\n\n  React.useEffect(() =\u003e {\n    if (inEditor) {\n      if (staticToken) {\n        supabase.auth\n          .getUser(staticToken)\n          .then((res) =\u003e {\n            setCurrentUser(res.data.user);\n          })\n          .finally(() =\u003e {\n            setIsLoaded(true);\n          });\n      }\n      return;\n    }\n\n    const {\n      data: { subscription },\n    } = supabase.auth.onAuthStateChange((event, session) =\u003e {\n      if (event == \"SIGNED_OUT\") {\n        setCurrentUser(null);\n      } else if ([\"SIGNED_IN\", \"INITIAL_SESSION\"].includes(event) \u0026\u0026 session) {\n        setCurrentUser(session.user);\n      }\n      setIsLoaded(true);\n    });\n\n    return subscription.unsubscribe;\n  }, []);\n\n  return (\n    \u003cDataProvider name=\"auth\" data={currentUser || {}}\u003e\n      {isLoaded \u0026\u0026 children}\n    \u003c/DataProvider\u003e\n  );\n}\n```\n\n**How it is registered:**\n\n```tsx\nPLASMIC.registerGlobalContext(SupabaseUserSession, {\n  name: \"SupabaseUserSession\",\n  importPath: \"./components/CodeComponents/GlobalContexts\",\n  providesData: true,\n  props: { staticToken: \"string\" },\n});\n```\n\n### RedirectIf\n\nThis component redirects the user based on a condition you specify. In our example, it redirects users from inner pages if they are not logged in.\n\n**Source code:**\n\n```tsx\nimport { usePlasmicCanvasContext } from \"@plasmicapp/loader-nextjs\";\nimport React from \"react\";\n\nexport interface RedirectIfProps {\n  children?: any;\n  className?: string;\n  condition?: any;\n  onFalse?: () =\u003e void;\n}\n\nexport function RedirectIf(props: RedirectIfProps) {\n  const { children, className, onFalse, condition } = props;\n  const inEditor = usePlasmicCanvasContext();\n\n  React.useEffect(() =\u003e {\n    if (inEditor || !onFalse || condition) {\n      return;\n    }\n    onFalse();\n  }, [condition, inEditor]);\n\n  // Validation\n  if (typeof condition === \"undefined\") {\n    return (\n      \u003cp\u003e\n        Condition needs to be a boolean prop. Try to add exclamation marks to\n        the value.\n      \u003c/p\u003e\n    );\n  }\n\n  return \u003cdiv className={className}\u003e{children}\u003c/div\u003e;\n}\n```\n\n**And how it is registered:**\n\n```tsx\nPLASMIC.registerComponent(RedirectIf, {\n  name: \"RedirectIf\",\n  props: {\n    children: \"slot\",\n    onFalse: {\n      type: \"eventHandler\",\n      argTypes: [],\n    },\n    condition: \"exprEditor\",\n  },\n});\n```\n"])</script><script>self.__next_f.push([1,"52:T45d,"])</script><script>self.__next_f.push([1,"[Paddle](https://www.paddle.com/) is the leading Merchant of Record for digital product companies. It handles payments, subscriptions, tax, compliance, and fraud for more than 6,000 SaaS, AI, and app companies worldwide, replacing the need for a complex, fragmented payment stack.\n\nThe Paddle Wrapper brings your billing data into Postgres as queryable foreign tables. Query and write products, customers, subscriptions, transactions, and more with plain SQL and join them against your application data. The wrapper works with Supabase Vault for secure API key management and is built on WebAssembly (Wasm) for lightweight, sandboxed execution.\n\n### Supported Operations\n\n| Object | Select | Insert | Update | Delete |\n| --- | --- | --- | --- | --- |\n| Products | ✅ | ✅ | ✅ |  |\n| Prices | ✅ | ✅ | ✅ |  |\n| Discounts | ✅ | ✅ | ✅ |  |\n| Customers | ✅ | ✅ | ✅ |  |\n| Transactions | ✅ | ✅ | ✅ |  |\n| Reports | ✅ |  |  |  |\n| Notification Settings | ✅ | ✅ | ✅ |  |\n| Notifications | ✅ |  |  |  |\n\n### Resources\n\n- [supabase/wrappers on GitHub](https://github.com/supabase/wrappers)"])</script><script>self.__next_f.push([1,"53:Ta0e,"])</script><script>self.__next_f.push([1,"### Overview\n\nCreateOS is a unified deployment platform that includes Supabase as a first-class integration within its Deploy Services. Users can provision a new Supabase project or connect an existing one directly from the CreateOS dashboard. Once connected, credentials are auto-injected into the deployment environment — no manual .env files, no copy-pasting service role keys.\n\nThe integration supports all four core Supabase services: Postgres, Auth, Storage, and Realtime. For multi-environment projects, CreateOS connects separate Supabase instances to staging and production automatically, maintaining database isolation without manual configuration.\n\nCreateOS handles the production layer around Supabase — hosting, CI/CD, custom domains with SSL, and monitoring — so a developer with a Supabase backend can go from local development to a live application in a single deployment step.\n\n## What You Get\n\n- **Postgres** — a relational database with full SQL support, joins, complex queries, and ACID compliance\n- **Auth** — built-in user authentication with email/password, OAuth providers, and magic links\n- **Storage** — managed file storage for images, videos, documents, and user-generated content\n- **Realtime** — live database subscriptions that push changes to connected clients without polling\n\n## Setup\n\n1. Open your project in CreateOS\n2. Navigate to **Deploy Services** from the project dashboard\n3. Select the **Database** tab\n4. Click **Supabase** under Integrations\n5. Choose **Create new project** or **Connect existing project**\n6. Your Supabase credentials are now available as environment variables in your deployment\n\n## Environment Variables Injected\n\nPOSTGRES_DB\nPOSTGRES_HOST\nPOSTGRES_PORT\nPOSTGRES_USER\nPOSTGRES_PASSWORD\n\n## Common Use Cases\n\n**SaaS MVP** — Supabase gives you Auth and Postgres together. Implement login, signup, and data storage before writing any custom backend logic.\n\n**Realtime Collaboration** — Supabase Realtime provides live database subscriptions for shared workspaces, doc editors, or kanban boards. No WebSocket server required.\n\n**User-Generated Content** — Supabase Storage handles managed file hosting. Combined with Auth and Postgres, associate files with user identities and query them relationally.\n\n**AI Apps with Persistent Memory** — Postgres with the pgvector extension lets you store conversation history, vector embeddings, and structured AI outputs in a queryable format.\n\n**Internal Tools** — Production-grade database behind an internal dashboard with no DevOps setup required."])</script><script>self.__next_f.push([1,"54:T40e,"])</script><script>self.__next_f.push([1,"Dreambase is the Al-native way to turn your Supabase (or any Postgres) data into living product analytics. Connect your database in minutes and Dreambase automatically maps your schema, understands your events, and gives you an Al copilot that can answer questions, write SQL, and design full dashboards for you.\n\nTeams use Dreambase as a lightweight, Al-first analytics layer to track product usage, revenue, customer journeys, and operational metrics without standing up a separate warehouse or building brittle ETL pipelines. You can chat with your data, refine queries in SQL, or use guided flows to go from idea - chart → dashboard in a few clicks. \n\nDashboards stay in sync with your live data, ship with built-in permissions, and can be embedded directly into your product for customer-facing analytics. If you want a Supabase-friendly analytics stack that feels like a modern Al product instead of legacy BI, Dreambase makes it simple to get from raw events to trustworthy insights - all on top of the Postgres you already have."])</script><script>self.__next_f.push([1,"55:T418,"])</script><script>self.__next_f.push([1,"Effortlessly launch your full-stack JavaScript application within minutes and shift your focus to what matters most, your application itself. Leverage our powerful suite of tools to enhance your development process.\n\nWe offer a seamless process - build, host, and deploy in minutes, allowing you to channel your energy into solving user problems, not infrastructure management.\n\nManaging your full-stack application infrastructure is as easy as 1-2-3:\n\n1. Connect your repo using GitHub, BitBucket, or GitLab to get started instantly.\n1. Customize build configurations effortlessly.\n1. Deploy automatically or with a single click and go live.\n\nOur platform offers a range of features including built-in CI, staged rollouts, comprehensive logs, SSR, API functions, custom storage, and support for custom domains \u0026 SSL, among others.\n\nStormkit harnesses the power of AWS infrastructure, ensuring a robust environment for your JavaScript applications. We support popular frameworks like Angular, ReactJs, Node, Vue, Nuxt, Next, Nest, Svelte, and more."])</script><script>self.__next_f.push([1,"56:T2107,"])</script><script>self.__next_f.push([1,"Vercel enables developers to build and publish wonderful things. They build products for developers and designers. And those who aspire to become one. This makes it the perfect tool for building web apps with Supabase.\n\n\n## Documentation\n\nThis guide steps through using Vercel's dashboard to create a Next.js project integrated with Supabase. To further streamline the process, we will be using the Next.js starter template, which can be automatically forked to a new GitHub repo, without leaving the dashboard!\n\nIf you don’t have a Vercel account, create one [here](https://vercel.com/signup).\n\n## Step 1: Create a Supabase project\n\nThis guide could use an existing Supabase project, but to create the `todo` demo from scratch, navigate to [Supabase](https://supabase.com/dashboard/), click `Sign In` and authenticate with GitHub to login or register a new account.\n\nFrom the Supabase dashboard, click `New project` and select an organization.\n\n\u003e Note: You may need to create an organization first.\n\nGive your project a `name`, `password`, select a `region` close to your potential users and click `Create new project`.\n\n![Create a Supabase project](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/vercel/create-supabase-project.png)\n\nSupabase will take a couple of minutes to configure the infrastructure.\n\nOnce this is finished, navigate to `SQL Editor` from the sidebar menu and click `New query`.\n\nThis will create a new SQL snippet called \"New Query\". Copy and paste the following and click `Run`.\n\n```sql\ncreate table todos (\n  id bigint generated by default as identity primary key,\n  title text,\n  is_complete boolean default false,\n  created_at timestamp with time zone default timezone('utc'::text, now()) not null\n);\n\nalter table todos enable row level security;\n\ncreate policy \"Anyone can view todos\" on todos for\n    select using (true);\n\ncreate policy \"Anyone can add new todos\" on todos for\n    insert with check (true);\n\ninsert into todos(title)\nvalues\n  ('Create Supabase project'),\n  ('Create Vercel project'),\n  ('Install Supabase integration');\n```\n\nThis will create a new todos table, enable row level security, add policies for selecting and inserting data, and add some example rows.\n\n\u003e Note: To simplify this example, we are allowing anyone to `select` and `insert` rows on the `todos` table. Usually, these actions would be locked down to only allow logged in users to perform them. Check out [this video](https://www.youtube.com/watch?v=Ow_Uzedfohk) to learn more about Row Level Security and policies.\n\n## Step 2: Create Vercel project\n\nFrom your [Vercel dashboard](https://vercel.com/dashboard), click `New Project`.\n\n![Create new Vercel project](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/vercel/create-vercel-project.png)\n\nUnder the `Clone Template` menu, click `Next.js`.\n\n![Clone Next.js template](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/vercel/clone-next-js-template.png)\n\nIn the `Create Git Repository` section, click `GitHub`, select your username under `GIT SCOPE`, enter a name for your project, choose whether you want your repo `private` or `public`, and click `Create`.\n\n![New GitHub repo settings](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/vercel/repo-settings.png)\n\nThis will create a new GitHub repository, clone and commit the Next.js starter project, then build and deploy your new project to Vercel.\n\nOnce you have been redirected to the `Congratulations` screen, click `Go to Dashboard`.\n\nNavigate to `Settings`, `Integrations`, then click `Browse Marketplace`.\n\nSearch for `Supabase` and click the Supabase integration.\n\n![Supabase integration](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/vercel/supabase-integration.png)\n\nClick `Add Integration`. Select your account from the `Vercel Scope` dropdown, and click `CONTINUE`.\n\n![Choose scope](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/vercel/choose-scope.png)\n\nChoose `Specific Projects` and select your new Vercel project from the dropdown, and click `Add Integration`.\n\n![Choose project](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/vercel/choose-project.png)\n\nFrom the Supabase popup, select your new Vercel Project and Supabase project from the dropdowns.\n\n![Supabase integration](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/vercel/link-vercel-to-supabase.png)\n\n## Step 3: Clone GitHub repo\n\nThe fastest way to get this project running locally is to clone the repo that Vercel created for us.\n\nNavigate back to the Vercel project `Overview` page, and click `View Git Repository`.\n\n![Vercel Project Dashboard](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/vercel/vercel-project-dashboard.png)\n\nThis will open the GitHub repo. From here, click the arrow next to `Code` and copy the url from the dropdown.\n\n![GitHub repo url](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/vercel/github-project-url.png)\n\nOpen a terminal window or CLI and run the following command to clone the GitHub repo.\n\n```bash\ngit clone your-repo-url.git\n```\n\nOpen the project in your code editor of choice, and update the contents of `pages/index.js` to the following:\n\n```jsx\nimport styles from '../styles/Home.module.css'\n\nexport default function Home() {\n  return \u003cdiv className={styles.container}\u003eworking\u003c/div\u003e\n}\n```\n\nRun a local development server.\n\n```bash\nnpm run dev\n```\n\nNavigate to `http://localhost:3000` to confirm the project is \"working\".\n\n## Step 4: Pull environment variables from Vercel\n\nFirst, we need to login to Vercel using their CLI tool.\n\n```bash\nnpx vercel login\n```\n\nThis will ask if we are happy to install `vercel`. Type `y` and hit `Enter`.\n\nWe will then need to authenticate Vercel by selecting `Continue with GitHub`.\n\nThis will open a browser window where you need to authenticate with your GitHub account.\n\nNext, we need to link our Vercel project.\n\n```bash\nnpx vercel link\n```\n\nStep through the prompts to link the Vercel project.\n\n![Link project from Vercel](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/vercel/vercel-link.png)\n\nCopy the environment variables from our Vercel project.\n\n```bash\nnpx vercel env pull\n```\n\nThis will create a `.env` file containing our Supabase environment variables. Rename this file to `.env.local` to automatically ignore it from git.\n\n## Step 5: Install Supabase.js\n\nInstall the `supabase-js` library.\n\n```bash\nnpm i @supabase/supabase-js\n```\n\nCreate a new file called `/utils/supabase.js` and add the following.\n\n```jsx\nimport { createClient } from '@supabase/supabase-js'\n\nexport default createClient(\n  process.env.NEXT_PUBLIC_SUPABASE_URL,\n  process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY\n)\n```\n\nCreate a new file called `/components/NewTodo.js` and add the following.\n\n```jsx\nimport { useState } from 'react'\nimport supabase from '../utils/supabase'\n\nexport default ({ reload }) =\u003e {\n  const [title, setTitle] = useState('')\n\n  const addTodo = async (e) =\u003e {\n    e.preventDefault()\n    await supabase.from('todos').insert({ title })\n    reload()\n    setTitle('')\n  }\n\n  return (\n    \u003cform onSubmit={addTodo}\u003e\n      \u003cinput value={title} onChange={(e) =\u003e setTitle(e.target.value)} /\u003e\n    \u003c/form\u003e\n  )\n}\n```\n\nThis component will be responsible for writing a new `todo` to Supabase.\n\nLet's import our new component in `pages/index.js` and display a list of todos.\n\n```jsx\nimport { useState, useEffect } from 'react'\nimport styles from '../styles/Home.module.css'\nimport supabase from '../utils/supabase'\nimport NewTodo from '../components/NewTodo'\n\nexport default function Home() {\n  const [todos, setTodos] = useState([])\n\n  const fetchTodos = async () =\u003e {\n    const { data } = await supabase.from('todos').select('*')\n    setTodos(data)\n  }\n\n  useEffect(() =\u003e {\n    fetchTodos()\n  }, [])\n\n  return (\n    \u003cdiv className={styles.container}\u003e\n      \u003cNewTodo reload={fetchTodos} /\u003e\n      {todos.map((todo) =\u003e (\n        \u003cp key={todo.id}\u003e{todo.title}\u003c/p\u003e\n      ))}\n    \u003c/div\u003e\n  )\n}\n```\n\n## Resources\n\n- [Vercel official website](https://vercel.com).\n- [Vercel blog](https://vercel.com/blog).\n- [Vercel docs](https://vercel.com/docs).\n- [Vercel Integration docs](https://vercel.com/docs/integrations)\n"])</script><script>self.__next_f.push([1,"57:T9b7,"])</script><script>self.__next_f.push([1,"Cyberduck is a free and open-source file manager for Windows and macOS that can be used to connect to Supabase Storage S3.\nIn this guide, you'll learn how to connect to Supabase Storage S3 with Cyberduck.\n\n![Supabase Cyberduck](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/cyberduck/cyberduck-files.png)\n\n## Prerequisites\n\nYou'll need valid credentials to connect to Supabase Storage S3. You can generate these credentials from the [Supabase Dashboard](https://supabase.com/dashboard/project/_/settings/storage).\n\n## Download Cyberduck\n\nYou can download Cyberduck from the [Download Page](https://cyberduck.io/download/).\n\n## Configure Cyberduck Profile\n\nTo configure cyberduck to connect to Supabase Storage S3 you need to create a custom profile.\n\nCopy the following profile into a file called `supabase.cyberduckprofile`\n\n```xml\n\u003c?xml version=\"1.0\" encoding=\"UTF-8\"?\u003e\n\u003c!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\"\u003e\n\u003cplist version=\"1.0\"\u003e\n    \u003cdict\u003e\n        \u003ckey\u003eProtocol\u003c/key\u003e\n        \u003cstring\u003es3\u003c/string\u003e\n        \u003ckey\u003eVendor\u003c/key\u003e\n        \u003cstring\u003eSupabase Storage S3\u003c/string\u003e\n        \u003ckey\u003eScheme\u003c/key\u003e\n        \u003cstring\u003ehttps\u003c/string\u003e\n        \u003ckey\u003eDescription\u003c/key\u003e\n        \u003cstring\u003eSupabase Storage (S3)\u003c/string\u003e\n        \u003ckey\u003eDefault Hostname\u003c/key\u003e\n        \u003cstring\u003eYOUR_PROJECT_REF.supabase.co\u003c/string\u003e\n        \u003ckey\u003eDefault Port\u003c/key\u003e\n        \u003cstring\u003e443\u003c/string\u003e\n        \u003ckey\u003eRegion\u003c/key\u003e\n        \u003cstring\u003eYOUR_REGION\u003c/string\u003e\n        \u003ckey\u003eProperties\u003c/key\u003e\n        \u003carray\u003e\n            \u003cstring\u003es3.storage.class.options=STANDARD\u003c/string\u003e\n            \u003cstring\u003es3.bucket.virtualhost.disable=true\u003c/string\u003e\n        \u003c/array\u003e\n        \u003ckey\u003eContext\u003c/key\u003e\n        \u003cstring\u003e/storage/v1/s3\u003c/string\u003e\n        \u003ckey\u003eHelp\u003c/key\u003e\n        \u003cstring\u003ehttps://supabase.com/docs/guides/storage\u003c/string\u003e\n    \u003c/dict\u003e\n\u003c/plist\u003e\n```\n\nChange the following values in the profile:\n\n- `YOUR_PROJECT_REF` with your Supabase project reference.\n- `YOUR_REGION` with your Supabase region.\n\nSave the profile and double click on the file to open it with Cyberduck.\n\n## Connect to Supabase Storage S3\n\nYou'll be presented with the following screen, fill in the `Access Key ID` and the `Secret Access Key` with your credentials.\n\n![credentials](https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/cyberduck/credentials.png)\n\nClose the window, and double click on the profile to connect to Supabase Storage S3.\n"])</script><script>self.__next_f.push([1,"58:T4c2,"])</script><script>self.__next_f.push([1,"[BigQuery](https://cloud.google.com/bigquery) is Google Cloud's autonomous data and AI platform: a serverless data warehouse built for petabyte-scale analytics, with built-in ML, multimodal data support, and Gemini-powered AI features. It's where teams run large analytical workloads that don't belong in an operational database.\n\nThe BigQuery Wrapper brings that warehouse into your Postgres database. Query BigQuery tables and views directly with SQL, write data back from Postgres, and join warehouse results against your live application data. No ETL pipelines, no data movement, no scheduled syncs.\n\nSupports both read and write operations, and works with Supabase Vault for secure service account credential management.\n\n### Supported Operations\n\n| Operation | Supported |\n| --- | --- |\n| Select | ✅ |\n| Insert | ✅ |\n| Update | ✅ |\n| Delete | ✅ |\n\n### Supported Data Types\n\n| Postgres Type | BigQuery Type |\n| --- | --- |\n| boolean | BOOL |\n| bigint | INT64 |\n| double precision | FLOAT64 |\n| numeric | NUMERIC |\n| text | STRING |\n| varchar | STRING |\n| date | DATE |\n| timestamp | DATETIME |\n| timestamp | TIMESTAMP |\n\n### Resources\n\n- [supabase/wrappers on GitHub](https://github.com/supabase/wrappers)"])</script><script>self.__next_f.push([1,"6:[\"$\",\"$e\",null,{\"children\":[\"$\",\"$L12\",null,{\"initialPartners\":[{\"slug\":\"springtail\",\"title\":\"Springtail\",\"builtBy\":\"Springtail\",\"description\":\"Real time, elastic read replicas to your Supabase database.\",\"content\":\"$13\",\"websiteUrl\":\"https://springtail.io\",\"docsUrl\":\"https://docs.springtail.io\",\"installUrl\":\"https://www.springtail.io/request?utm rating-postmark-with-supabase-via-smtp \",\"installUrl\":\"https://postmarkapp.com?utm_source=supabase\u0026utm_medium=partner_referral\u0026utm_campaign=integration_partner_program\u0026utm_content=add_integration_button\",\"logo\":\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/partners/postmark-by-activecampaign/logo.png\",\"images\":[\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/postmark-by-activecampaign/postmark1.png\",\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/postmark-by-activecampaign/postmark2.png\",\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/postmark-by-activecampaign/postmark3.jpeg\"],\"youtubeId\":null,\"type\":\"technology\",\"categories\":[{\"name\":\"DevTools\",\"slug\":\"devtools\"}],\"featured\":false,\"publishedInCatalog\":true,\"publishedInMarketplace\":false},{\"slug\":\"gravatar\",\"title\":\"Gravatar\",\"builtBy\":\"Gravatar\",\"description\":\"Query public Gravatar profiles directly from Postgres using a WebAssembly-powered Foreign Data Wrapper.\",\"content\":\"[Gravatar](https://gravatar.com/) is Automattic's globally recognized avatar service. Users create a profile once and it follows them across any Gravatar-enabled site, providing a consistent identity including avatar images, display names, job titles, verified accounts, and more.\\n\\nThe Gravatar Wrapper lets you look up public Gravatar profile data directly from Postgres by email address. Query avatar URLs, display names, locations, verified accounts, and contact info with plain SQL and join them against your application data. All queries require an `email =` condition and return no results without one. It is read-only and works with Supabase Vault for secure API key management. This wrapper is contributed and maintained by [Automattic](https://github.com/Automattic/gravatar-wasm-fdw).\\n\\n### Resources\\n\\n- [supabase/wrappers on GitHub] avu.dev?utm_source=supabase\u0026utm_medium=partner_referral\u0026utm_campaign=integration_partner_program\u0026utm_content=add_integration_button\",\"logo\":\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/partners/zavu/logo.svg\",\"images\":[\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/zavu/dashboard.jpg\",\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/zavu/inbox.jpg\",\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/zavu/tester.jpg\"],\"youtubeId\":null,\"type\":\"technology\",\"categories\":[{\"name\":\"Messaging\",\"slug\":\"messaging\"}],\"featured\":false,\"publishedInCatalog\":true,\"publishedInMarketplace\":false},{\"slug\":\"refine\",\"title\":\"refine\",\"builtBy\":\"refine\",\"description\":\"Build your React-based CRUD applications, without constraints.\",\"content\":\"refine is a React-based framework for the rapid development of web applications. It eliminates repetitive tasks demanded by CRUD operations and provides industry standard solutions for critical parts like authentication, access control, routing, networking, state management, and i18n.\\n\\nrefine is headless by design, thereby offering unlimited styling and customization options.\\n\\nrefine offers built-in data provider support for Supabase and handles all required data service methods out-of-the-box.\",\"websiteUrl\":\"https://supabase.com\",\"docsUrl\":\"https://refine.dev/docs/packages/documentation/data-providers/supabase/\",\"installUrl\":null,\"logo\":\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/partners/refine/logo.jpeg\",\"images\":[\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/refine/refine_landing.png\",\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/refine/refine_og.png\",\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/refine/refine_selection.png\"],\"youtubeId\":null,\"type\":\"technology\",\"categories\":[{\"name\":\"DevTools\",\"slug\":\"devtools\"}],\"featured\":false,\"publishedInCatalog\":true,\"publishedInMarketplace\":false},{\"slug\":\"streamlit\",\"title\":\"Streamlit\",\"builtBy\":\"Streamlit\",\"description\":\"Streamlit turns data scripts into shareable web apps in minutes. All in pure Python. No front‑end experience required.\",\"content\":\"Securely access a Supabase instance from Streamlit Cloud. It uses the Supabase Python Client Library and Streamlit's secrets management. \",\"websiteUrl\":\"streamlit.io\",\"docsUrl\":\"https://docs.streamlit.io/knowledge-base/tutorials/databases/supabase\",\"installUrl\":null,\"logo\":\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/partners/streamlit/logo.png\",\"images\":[\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/streamlit/streamlit_supabase.png\"],\"youtubeId\":null,\"type\":\"technology\",\"categories\":[{\"name\":\"DevTools\",\"slug\":\"devtools\"}],\"featured\":false,\"publishedInCatalog\":true,\"publishedInMarketplace\":false},{\"slug\":\"chartdb\",\"title\":\"ChartDB\",\"builtBy\":\"ChartDB\",\"description\":\"Visualize and understand your database schema as an interactive ER diagram.\",\"content\":\"### How ChartDB works with Supabase\\nOnce connected, ChartDB securely reads your Supabase Postgres schema and automatically generates an ER diagram with tables, columns, indexes, and relationships.\\nCommon use cases for Supabase users include:\\n- Visualizing complex schemas as projects grow\\n- Reviewing and planning schema changes before applying migrations\\n- Sharing a clear database overview with teammates or stakeholders\\n- Reducing onboarding time for new developers\\n\\n### Getting started\\n1. Connect your Supabase project using OAuth\\n2. Select the database you want to visualize\\n3. ChartDB automatically imports the schema and generates a diagram\\n4. Explore, group tables, annotate, and export or share the diagram\\nNo manual queries or exports required.\\n\",\"websiteUrl\":\"https://chartdb.io\",\"docsUrl\":\"https://docs.chartdb.io\",\"installUrl\":\"https://docs.chartdb.io/docs/integrations/supabase?utm_source=supabase\u0026utm_medium=partner_referral\u0026utm_campaign=integration_partner_program\u0026utm_content=add_integration_button\",\"logo\":\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/partners/chartdb/logo.png\",\"images\":[\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/chartdb/supabase-chartdb-cover.png\"],\"youtubeId\":\"DSKregMsU1E\",\"type\":\"technology\",\"categories\":[{\"name\":\"DevTools\",\"slug\":\"devtools\"}],\"featured\":false,\"publishedInCatalog\":true,\"publishedInMarketplace\":false},{\"slug\":\"calendly\",\"title\":\"Calendly\",\"builtBy\":\"Calendly\",\"description\":\"Scheduling automation platform for booking meetings.\",\"content\":\"[Calendly](https://calendly.com/) is a scheduling automation platform used by teams to schedule, prepare for, and follow up on external meetings. It removes the back-and-forth of finding meeting times and integrates with calendars, CRMs, and workflows across the stack.\\n\\nThe Calendly Wrapper brings your scheduling data into Postgres as queryable foreign tables. Query scheduled events, event types, organization memberships, and more with plain SQL and join them against your application data. All objects are read-only, and the wrapper works with Supabase Vault for secure token management and is built on WebAssembly (Wasm) for lightweight, sandboxed execution.\\n\\n### Resources\\n\\n- [supabase/wrappers on GitHub](https://github.com/supabase/wrappers)\",\"websiteUrl\":\"https://calendly.com\",\"docsUrl\":\"https://supabase.com/docs/guides/database/extensions/wrappers/calendly\",\"installUrl\":\"https://supabase.com/dashboard/project/_/integrations/calendly_wrap ple CRUD app auto-generated on top of your data in a minute\\n* Build complex, multi-page apps without code\\n* Consolidate data from different data sources (join with SQL or through lookup/rollups)\\n* Write JS, HTTP, SQL, and embed custom components when needed, and more\",\"websiteUrl\":\"jetadmin.io\",\"docsUrl\":\"https://docs.jetadmin.io/user-guide/integrations/supabase?utm_source=supabase\u0026utm_medium=supabase\u0026utm_campaign=supabase\u0026utm_id=supabase\",\"installUrl\":null,\"logo\":\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/partners/jet-admin/logo.png\",\"images\":[\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/jet-admin/Jet_admin_1.png\",\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/jet-admin/Jet_admin_2.png\",\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/jet-admin/Jet_admin_3.png\",\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/jet-admin/jetadmin_og.png\"],\"youtubeId\":\"aZ0oPbFGVBU\",\"type\":\"technology\",\"categories\":[{\"name\":\"Low-Code\",\"slug\":\"low-code\"}],\"featured\":false,\"publishedInCatalog\":true,\"publishedInMarketplace\":false},{\"slug\":\"dhiwise\",\"title\":\"DhiWise\",\"builtBy\":\"DhiWise\",\"description\":\"Visual programming platform to develop enterprise-grade applications in low-code and pro-code simultaneously.\",\"content\":\"$33\",\"websiteUrl\":\"dhiwise.com\",\"docsUrl\":\"https://docs.dhiwise.com/docs/flutter/supabase-integration\",\"installUrl\":null,\"logo\":\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/partners/dhiwise/logo.jpeg\",\"images\":[\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/dhiwise/dhiwise_og.jpeg\"],\"youtubeId\":\"1G-TjP721Cs\",\"type\":\"technology\",\"categories\":[{\"name\":\"DevTools\",\"slug\":\"devtools\"}],\"featured\":false,\"publishedInCatalog\":true,\"publishedInMarketplace\":false},{\"slug\":\"orb\",\"title\":\"Orb\",\"builtBy\":\"Orb\",\"description\":\"Usage-based billing and metering platform.\",\"content\":\"[Orb](https://withorb.com/) is a billing infrastructure platform built for usage-based pricing models. It gives engineering, product, and finance teams the tools to automate billing, iterate on pricing, and connect metered usage to revenue, without lengthy implementations or custom pipelines.\\n\\nThe Orb Wrapper brings your Orb billing data into Postgres as queryable foreign tables. Query subscriptions, invoices, customers, usage events, and more with plain SQL and join them against your application data. The wrapper works with Supabase Vault for secure API key management and is built on WebAssembly (Wasm) for lightweight, sandboxed execution.\\n\\n### Resources\\n\\n- [supabase/wrappers on GitHub](https://github.com/supabase/wrappers)\",\"websiteUrl\":\"https://www.withorb.com\",\"docsUrl\":\"https://supabase.com/docs/guides/database/extensions/wrappers/orb\",\"installUrl\":\"https://supabase.com/dashboard/project/_/integrations/orb_wrapper/overview?utm_source=supabase\u0026utm_medium=partner_referral\u0026utm_campaign=integration_partner_program\u0026utm_content=add_integration_button\",\"logo\":\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/partners/orb/logo.svg\",\"images\":[],\"youtubeId\":null,\"type\":\"technology\",\"categories\":[{\"name\":\"Foreign Data Wrapper\",\"slug\":\"foreign-data-wrapper\"}],\"featured\":false,\"publishedInCatalog\":true,\"publishedInMarketplace\":true},{\"slug\":\"powersync\",\"title\":\"PowerSync\",\"builtBy\":\"PowerSync\",\"description\":\"PowerSync is a drop-in sync layer for making apps built on Supabase work offline-first.\",\"content\":\"$34\",\"websiteUrl\":\"http://powersync.com/\",\"docsUrl\":\"https://docs.powersync.co/integration-guides/supabase-+-powersync\",\"installUrl\":\"https://docs.powersync.co/integration-guides/supabase-+-powersync?utm_source=supabase\u0026utm_medium=partner_referral\u0026utm_campaign=integration_partner_program\u0026utm_content=add_integration_button\",\"logo\":\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/partners/powersync/logo.webp\",\"images\":[\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/powersync/powersync-diagram-supabase-integration.png\",\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/powersync/powersync-img-supabase-integration.png\",\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/powersync/powersync-screenshot-supabase-integration.png\"],\"youtubeId\":\"hAfnkw4PEM4\",\"type\":\"technology\",\"categories\":[{\"name\":\"Caching / Offline-First\",\"slug\":\"caching-offline-first\"}],\"featured\":true,\"publishedInCatalog\":true,\"publishedInMarketplace\":false},{\"slug\":\"anthropic\",\"title\":\"Anthropic\",\"builtBy\":\"Anthropic\",\"description\":\"Anthropic is an AI safety and research company working to build reliable, interpretable, and steerable AI systems.\",\"content\":\"Claude is Anthropic's AI assistant, used through chat, the desktop and mobile apps, and Claude Code for hands-on engineering work. People already ask it to reason through problems and write code. The Supabase integration lets it act on a real project too.\\n\\nTalking through a schema change is one thing. Having Claude actually make it is another. Connect your Supabase project and Claude can run SQL queries, design tables, deploy Edge Functions, and manage your project directly from the conversation, instead of just describing what you'd need to do yourself.\\n\\nOnce connected, you can ask Claude to design and modify table schemas, execute SQL queries and generate migrations, generate TypeScript types straight from your schema, deploy Edge Functions, create and manage branches, pull real-time logs for debugging, and run security and performance advisors to catch issues before they ship. You can also list, create, pause, and restore projects, and get cost estimates, all without leaving the conversation.\",\"websiteUrl\":\"https://www.anthropic.com/\",\"docsUrl\":\"https://supabase.com/docs/guides/getting-started/mcp\",\"installUrl\":null,\"logo\":\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/partners/anthropic/logo.jpeg\",\"images\":[],\"youtubeId\":null,\"type\":\"technology\",\"categories\":[{\"name\":\"AI\",\"slug\":\"ai\"}],\"featured\":false,\"publishedInCatalog\":true,\"publishedInMarketplace\":false},{\"slug\":\"redis\",\"title\":\"Redis\",\"builtBy\":\"Redis\",\"description\":\"In-memory data store used as a database, cache, and message broker.\",\"content\":\"[Redis](https://redis.io/) is an open-source in-memory data store used as a distributed cache, key-value database, and message broker. It supports rich data structures including strings, hashes, lists, sets, sorted sets, and streams, with optional durability and sub-millisecond latency at scale.\\n\\nThe Redis Wrapper brings your Redis data into Postgres as queryable foreign tables. Query lists, sets, hashes, sorted sets, and streams with plain SQL and join them against your application data. Read-only, and works with Supabase Vault for secure connection URL management.\\n\\n### Supported Data Types\\n\\n| Redis Type | Postgres Type |\\n| --- | --- |\\n| list | text, jsonb |\\n| set | text, jsonb |\\n| hash | text, jsonb |\\n| zset | text, jsonb |\\n| stream | text, jsonb |\\n\\n### Resources\\n\\n- [Official `supabase/wrappers` documentation: Redis](https://supabase.github.io/wrappers/catalog/redis/)\",\"websiteUrl\":\"https://redis.io\",\"docsUrl\":\"https://supabase.com/docs/guides/database/extensions/wrappers/redis\",\"installUrl\":\"https://supabase.com/dashboard/project/_/integrations/redis_wrapper/overview?utm_source=supabase\u0026utm_medium=partner_referral\u0026utm_campaign=integration_part og\":true,\"publishedInMarketplace\":false},{\"slug\":\"hubspot\",\"title\":\"HubSpot\",\"builtBy\":\"HubSpot\",\"description\":\"CRM platform for marketing, sales, and customer service.\",\"content\":\"[HubSpot](https://www.hubspot.com/) is a unified customer platform covering marketing, sales, content, and service. It gives teams the tools to attract, engage, and retain customers, with a shared CRM at the center connecting data across every team and touchpoint.\\n\\nThe HubSpot Wrapper brings your CRM data into Postgres as queryable foreign tables. Query contacts, companies, deals, tickets, and more with plain SQL and join them against your application data. The wrapper works with Supabase Vault for secure token management and is built on WebAssembly (Wasm) for lightweight, sandboxed execution.\\n\\n### Resources\\n\\n- [supabase/wrappers on GitHub](https://github.com/supabase/wrappers)\",\"websiteUrl\":\"https://www.hubspot.com\",\"docsUrl\":\"https://supabase.com/docs/guides/database/extensions/wrappers/hubspot\",\"installUrl\":\"https://supabase.com/dashboard/project/_/integrations/hubspot_wrapper/overview?utm_source=supabase\u0026utm_medium=partner_referral\u0026utm_campaign=integration_partner_program\u0026utm_content=add_integration_button\",\"logo\":\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/partners/hubspot/logo.svg\",\"images\":[],\"youtubeId\":null,\"type\":\"technology\",\"categories\":[{\"name\":\"Foreign Data Wrapper\",\"slug\":\"foreign-data-wrapper\"}],\"featured\":false,\"publishedInCatalog\":true,\"publishedInMarketplace\":true},{\"slug\":\"dezbor\",\"title\":\"Dezbor\",\"builtBy\":\"Dezbor\",\"description\":\"Build your Admin Panel with AI.\",\"content\":\"Build dashboards and admin panels in an instant!\\n\\nDezbor seamlessly synchronizes with Supabase to help you build your personalized dashboard and admin panel without having to write a single line of code. Our platform incorporates AI-driven solutions, allowing users to leverage artificial intelligence in building queries and analyzing data. The intuitive interface makes the process of creating complex dashboards quite straightforward, eliminating the need for any technical expertise - it's as simple as a drag-and-drop operation and a few clicks.\",\"websiteUrl\":\"https://supabase.com\",\"docsUrl\":\"https://dezbor.com/integrations/supabase\",\"installUrl\":\"https://dezbor.com/integrations/supabase?utm_source=supabase\u0026utm_medium=partner_referral\u0026utm_campaign=integration_partner_program\u0026utm_content=add_integration_button\",\"logo\":\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/partners/dezbor/logo.jpeg\",\"images\":[\"https://otqhrpbxhxkrhrnjqbba.supabase.co/storage/v1/object/public/images/listings/dezbor/dezbor_og.webp\"],\"youtubeId\":\"PrGCoAWnrBM\",\"type\":\"technology\",\"categories\":[{\"name\":\"Low-Code\",\"slug\":\"low-code\"}],\"featured\":false,\"publishedInCatalog\":true,\"publishedInMarketplace\":false},{\"slug\":\"algolia\",\"title\":\"Algolia\",\"builtBy\":\"Algolia\",\"description\":\"Algolia lets you add lightning-fast search to your app.\",\"content\":\"Algolia lets you add lightning-fast search to your app with just a few lines of code. It handles typo-tolerance, filters, facets, and ranking out of the box — so your users find what they need, fast.\\n\\nAlgolia connects to your Supabase database to sync your data to an Algolia index. Algolia’s integration allows you to specify which tables, views and columns you want to index. You also have the ability to update the index regularly with scheduled runs or manually request a reindex. Most importantly, you can keep your data in-sync with Algolia without having to write any code, ELT process or cron worker.\",\"websiteUrl\":\"https://www.algolia.com\",\"docsUrl\":\"https://www.algolia.com/doc/guides/sending-and-managing-data/send-and-update-your-data/connectors/supabase\",\"installUrl\":null,\"logo\":\"https://o
